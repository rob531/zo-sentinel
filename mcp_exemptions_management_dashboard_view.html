<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Exemptions Management Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .form-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input, textarea {
            width: 200px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>MCP Exemptions Management Dashboard</h1>

    <div id="exemptions-table-container">
        <table id="exemptions-table">
            <thead>
                <tr>
                    <th>MCP Name</th>
                    <th>Reason</th>
                    <th>Expires At</th>
                    <th>Created By</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="exemptions-table-body">
                <!-- Exemptions will be loaded here via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="form-container" id="add-exemption-form-container">
        <h2>Add New Exemption</h2>
        <form id="add-exemption-form">
            <div class="form-group">
                <label for="add-mcp-name">MCP Name:</label>
                <input type="text" id="add-mcp-name" name="mcp_name" required>
            </div>
            <div class="form-group">
                <label for="add-reason">Reason:</label>
                <textarea id="add-reason" name="reason" required></textarea>
            </div>
            <div class="form-group">
                <label for="add-expires-at">Expires At:</label>
                <input type="datetime-local" id="add-expires-at" name="expires_at" required>
            </div>
            <div class="form-group">
                <label for="add-created-by">Created By:</label>
                <input type="text" id="add-created-by" name="created_by" required>
            </div>
            <button type="submit">Add Exemption</button>
        </form>
    </div>

    <div class="form-container" id="edit-exemption-form-container" style="display: none;">
        <h2>Edit Exemption</h2>
        <form id="edit-exemption-form">
            <input type="hidden" id="edit-exemption-id" name="id">
            <div class="form-group">
                <label for="edit-mcp-name">MCP Name:</label>
                <input type="text" id="edit-mcp-name" name="mcp_name" required>
            </div>
            <div class="form-group">
                <label for="edit-reason">Reason:</label>
                <textarea id="edit-reason" name="reason" required></textarea>
            </div>
            <div class="form-group">
                <label for="edit-expires-at">Expires At:</label>
                <input type="datetime-local" id="edit-expires-at" name="expires_at" required>
            </div>
            <div class="form-group">
                <label for="edit-created-by">Created By:</label>
                <input type="text" id="edit-created-by" name="created_by" required>
            </div>
            <button type="submit">Update Exemption</button>
            <button type="button" id="cancel-edit">Cancel</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load exemptions on page load
            loadExemptions();

            // Add exemption form submission
            document.getElementById('add-exemption-form').addEventListener('submit', function(e) {
                e.preventDefault();
                addExemption();
            });

            // Edit exemption form submission
            document.getElementById('edit-exemption-form').addEventListener('submit', function(e) {
                e.preventDefault();
                updateExemption();
            });

            // Cancel edit button
            document.getElementById('cancel-edit').addEventListener('click', function() {
                document.getElementById('edit-exemption-form-container').style.display = 'none';
                document.getElementById('add-exemption-form-container').style.display = 'block';
            });
        });

        function loadExemptions() {
            fetch('http://localhost:5000/api/mcp_exemptions')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('exemptions-table-body');
                    tableBody.innerHTML = '';

                    data.forEach(exemption => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${exemption.mcp_name}</td>
                            <td>${exemption.reason}</td>
                            <td>${new Date(exemption.expires_at).toLocaleString()}</td>
                            <td>${exemption.created_by}</td>
                            <td>
                                <button onclick="editExemption(${exemption.id})">Edit</button>
                                <button onclick="deleteExemption(${exemption.id})">Delete</button>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error loading exemptions:', error));
        }

        function addExemption() {
            const form = document.getElementById('add-exemption-form');
            const formData = new FormData(form);

            fetch('http://localhost:5000/api/mcp_exemptions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    mcp_name: formData.get('mcp_name'),
                    reason: formData.get('reason'),
                    expires_at: formData.get('expires_at'),
                    created_by: formData.get('created_by')
                })
            })
            .then(response => response.json())
            .then(() => {
                form.reset();
                loadExemptions();
            })
            .catch(error => console.error('Error adding exemption:', error));
        }

        function editExemption(id) {
            fetch(`http://localhost:5000/api/mcp_exemptions/${id}`)
                .then(response => response.json())
                .then(exemption => {
                    document.getElementById('edit-exemption-id').value = exemption.id;
                    document.getElementById('edit-mcp-name').value = exemption.mcp_name;
                    document.getElementById('edit-reason').value = exemption.reason;
                    document.getElementById('edit-expires-at').value = new Date(exemption.expires_at).toISOString().slice(0, 16);
                    document.getElementById('edit-created-by').value = exemption.created_by;

                    document.getElementById('add-exemption-form-container').style.display = 'none';
                    document.getElementById('edit-exemption-form-container').style.display = 'block';
                })
                .catch(error => console.error('Error loading exemption for edit:', error));
        }

        function updateExemption() {
            const form = document.getElementById('edit-exemption-form');
            const formData = new FormData(form);
            const id = formData.get('id');

            fetch(`http://localhost:5000/api/mcp_exemptions/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    mcp_name: formData.get('mcp_name'),
                    reason: formData.get('reason'),
                    expires_at: formData.get('expires_at'),
                    created_by: formData.get('created_by')
                })
            })
            .then(response => response.json())
            .then(() => {
                document.getElementById('edit-exemption-form-container').style.display = 'none';
                document.getElementById('add-exemption-form-container').style.display = 'block';
                loadExemptions();
            })
            .catch(error => console.error('Error updating exemption:', error));
        }

        function deleteExemption(id) {
            if (confirm('Are you sure you want to delete this exemption?')) {
                fetch(`http://localhost:5000/api/mcp_exemptions/${id}`, {
                    method: 'DELETE'
                })
                .then(() => {
                    loadExemptions();
                })
                .catch(error => console.error('Error deleting exemption:', error));
            }
        }
    </script>
</body>
</html>

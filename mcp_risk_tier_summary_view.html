<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tier Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .summary-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .summary-box {
            width: 48%;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .chart-container {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            margin-top: 20px;
        }
        .legend {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 0 10px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Risk Tier Summary</h1>
    <div class="summary-container">
        <div class="summary-box">
            <h2>Average Risk Score</h2>
            <div id="average-score">Loading...</div>
        </div>
        <div class="summary-box">
            <h2>Tier Distribution</h2>
            <div id="tier-distribution">Loading...</div>
        </div>
    </div>
    <div class="chart-container" id="chart"></div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: #FF6384;"></div>
            <span>High Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #36A2EB;"></div>
            <span>Medium Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #FFCE56;"></div>
            <span>Low Risk</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/risk-tiers/summary')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('average-score').textContent = data.average_score.toFixed(2);

                    const tiers = data.tier_distribution;
                    const total = tiers.high + tiers.medium + tiers.low;
                    const highPercent = (tiers.high / total * 100).toFixed(1);
                    const mediumPercent = (tiers.medium / total * 100).toFixed(1);
                    const lowPercent = (tiers.low / total * 100).toFixed(1);

                    document.getElementById('tier-distribution').innerHTML = `
                        High: ${highPercent}%<br>
                        Medium: ${mediumPercent}%<br>
                        Low: ${lowPercent}%
                    `;

                    drawChart(tiers);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('average-score').textContent = 'Error loading data';
                    document.getElementById('tier-distribution').textContent = 'Error loading data';
                });
        });

        function drawChart(tiers) {
            const canvas = document.getElementById('chart');
            const ctx = canvas.getContext('2d');

            const total = tiers.high + tiers.medium + tiers.low;
            const highAngle = (tiers.high / total) * 2 * Math.PI;
            const mediumAngle = (tiers.medium / total) * 2 * Math.PI;
            const lowAngle = (tiers.low / total) * 2 * Math.PI;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Low Risk
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height / 2);
            ctx.arc(canvas.width / 2, canvas.height / 2, 100, 0, lowAngle);
            ctx.closePath();
            ctx.fillStyle = '#FFCE56';
            ctx.fill();

            // Draw Medium Risk
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height / 2);
            ctx.arc(canvas.width / 2, canvas.height / 2, 100, lowAngle, lowAngle + mediumAngle);
            ctx.closePath();
            ctx.fillStyle = '#36A2EB';
            ctx.fill();

            // Draw High Risk
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height / 2);
            ctx.arc(canvas.width / 2, canvas.height / 2, 100, lowAngle + mediumAngle, 2 * Math.PI);
            ctx.closePath();
            ctx.fillStyle = '#FF6384';
            ctx.fill();

            // Draw center circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 30, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Definition History Population Health</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .dashboard {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .metric {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            background: #e9e9e9;
        }
        .metric-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.2em;
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
        }
        .success {
            background: #4CAF50;
        }
        .failure {
            background: #F44336;
        }
        .timestamp {
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>MCP Definition History Population Health</h1>
        </div>
        <div class="metric">
            <div class="metric-title">Last Successful Run</div>
            <div class="metric-value" id="last-successful-run">Loading...</div>
            <div class="timestamp" id="last-successful-run-timestamp">Loading...</div>
        </div>
        <div class="metric">
            <div class="metric-title">Last Failed Run</div>
            <div class="metric-value" id="last-failed-run">Loading...</div>
            <div class="timestamp" id="last-failed-run-timestamp">Loading...</div>
        </div>
        <div class="metric">
            <div class="metric-title">Current Row Count</div>
            <div class="metric-value" id="current-row-count">Loading...</div>
            <div class="timestamp" id="current-row-count-timestamp">Loading...</div>
        </div>
        <div class="metric">
            <div class="metric-title">Error Messages</div>
            <div class="metric-value" id="error-messages">Loading...</div>
        </div>
    </div>

    <script>
        // Function to fetch data from the API
        async function fetchData() {
            try {
                const response = await fetch('http://localhost:5000/mcp_definition_history_report_api');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('last-successful-run').textContent = 'Error loading data';
                document.getElementById('last-failed-run').textContent = 'Error loading data';
                document.getElementById('current-row-count').textContent = 'Error loading data';
                document.getElementById('error-messages').textContent = 'Error loading data';
            }
        }

        // Function to update the dashboard with fetched data
        function updateDashboard(data) {
            document.getElementById('last-successful-run').textContent = data.last_successful_run.status;
            document.getElementById('last-successful-run-timestamp').textContent = `Timestamp: ${data.last_successful_run.timestamp}`;

            document.getElementById('last-failed-run').textContent = data.last_failed_run.status;
            document.getElementById('last-failed-run-timestamp').textContent = `Timestamp: ${data.last_failed_run.timestamp}`;

            document.getElementById('current-row-count').textContent = data.current_row_count.count;
            document.getElementById('current-row-count-timestamp').textContent = `Timestamp: ${data.current_row_count.timestamp}`;

            document.getElementById('error-messages').textContent = data.error_messages.messages.join(', ') || 'No errors';
        }

        // Fetch data initially and then every 30 seconds
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>

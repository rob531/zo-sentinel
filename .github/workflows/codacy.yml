name: codacy

# Runs the Codacy Analysis CLI and uploads results as SARIF to GitHub Code
# Scanning. This routes Codacy issues through the same code_scanning_alert
# event that copilot-autofix-commit.yml listens on — so Codacy alerts get
# the same zero-click Copilot Autofix treatment as CodeQL and Bandit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 04 * * 1'   # Monday 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  codacy:
    name: Codacy Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

name: pr-relander

# The missing half of the landing chain (LOCO_CHAIRMAN.md §13, gap GR-13).
#
# Chain today: builder opens auto/build/* PRs -> pr-triage labels exactly one
# of triage:{solid,dup,scaffold,stale} -> auto-merge lands the solids. Two
# recorded failure modes, BOTH handled here:
#
#   (1) BASE-branch breakage (tools/pr_triage.py:179): every open PR inherits
#       the red gate, the cohort is labelled triage:stale, and when main
#       recovers NOTHING re-runs their checks -- no push event ever arrives on
#       those heads, so they stay stale forever.
#
#   (2) MISSING-CONTEXT deadlock (found 2026-09-01, 140 PRs): a PR labelled
#       triage:solid whose head is missing a REQUIRED status context sits at
#       mergeStateStatus=BLOCKED permanently. Branch protection treats an
#       unreported required context as "Expected -- waiting for status", which
#       never resolves. These PRs are NOT stale, so failure-mode-(1) handling
#       never looked at them and they accumulated silently.
#
# This workflow closes both loops: whenever main moves (and on a sweep
# cadence), refresh every open autonomous-build PR that is either
# stale-but-clean OR solid-but-missing-required-contexts.
#
# REFRESH MECHANISM -- two paths, chosen per PR:
#   * behind_by > 0  -> `gh pr update-branch`. The merge commit re-fires gates.
#   * behind_by == 0 -> update-branch is a no-op error ("already up to date"),
#     so instead close+reopen the PR. The `reopened` activity type re-fires
#     every `on: pull_request` workflow. Measured 2026-09-01: ~12% of the
#     solid-BLOCKED cohort is already level with main and is reachable ONLY
#     this way. Requires the PAT -- see the recursion guard below.
#
# RECURSION GUARD (measured on run #1, 2026-08-29): pushes and PR events made
# with the default GITHUB_TOKEN never fire push/pull_request workflows -- the
# update-branch merge commits produced only ghost "action_required" workflow
# runs with zero jobs. Two escapes:
#   (a) if a RELANDER_TOKEN secret (fine-grained PAT: Contents RW,
#       Pull requests RW, Workflows NO ACCESS) exists, refreshes use it and the
#       resulting synchronize/reopened event fires EVERY workflow natively --
#       full fidelity, including the PR-context-only no-hollow / schema-prm /
#       referent-verify.
#   (b) with only GITHUB_TOKEN, after each update we workflow_dispatch
#       pr-gates.yml + evaluator.yml on the head branch (dispatch is exempt
#       from the guard).
#
# ---------------------------------------------------------------------------
# DRIFT GUARD (gap that caused failure mode 2)
# ---------------------------------------------------------------------------
# Fallback (b) can only produce the contexts carried by pr-gates + evaluator.
# On 2026-08-29 that was the complete required set, and this file said so in a
# comment. Branch protection later gained no-hollow, schema-prm and
# referent-verify as required -- none of them dispatchable -- and the comment
# silently became false. Nothing detected the drift; 140 PRs deadlocked.
#
# The preflight job below now DERIVES the required set from branch protection
# at run time and fails loudly when it is not a subset of what this workflow
# can actually produce in its current mode. A comment cannot go stale if the
# machine re-derives it every run.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 */6 * * *"   # sweep, offset from pr-triage's 17 */6
  workflow_dispatch:
    inputs:
      reland_cap:
        description: "Max PRs to refresh this run"
        required: false
        default: "40"

permissions:
  contents: write
  pull-requests: write
  actions: write    # workflow_dispatch of pr-gates/evaluator on relanded heads
  checks: read
  # NOTE: there is deliberately no 'administration' key here. GITHUB_TOKEN has
  # no such permission scope -- the valid set is actions/attestations/checks/
  # contents/deployments/discussions/id-token/issues/models/packages/pages/
  # pull-requests/repository-projects/security-events/statuses. Adding it makes
  # the workflow file INVALID: GitHub fails the run instantly with zero jobs and
  # no annotation, which looks exactly like a ghost run. (Learned the hard way,
  # run 33553962560.) Branch protection therefore cannot be read by GITHUB_TOKEN
  # at all; see the resolution ladder in preflight.

concurrency:
  group: pr-relander
  cancel-in-progress: true

env:
  # Contexts that fallback (b) can produce, i.e. those carried by the two
  # dispatchable workflows. Keep in sync with pr-gates.yml + evaluator.yml.
  DISPATCHABLE: "capmap-check static-analysis smoke-ladder frontend pytest"
  # Last-resort required set, used ONLY if both token paths fail to read branch
  # protection. Staleness here is caught by the guard below, which compares this
  # against the live set whenever the live set is readable.
  REQUIRED_FALLBACK: "capmap-check static-analysis smoke-ladder frontend pytest no-hollow schema-prm referent-verify"

jobs:
  preflight:
    name: Required-context drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      required: ${{ steps.drift.outputs.required }}
      have_pat: ${{ steps.drift.outputs.have_pat }}
    steps:
      - name: Derive required contexts and check reachability
        id: drift
        env:
          GH_TOKEN: ${{ secrets.RELANDER_TOKEN || github.token }}
          HAVE_PAT: ${{ secrets.RELANDER_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "have_pat=$HAVE_PAT" >> "$GITHUB_OUTPUT"

          # --- required-set resolution ladder -------------------------------
          # Branch protection is admin-read. GITHUB_TOKEN has no administration scope
          # at all, so the live set is readable only by a PAT explicitly granted
          # read only by a PAT granted Administration:Read-only -- so try
          # Administration:Read-only; otherwise we use a pinned constant.
          #
          # There is no silent-empty branch. An unresolvable required set is a
          # hard failure, because "required set unknown" previously degraded to
          # "cohort B selects nothing" and that is precisely the silent no-op
          # that let 140 PRs deadlock for four weeks.
          # GITHUB_TOKEN cannot read branch protection (no administration scope
          # exists for it), so the only live source is the PAT -- and only if it
          # was granted Administration:read. If it was not, we fall to the pinned
          # constant, which is the supported steady state, not an error.
          src=""
          req=$(gh api "repos/$REPO/branches/main/protection/required_status_checks" \
                  --jq '.contexts[]' 2>/dev/null) && src="branch-protection (RELANDER_TOKEN)"

          if [ -n "$req" ]; then
            req=$(echo "$req" | tr '\n' ' ' | sed 's/  */ /g;s/^ //;s/ $//')
            echo "::notice::required contexts via $src: $req"
            # Guard the constant against the live set so it cannot rot unnoticed.
            fb=$(echo "$REQUIRED_FALLBACK" | tr ' ' '\n' | sort -u | tr '\n' ' ')
            lv=$(echo "$req" | tr ' ' '\n' | sort -u | tr '\n' ' ')
            if [ "$fb" != "$lv" ]; then
              echo "::warning::REQUIRED_FALLBACK is stale. live=[$lv] pinned=[$fb] -- update the constant in this file."
            fi
          else
            req=$(echo "$REQUIRED_FALLBACK" | tr -s ' ')
            echo "::warning::branch protection unreadable -> using pinned REQUIRED_FALLBACK: $req"
            echo "::warning::grant the RELANDER_TOKEN PAT 'Administration: Read-only' to restore live self-derivation."
            echo "::warning::this set cannot self-verify; confirm it still matches Settings -> Branches."
          fi

          if [ -z "$req" ]; then
            echo "::error::required-context set could not be resolved by any path."
            echo "::error::Refusing to sweep: cohort B would select nothing and the run would falsely report success."
            exit 1
          fi
          echo "required=$req" >> "$GITHUB_OUTPUT"

          if [ "$HAVE_PAT" = "true" ]; then
            echo "::notice::RELANDER_TOKEN present -> native synchronize/reopened; ALL required contexts reachable"
            exit 0
          fi

          echo "::warning::no RELANDER_TOKEN secret -> fallback mode (GITHUB_TOKEN + explicit gate dispatches)"
          [ -n "$req" ] || exit 0

          unreachable=""
          for c in $req; do
            echo "$DISPATCHABLE" | grep -qw "$c" || unreachable="$unreachable $c"
          done

          if [ -n "$unreachable" ]; then
            echo "::error::DRIFT: required context(s) unreachable in fallback mode:$unreachable"
            echo "::error::These are PR-context-only and cannot be workflow_dispatch'd. Every refreshed PR will sit at BLOCKED forever."
            echo "::error::Fix: set the RELANDER_TOKEN secret (fine-grained PAT, Contents RW + Pull requests RW, Workflows NO ACCESS)."
            exit 1
          fi
          echo "::notice::all required contexts reachable via dispatch fallback"

  reland:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refresh stale-but-clean and solid-but-blocked autonomous-build PRs
        env:
          GH_TOKEN: ${{ secrets.RELANDER_TOKEN || github.token }}
          HAVE_PAT: ${{ needs.preflight.outputs.have_pat }}
          REQUIRED: ${{ needs.preflight.outputs.required }}
          DISPATCH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELAND_CAP: ${{ github.event.inputs.reland_cap || '40' }}
        run: |
          set -uo pipefail

          # --- cohort A: stale-but-clean (original failure mode) -------------
          # NOTE: --limit is MANDATORY. gh pr list defaults to 30 rows; without
          # it this sweep was blind past row 30 and silently reported "nothing
          # to reland" while 28 eligible PRs sat outside the page.
          stale=$(gh pr list -R "$REPO" --state open \
                    --label autonomous-build --label triage:stale --limit 500 \
                    --json number,mergeable,isDraft \
                    -q '.[] | select(.mergeable != "CONFLICTING" and .isDraft == false) | .number') || stale=""

          # --- cohort B: solid but BLOCKED on a missing required context -----
          solid=""
          if [ -n "$REQUIRED" ]; then
            while read -r pr; do
              [ -n "$pr" ] || continue
              sha=$(gh pr view "$pr" -R "$REPO" --json headRefOid -q .headRefOid) || continue
              present=$(gh api "repos/$REPO/commits/$sha/check-runs" \
                          --jq '[.check_runs[].name] | unique | join(" ")' 2>/dev/null) || present=""
              for c in $REQUIRED; do
                if ! echo "$present" | grep -qw "$c"; then
                  solid="$solid $pr"; break
                fi
              done
            done <<< "$(gh pr list -R "$REPO" --state open \
                          --label autonomous-build --label triage:solid --limit 500 \
                          --json number,mergeStateStatus,isDraft \
                          -q '.[] | select(.mergeStateStatus == "BLOCKED" and .isDraft == false) | .number')"
          fi

          prs=$(printf '%s\n%s\n' "$stale" "$solid" | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -un) || prs=""
          if [ -z "$prs" ]; then
            echo "::notice::no PRs need refreshing"
            exit 0
          fi
          echo "::notice::cohort: $(echo "$prs" | wc -l) PR(s) to refresh (cap $RELAND_CAP)"

          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          count=0
          for pr in $prs; do
            if [ "$count" -ge "$RELAND_CAP" ]; then
              echo "::notice::reland cap ($RELAND_CAP) reached; remainder waits for the next run"
              break
            fi

            sha=$(gh pr view "$pr" -R "$REPO" --json headRefOid -q .headRefOid) || continue
            behind=$(gh api "repos/$REPO/compare/$main_sha...$sha" --jq '.behind_by' 2>/dev/null) || behind=""

            refreshed=false
            if [ "${behind:-0}" != "0" ]; then
              # Path 1: branch is behind main -> merge commit re-fires gates.
              if gh pr update-branch "$pr" -R "$REPO" 2>err.txt; then
                echo "::notice::#$pr branch updated (was $behind behind)"
                refreshed=true
              else
                echo "::notice::#$pr not updated ($(tr -d '\n' < err.txt | head -c 200))"
              fi
            elif [ "$HAVE_PAT" = "true" ]; then
              # Path 2: already level with main -> update-branch is a no-op, so
              # close+reopen to emit a `reopened` pull_request event. Only the
              # PAT can do this; GITHUB_TOKEN events are recursion-guarded.
              if gh pr close "$pr" -R "$REPO" 2>err.txt && sleep 2 && gh pr reopen "$pr" -R "$REPO" 2>>err.txt; then
                echo "::notice::#$pr level with main -> closed+reopened to re-fire PR gates"
                refreshed=true
              else
                echo "::warning::#$pr close/reopen failed ($(tr -d '\n' < err.txt | head -c 200))"
              fi
            else
              echo "::warning::#$pr level with main and no RELANDER_TOKEN -> UNREACHABLE (needs PAT for close/reopen)"
            fi

            if [ "$refreshed" = "true" ]; then
              count=$((count+1))
              if [ "$HAVE_PAT" != "true" ]; then
                branch=$(gh pr view "$pr" -R "$REPO" --json headRefName -q .headRefName) || continue
                for wf in pr-gates.yml evaluator.yml; do
                  GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "$wf" -R "$REPO" --ref "$branch" \
                    && echo "::notice::#$pr dispatched $wf on $branch" \
                    || echo "::warning::#$pr could not dispatch $wf on $branch"
                done
              fi
            fi
          done
          # --- backlog telemetry --------------------------------------------
          # The original failure was not that the sweep broke; it exited 0 every
          # six hours while doing nothing. A run that refreshes N of M PRs must
          # publish M-N, so a backlog that never falls is visible as a number
          # rather than inferable only by reading logs nobody reads.
          eligible=$(echo "$prs" | wc -l | tr -d ' ')
          remaining=$((eligible - count))
          {
            echo "### pr-relander"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| mode | $([ "$HAVE_PAT" = "true" ] && echo "PAT (native events)" || echo "GITHUB_TOKEN (dispatch fallback)") |"
            echo "| eligible | $eligible |"
            echo "| refreshed | $count |"
            echo "| unreachable this run | $remaining |"
            echo "| cap | $RELAND_CAP |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::refreshed $count of $eligible eligible PR(s); $remaining still waiting"

          if [ "$remaining" -gt 0 ] && [ "$count" -eq 0 ]; then
            echo "::error::$eligible PR(s) eligible but ZERO refreshed -- the sweep is running but accomplishing nothing."
            echo "::error::This is the exact silent-no-op signature that hid the 140-PR deadlock. Investigate before the next cadence."
            exit 1
          fi

          if [ "$remaining" -gt "$RELAND_CAP" ]; then
            echo "::warning::backlog ($remaining) exceeds one full sweep ($RELAND_CAP) -- draining will take $(( (remaining + RELAND_CAP - 1) / RELAND_CAP )) more run(s)."
          fi

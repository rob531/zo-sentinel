<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspectives — MCPRisky</title>
<style>
  :root{--bg:#0b1020;--panel:#121a33;--line:#26314f;--txt:#e8ecf8;--dim:#9aa7c7;--acc:#5b8cff;
        --hi:#ff5b6a;--med:#ffb84d;--low:#39d98a}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
  header h1{font-size:16px;margin:0}header a{color:var(--acc);text-decoration:none}
  main{display:grid;grid-template-columns:290px 1fr;gap:0;min-height:calc(100vh - 51px)}
  nav{border-right:1px solid var(--line);padding:14px;overflow:auto}
  section{padding:14px 20px;overflow:auto}
  .facet h3{margin:12px 0 6px;font-size:12px;text-transform:uppercase;color:var(--dim)}
  .axhead{margin:16px 0 2px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--acc);border-top:1px solid var(--line);padding-top:10px}
  .facet button{display:flex;justify-content:space-between;width:100%;background:none;border:0;
    color:var(--txt);padding:4px 6px;border-radius:6px;cursor:pointer;font:inherit;text-align:left}
  .facet button:hover,.facet button:focus{background:var(--panel);outline:1px solid var(--line)}
  .facet button.on{background:var(--panel);outline:1px solid var(--acc)}
  .facet .n{color:var(--dim)}
  select,inputbutton{font:inherit}
  #saved{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:8px;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
  th{color:var(--dim);font-weight:600}
  .tier{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .tier.HIGH,.tier.CRITICAL{background:rgba(255,91,106,.15);color:var(--hi)}
  .tier.MEDIUM{background:rgba(255,184,77,.15);color:var(--med)}
  .tier.LOW,.tier.MINIMAL{background:rgba(57,217,138,.15);color:var(--low)}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 8px;
    margin:1px;font-size:11px;color:var(--dim)}
  #status{color:var(--dim);margin:8px 0}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
  .bar button.ghost{background:var(--panel);border:1px solid var(--line)}
  .bar button:disabled{opacity:.55;cursor:default}
  a.row-link{color:var(--acc);text-decoration:none}
  #start{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-top:12px;max-width:640px}
  #start h2{margin:0 0 6px;font-size:15px} #start p{color:var(--dim);margin:6px 0}
  .pcards{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .pcards button{background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left}
  .pcards button:hover{border-color:var(--acc)}
  #diffOut{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-top:12px;white-space:pre-wrap;color:var(--txt);font-size:13px}
  #diffOut.err{border-color:var(--hi);color:var(--hi)}
</style>
</head>
<body>
<header>
  <h1>Perspectives</h1>
  <span style="color:var(--dim)">deterministic faceted views over the scored registry</span>
  <span style="flex:1"></span>
  <a href="/ask">Ask →</a> <a href="/app">App →</a>
</header>
<main>
  <nav aria-label="Facet tree">
    <label for="saved" style="color:var(--dim);font-size:12px">Saved perspectives</label>
    <select id="saved" aria-label="Saved perspectives"><option value="">— ad-hoc exploration —</option></select>
    <div id="tree" role="tree"></div>
  </nav>
  <section>
    <div class="bar">
      <strong id="title">Ad-hoc view</strong>
      <span id="status" role="status" aria-live="polite">loading…</span>
      <span style="flex:1"></span>
      <button id="diffBtn" class="ghost" title="Changes since last snapshot">Trust-diff</button>
      <button id="clearBtn" class="ghost">Clear filters</button>
    </div>
    <div id="active"></div>
    <div id="start" style="display:none"></div>
    <div id="results">
      <table aria-label="Servers in view">
        <thead><tr><th>Server</th><th>Source</th><th>Tier</th><th>Verdict</th><th>Trust</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="bar" style="margin-top:10px">
        <button id="prev" class="ghost">‹ Prev</button>
        <span id="page" style="color:var(--dim)">1</span>
        <button id="next" class="ghost">Next ›</button>
      </div>
    </div>
    <div id="diffOut"></div>
  </section>
</main>
<script>
async function tok(){try{return (window.Clerk&&window.Clerk.session)?await window.Clerk.session.getToken():null}catch(e){return null}}
async function api(u,o){o=o||{};const t=await tok();o.headers=Object.assign({},o.headers||{},t?{Authorization:'Bearer '+t}:{});
  const r=await fetch(u,o); if(!r.ok) throw new Error(r.status+' '+await r.text()); return r.json();}

let FACETS={}, FILTERS={}, PAGE=1, PID='', BROWSE=false, PERSPECTIVES=[], TOTAL=0;
const $=id=>document.getElementById(id);

function esc(s){const d=document.createElement('span');d.textContent=String(s==null?'':s);return d.innerHTML}

// Display order + labels: registry facets first (tier leads once the backfill
// lands), the 7 model axes grouped under their own header. Internal keys stay
// axis:<name>; URLs use axis.<name> (colon-free).
const GROUP_ORDER=['risk_tier','verdict','trust_band','registry_source'];
const GROUP_LABELS={risk_tier:'Risk tier',verdict:'Verdict',trust_band:'Trust band',registry_source:'Source'};
function groupLabel(k){
  if(GROUP_LABELS[k])return GROUP_LABELS[k];
  if(k.startsWith('axis:')){const n=k.slice(5).replace(/_/g,' ');return n.charAt(0).toUpperCase()+n.slice(1)}
  return k;
}
function orderedKeys(){
  const ks=Object.keys(FACETS);
  const reg=GROUP_ORDER.filter(k=>ks.includes(k));
  const axes=ks.filter(k=>k.startsWith('axis:')).sort();
  const rest=ks.filter(k=>!reg.includes(k)&&!axes.includes(k)).sort();
  return {reg:[...reg,...rest],axes};
}

// --- Shareable URL state (allowlisted; never reflected as HTML) -------------
function urlKey(k){return k.startsWith('axis:')?'axis.'+k.slice(5):k}
function facetKey(k){return k.startsWith('axis.')?'axis:'+k.slice(5):k}
function writeUrl(push){
  const p=new URLSearchParams();
  if(PID)p.set('pid',PID);
  else for(const [k,vs] of Object.entries(FILTERS))for(const v of vs)p.append(urlKey(k),v);
  const qs=p.toString();
  const u=location.pathname+(qs?'?'+qs:'');
  (push?history.pushState:history.replaceState).call(history,{},'',u);
}
function readUrl(){
  const p=new URLSearchParams(location.search);
  const pid=p.get('pid');
  if(pid&&PERSPECTIVES.some(x=>x.id===pid)){PID=pid;$('saved').value=pid;return}
  const f={};
  for(const [rk,v] of p.entries()){
    if(rk==='pid')continue;
    const k=facetKey(rk);
    if(!(k in FACETS))continue;                        // allowlist: known groups only
    if(!FACETS[k].some(o=>o.value===v))continue;       // allowlist: known values only
    (f[k]=f[k]||[]).includes(v)||f[k].push(v);
  }
  FILTERS=f; if(Object.keys(f).length)BROWSE=false;
}
window.addEventListener('popstate',()=>{PID='';FILTERS={};BROWSE=false;$('saved').value='';readUrl();refresh(false)});

function renderTree(counts){
  const tree=$('tree'); tree.innerHTML='';
  const {reg,axes}=orderedKeys();
  const put=(key)=>{
    const grp=document.createElement('div'); grp.className='facet';
    grp.innerHTML='<h3>'+esc(groupLabel(key))+'</h3>';
    const live=(counts&&counts[key])?Object.fromEntries(counts[key].map(d=>[d.value,d.count])):null;
    for(const opt of FACETS[key]){
      const on=(FILTERS[key]||[]).includes(opt.value);
      const n=live?(live[opt.value]||0):opt.count;
      const b=document.createElement('button');
      b.setAttribute('role','treeitem'); b.setAttribute('aria-pressed',on);
      b.className=on?'on':'';
      b.innerHTML='<span>'+esc(opt.value)+'</span><span class="n">'+n+'</span>';
      b.onclick=()=>{const cur=new Set(FILTERS[key]||[]); on?cur.delete(opt.value):cur.add(opt.value);
        if(cur.size)FILTERS[key]=[...cur]; else delete FILTERS[key];
        PID=''; $('saved').value=''; PAGE=1; BROWSE=false; refresh();};
      grp.appendChild(b);
    }
    tree.appendChild(grp);
  };
  for(const k of reg)put(k);
  if(axes.length){const h=document.createElement('div');h.className='axhead';h.textContent='Model axes';tree.appendChild(h);}
  for(const k of axes)put(k);
}

function renderRows(servers){
  $('rows').innerHTML = servers.map(s=>'<tr>'+
    '<td><a class="row-link" href="/app/server/'+encodeURIComponent(s.server_id)+'">'+esc(s.name||s.server_id)+'</a></td>'+
    '<td>'+esc(s.registry_source||'')+'</td>'+
    '<td><span class="tier '+esc(s.risk_tier||'')+'">'+esc(s.risk_tier||'?')+'</span></td>'+
    '<td>'+esc(s.verdict||'')+'</td>'+
    '<td>'+(s.trust_score==null?'':esc(Math.round(s.trust_score)))+'</td></tr>').join('')
    || '<tr><td colspan="5" style="color:var(--dim)">No servers match this view.</td></tr>';
  $('active').innerHTML = Object.entries(FILTERS).map(([k,vs])=>
    vs.map(v=>'<span class="chip">'+esc(groupLabel(k))+' = '+esc(v)+'</span>').join('')).join('');
}

function renderStart(){
  const total=(FACETS.registry_source||[]).reduce((a,d)=>a+d.count,0);
  const el=$('start'); el.style.display='';
  el.innerHTML='<h2>Explore the scored registry</h2>'+
    '<p>'+(total?('<b>'+total.toLocaleString()+'</b> servers indexed. '):'')+
    'Pick facets on the left to build a view — filters OR within a group, AND across groups.</p>'+
    (PERSPECTIVES.length?'<p>Curated perspectives:</p><div class="pcards" id="pcards"></div>':'')+
    '<div class="pcards"><button id="browseAll">Browse all servers →</button></div>';
  const pc=el.querySelector('#pcards');
  if(pc)for(const p of PERSPECTIVES){const b=document.createElement('button');
    b.textContent=p.name; b.onclick=()=>{PID=p.id;$('saved').value=p.id;PAGE=1;refresh();}; pc.appendChild(b);}
  el.querySelector('#browseAll').onclick=()=>{BROWSE=true;PAGE=1;refresh();};
  $('results').style.display='none';
}
function hideStart(){$('start').style.display='none';$('results').style.display='';}

function setPager(){
  $('page').textContent=PAGE;
  $('prev').disabled=PAGE<=1;
  $('next').disabled=PAGE*25>=TOTAL;
}

async function refresh(pushUrl=true){
  $('status').textContent='loading…'; const d0=$('diffOut'); d0.style.display='none'; d0.classList.remove('err');
  try{
    if(PID){
      const d=await api('/api/perspectives/'+encodeURIComponent(PID)+'/servers?page='+PAGE);
      FILTERS=d.perspective.facet_filters||{}; TOTAL=d.total; $('title').textContent=d.perspective.name;
      hideStart(); renderTree(d.facet_counts); renderRows(d.servers);
      $('status').textContent=d.total.toLocaleString()+' servers'; setPager();
    }else if(Object.keys(FILTERS).length||BROWSE){
      const d=await api('/api/perspectives/adhoc/servers?page='+PAGE+
        '&filters='+encodeURIComponent(JSON.stringify(FILTERS)));
      TOTAL=d.total; $('title').textContent=BROWSE&&!Object.keys(FILTERS).length?'All servers':'Ad-hoc view';
      hideStart(); renderTree(d.facet_counts); renderRows(d.servers);
      $('status').textContent=d.total.toLocaleString()+' servers'; setPager();
    }else{
      $('title').textContent='Ad-hoc view';
      renderTree(null); renderStart();
      $('status').textContent='pick facets, a saved perspective, or browse all';
    }
    writeUrl(pushUrl&&!!PID);
  }catch(e){$('status').textContent='error: '+e.message}
}

async function runDiff(){
  const out=$('diffOut'), btn=$('diffBtn');
  out.classList.remove('err');
  if(!PID){out.style.display='block';out.textContent='Pick a saved perspective first — trust-diff compares a saved view against its last snapshot.';return}
  btn.disabled=true; const old=btn.textContent; btn.textContent='diffing…';
  try{
    const d=await api('/api/perspectives/'+encodeURIComponent(PID)+'/diff');
    out.style.display='block';
    if(d.baseline){
      out.textContent='No snapshot yet — an admin can POST /api/perspectives/'+PID+'/snapshot to set the baseline.';
    }else if(!d.entered.length&&!d.left.length&&!d.tier_changed.length){
      out.textContent='No changes since the last snapshot'+(d.snapshot_at?' ('+new Date(d.snapshot_at).toLocaleString()+')':'')+'. '+d.live_count.toLocaleString()+' servers in view.';
    }else{
      out.textContent='Since '+(d.snapshot_at?new Date(d.snapshot_at).toLocaleString():'last snapshot')+':\n'+
        'entered ('+d.entered.length+'): '+d.entered.slice(0,50).join(', ')+(d.entered.length>50?' …':'')+'\n'+
        'left ('+d.left.length+'): '+d.left.slice(0,50).join(', ')+(d.left.length>50?' …':'')+'\n'+
        'tier changed ('+d.tier_changed.length+'): '+d.tier_changed.slice(0,50).map(c=>c.server_id+' '+c.old+'→'+c.new).join(', ')+(d.tier_changed.length>50?' …':'');
    }
  }catch(e){out.style.display='block';out.classList.add('err');out.textContent='Trust-diff failed: '+e.message}
  finally{btn.disabled=false;btn.textContent=old}
}

async function boot(){
  try{
    const f=await api('/api/facets'); FACETS=f.facets||{};
    const ps=await api('/api/perspectives'); PERSPECTIVES=ps.perspectives||[];
    for(const p of PERSPECTIVES){const o=document.createElement('option');
      o.value=p.id;o.textContent=p.name;$('saved').appendChild(o);}
    $('saved').onchange=e=>{PID=e.target.value;PAGE=1;BROWSE=false;if(!PID)FILTERS={};refresh();};
    $('clearBtn').onclick=()=>{FILTERS={};PID='';BROWSE=false;$('saved').value='';PAGE=1;refresh();};
    $('prev').onclick=()=>{if(PAGE>1){PAGE--;refresh(false);}};
    $('next').onclick=()=>{PAGE++;refresh(false);};
    $('diffBtn').onclick=runDiff;
    readUrl();
    refresh(false);
  }catch(e){$('status').textContent='sign in required — '+e.message}
}

// Clerk bootstrap (same pattern as app.html; PK injected server-side)
const CLERK_PK="__CLERK_PK__";
function clerkHost(pk){try{return atob(pk.split('_')[2]).replace(/\$+$/,'');}catch(e){return '';}}
if(CLERK_PK.indexOf("pk_")===0&&clerkHost(CLERK_PK)){
  const s=document.createElement('script');
  s.setAttribute('data-clerk-publishable-key',CLERK_PK);
  s.src='https://'+clerkHost(CLERK_PK)+'/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
  s.onload=async()=>{await window.Clerk.load();boot();};
  document.head.appendChild(s);
}else{boot();}
</script>
</body>
</html>

#!/bin/bash
# PHASE 8 DAEMONS - ADD TO supervisord_sentinel_full.conf
# Append the following sections to the [group:zo_sentinel] block
# or add as separate program entries

# =============================================================================
# PHASE 8: PI-CORPUS INGEST
# =============================================================================
[program:pi_corpus_ingest]
command=python3 /home/workspace/zo_sentinel/pi_corpus_ingest.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_corpus_ingest.err
stdout_logfile=/home/workspace/logs/pi_corpus_ingest.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# PHASE 8: PI QUARANTINE REVIEWER
# =============================================================================
[program:pi_quarantine_reviewer]
command=python3 /home/workspace/zo_sentinel/pi_quarantine_reviewer.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_quarantine_reviewer.err
stdout_logfile=/home/workspace/logs/pi_quarantine_reviewer.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# PHASE 8: PI QUARANTINE PROMOTER
# =============================================================================
[program:pi_quarantine_promoter]
command=python3 /home/workspace/zo_sentinel/pi_quarantine_promoter.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_quarantine_promoter.err
stdout_logfile=/home/workspace/logs/pi_quarantine_promoter.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# PHASE 8: PI FLAGGED REVIEW API (port 8792)
# =============================================================================
[program:pi_flagged_review_api]
command=python3 /home/workspace/zo_sentinel/pi_flagged_review_api.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_flagged_review_api.err
stdout_logfile=/home/workspace/logs/pi_flagged_review_api.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# PHASE 8: PI HARNESS RUNNER
# =============================================================================
[program:pi_harness_runner]
command=python3 /home/workspace/zo_sentinel/pi_harness_runner.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_harness_runner.err
stdout_logfile=/home/workspace/logs/pi_harness_runner.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# PHASE 8: PI SCORER
# =============================================================================
[program:pi_scorer]
command=python3 /home/workspace/zo_sentinel/pi_scorer.py
autostart=true
autorestart=true
stderr_logfile=/home/workspace/logs/pi_scorer.err
stdout_logfile=/home/workspace/logs/pi_scorer.out
environment=PYTHONPATH="/home/workspace/zo_sentinel"

# =============================================================================
# APPLICATION INSTRUCTIONS
# =============================================================================
# To apply this patch:
# 1. Backup current config: cp /home/workspace/zo_sentinel/supervisord_sentinel_full.conf /home/workspace/zo_sentinel/supervisord_sentinel_full.conf.bak
# 2. Append this content to the config file: cat supervisord_phase8_update.conf >> /home/workspace/zo_sentinel/supervisord_sentinel_full.conf
# 3. Create log directory if missing: mkdir -p /home/workspace/logs
# 4. Reload supervisord: supervisorctl reread && supervisorctl update
# 5. Verify: supervisorctl status | grep pi_
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Trends Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .dashboard-container {
            padding: 20px;
        }
        .chart-container {
            margin-bottom: 30px;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container dashboard-container">
        <h1 class="mb-4">Risk Trends Dashboard</h1>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>30-Day Risk Trend</h5>
                    </div>
                    <div class="card-body">
                        <div id="trend-chart" class="chart-container" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Current Risk Distribution</h5>
                    </div>
                    <div class="card-body">
                        <div id="distribution-chart" class="chart-container" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Server Count by Risk Tier</h5>
                    </div>
                    <div class="card-body">
                        <div id="server-count-chart" class="chart-container" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock data for testing
        const mockData = {
            trendData: [
                { date: '2023-10-01', low: 10, medium: 5, high: 2, critical: 1 },
                { date: '2023-10-02', low: 12, medium: 4, high: 3, critical: 1 },
                { date: '2023-10-03', low: 11, medium: 6, high: 2, critical: 1 },
                { date: '2023-10-04', low: 9, medium: 7, high: 3, critical: 1 },
                { date: '2023-10-05', low: 8, medium: 8, high: 3, critical: 1 },
                { date: '2023-10-06', low: 10, medium: 6, high: 3, critical: 1 },
                { date: '2023-10-07', low: 12, medium: 5, high: 2, critical: 1 },
                { date: '2023-10-08', low: 11, medium: 6, high: 2, critical: 1 },
                { date: '2023-10-09', low: 10, medium: 7, high: 2, critical: 1 },
                { date: '2023-10-10', low: 9, medium: 8, high: 2, critical: 1 },
                { date: '2023-10-11', low: 8, medium: 9, high: 2, critical: 1 },
                { date: '2023-10-12', low: 7, medium: 10, high: 2, critical: 1 },
                { date: '2023-10-13', low: 6, medium: 11, high: 2, critical: 1 },
                { date: '2023-10-14', low: 5, medium: 12, high: 2, critical: 1 },
                { date: '2023-10-15', low: 4, medium: 13, high: 2, critical: 1 },
                { date: '2023-10-16', low: 3, medium: 14, high: 2, critical: 1 },
                { date: '2023-10-17', low: 2, medium: 15, high: 2, critical: 1 },
                { date: '2023-10-18', low: 1, medium: 16, high: 2, critical: 1 },
                { date: '2023-10-19', low: 0, medium: 17, high: 2, critical: 1 },
                { date: '2023-10-20', low: 0, medium: 16, high: 3, critical: 1 },
                { date: '2023-10-21', low: 0, medium: 15, high: 4, critical: 1 },
                { date: '2023-10-22', low: 0, medium: 14, high: 5, critical: 1 },
                { date: '2023-10-23', low: 0, medium: 13, high: 6, critical: 1 },
                { date: '2023-10-24', low: 0, medium: 12, high: 7, critical: 1 },
                { date: '2023-10-25', low: 0, medium: 11, high: 8, critical: 1 },
                { date: '2023-10-26', low: 0, medium: 10, high: 9, critical: 1 },
                { date: '2023-10-27', low: 0, medium: 9, high: 10, critical: 1 },
                { date: '2023-10-28', low: 0, medium: 8, high: 11, critical: 1 },
                { date: '2023-10-29', low: 0, medium: 7, high: 12, critical: 1 },
                { date: '2023-10-30', low: 0, medium: 6, high: 13, critical: 1 }
            ],
            distributionData: [
                { tier: 'Low', count: 10 },
                { tier: 'Medium', count: 5 },
                { tier: 'High', count: 2 },
                { tier: 'Critical', count: 1 }
            ],
            serverCountData: [
                { tier: 'Low', count: 100 },
                { tier: 'Medium', count: 50 },
                { tier: 'High', count: 20 },
                { tier: 'Critical', count: 10 }
            ]
        };

        // Function to render the 30-day trend chart
        function renderTrendChart() {
            const dates = mockData.trendData.map(item => item.date);
            const low = mockData.trendData.map(item => item.low);
            const medium = mockData.trendData.map(item => item.medium);
            const high = mockData.trendData.map(item => item.high);
            const critical = mockData.trendData.map(item => item.critical);

            const data = [
                { x: dates, y: low, name: 'Low', type: 'scatter', mode: 'lines' },
                { x: dates, y: medium, name: 'Medium', type: 'scatter', mode: 'lines' },
                { x: dates, y: high, name: 'High', type: 'scatter', mode: 'lines' },
                { x: dates, y: critical, name: 'Critical', type: 'scatter', mode: 'lines' }
            ];

            const layout = {
                title: '30-Day Risk Trend',
                xaxis: { title: 'Date' },
                yaxis: { title: 'Count' }
            };

            Plotly.newPlot('trend-chart', data, layout);
        }

        // Function to render the current risk distribution pie chart
        function renderDistributionChart() {
            const tiers = mockData.distributionData.map(item => item.tier);
            const counts = mockData.distributionData.map(item => item.count);

            const data = [{
                values: counts,
                labels: tiers,
                type: 'pie'
            }];

            const layout = {
                title: 'Current Risk Distribution'
            };

            Plotly.newPlot('distribution-chart', data, layout);
        }

        // Function to render the server count by tier bar chart
        function renderServerCountChart() {
            const tiers = mockData.serverCountData.map(item => item.tier);
            const counts = mockData.serverCountData.map(item => item.count);

            const data = [{
                x: tiers,
                y: counts,
                type: 'bar'
            }];

            const layout = {
                title: 'Server Count by Risk Tier',
                xaxis: { title: 'Risk Tier' },
                yaxis: { title: 'Count' }
            };

            Plotly.newPlot('server-count-chart', data, layout);
        }

        // Render all charts on page load
        document.addEventListener('DOMContentLoaded', function() {
            renderTrendChart();
            renderDistributionChart();
            renderServerCountChart();
            console.log('PASS');
        });
    </script>
</body>
</html>

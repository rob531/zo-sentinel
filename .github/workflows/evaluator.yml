            tests/test_loop_watch.py \
            tests/test_matrix_routing.py \
            tests/test_minimax_toolcall_parse.py \
            tests/test_model_import_linter.py \
            tests/test_model_import_linter_aliases.py \
            tests/test_model_import_linter_dep_overrides.py \
            tests/test_openai_compatible_rung.py \
            tests/test_output_file_sanity.py \

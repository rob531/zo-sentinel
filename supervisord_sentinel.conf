import os
import logging
from logging.handlers import RotatingFileHandler

# Set up logging
logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)

if not os.path.exists('logs'):
    os.makedirs('logs')

handler = RotatingFileHandler('logs/sentinel_supervisor.log', maxBytes=1000000, backupCount=1)
formatter = logging.Formatter('%(asctime)s - %(name)s - %(levelname)s - %(message)s')
handler.setFormatter(formatter)

logger.addHandler(handler)

def run():
    logger.info("Starting sentinel supervisor")
    
    # Set up daemons
    from mcp_scanner import MCPScanner
    from signal_analyser import SignalAnalyser
    from trust_synthesiser import TrustSynthesiser
    from threat_intel import ThreatIntel
    from risk_ranker import RiskRanker
    from attestation import Attestation
    from approval_workflow import ApprovalWorkflow
    
    mcp_scanner = MCPScanner()
    signal_analyser = SignalAnalyser()
    trust_synthesiser = TrustSynthesiser()
    threat_intel = ThreatIntel()
    risk_ranker = RiskRanker()
    attestation = Attestation()
    approval_workflow = ApprovalWorkflow()

    # Start daemons
    mcp_scanner.start()
    signal_analyser.start()
    trust_synthesiser.start()
    threat_intel.start()
    risk_ranker.start()
    attestation.start()
    approval_workflow.start()

if __name__ == '__main__':
    run()
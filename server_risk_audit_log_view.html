<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Risk Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .audit-log-entry {
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }
        .audit-log-entry:hover {
            background-color: #f8f9fa;
        }
        .timestamp {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .action {
            font-weight: bold;
        }
        .details {
            margin-top: 0.5rem;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Server Risk Audit Log</h1>
        <div class="row mt-3">
            <div class="col-md-12">
                {% if audit_log_entries %}
                    {% for entry in audit_log_entries %}
                        <div class="audit-log-entry">
                            <div class="timestamp">{{ entry.timestamp }}</div>
                            <div class="action">{{ entry.action }}</div>
                            <div class="details">{{ entry.details }}</div>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="alert alert-info">No audit log entries found.</div>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

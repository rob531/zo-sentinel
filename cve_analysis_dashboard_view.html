<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .dashboard-container {
            padding: 20px;
        }
        .chart-container {
            height: 400px;
            margin-bottom: 20px;
        }
        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .recent-advisories {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid dashboard-container">
        <h1 class="mb-4">CVE Analysis Dashboard</h1>

        <div class="row">
            <div class="col-md-3">
                <div class="filter-section">
                    <h4>Filters</h4>
                    <div class="mb-3">
                        <label for="severity-filter" class="form-label">Severity</label>
                        <select id="severity-filter" class="form-select">
                            <option value="">All</option>
                            <option value="Critical">Critical</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="ecosystem-filter" class="form-label">Ecosystem</label>
                        <select id="ecosystem-filter" class="form-select">
                            <option value="">All</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Java">Java</option>
                            <option value="C/C++">C/C++</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="package-filter" class="form-label">Package</label>
                        <input type="text" id="package-filter" class="form-control" placeholder="Filter by package name">
                    </div>
                    <button id="apply-filters" class="btn btn-primary">Apply Filters</button>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row">
                    <div class="col-md-6">
                        <div class="chart-container">
                            <canvas id="severityChart"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-container">
                            <canvas id="affectedServersChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <h4 class="mb-3">Recent Vulnerability Advisories</h4>
                        <div class="table-responsive recent-advisories">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>CVE ID</th>
                                        <th>Package</th>
                                        <th>Severity</th>
                                        <th>Published</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody id="advisories-table-body">
                                    <!-- Advisories will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize charts
            const severityCtx = document.getElementById('severityChart').getContext('2d');
            const affectedServersCtx = document.getElementById('affectedServersChart').getContext('2d');

            let severityChart = new Chart(severityCtx, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [
                            '#FF6384', // Critical
                            '#36A2EB', // High
                            '#FFCE56', // Medium
                            '#4BC0C0'  // Low
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right'
                        },
                        title: {
                            display: true,
                            text: 'Vulnerability Severity Distribution'
                        }
                    }
                }
            });

            let affectedServersChart = new Chart(affectedServersCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Number of Affected Servers',
                        data: [],
                        backgroundColor: '#4BC0C0'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Affected Servers by Vulnerability'
                        }
                    }
                }
            });

            // Function to load data
            async function loadData() {
                try {
                    // Get filters
                    const severityFilter = document.getElementById('severity-filter').value;
                    const ecosystemFilter = document.getElementById('ecosystem-filter').value;
                    const packageFilter = document.getElementById('package-filter').value;

                    // Build query parameters
                    const params = new URLSearchParams();
                    if (severityFilter) params.append('severity', severityFilter);
                    if (ecosystemFilter) params.append('ecosystem', ecosystemFilter);
                    if (packageFilter) params.append('package', packageFilter);

                    // Fetch data from API
                    const response = await axios.get(`/api/cve-analysis?${params.toString()}`);
                    const data = response.data;

                    // Update severity chart
                    severityChart.data.labels = data.severity_distribution.labels;
                    severityChart.data.datasets[0].data = data.severity_distribution.data;
                    severityChart.update();

                    // Update affected servers chart
                    affectedServersChart.data.labels = data.affected_servers.labels;
                    affectedServersChart.data.datasets[0].data = data.affected_servers.data;
                    affectedServersChart.update();

                    // Update advisories table
                    const tableBody = document.getElementById('advisories-table-body');
                    tableBody.innerHTML = '';

                    data.recent_advisories.forEach(advisory => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${advisory.cve_id}</td>
                            <td>${advisory.package}</td>
                            <td>${advisory.severity}</td>
                            <td>${new Date(advisory.published).toLocaleDateString()}</td>
                            <td>${advisory.description}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                } catch (error) {
                    console.error('Error loading data:', error);
                    alert('Failed to load data. Please try again later.');
                }
            }

            // Load data on page load
            loadData();

            // Apply filters button click handler
            document.getElementById('apply-filters').addEventListener('click', loadData);
        });
    </script>
</body>
</html>

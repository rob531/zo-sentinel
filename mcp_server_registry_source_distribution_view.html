<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Source Distribution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .total {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Server Source Distribution</h1>
    <div id="content">
        <p>Loading data...</p>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/servers/source-distribution');
                const data = await response.json();

                if (data.sources && data.sources.length > 0) {
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Source</th>
                                    <th>Count</th>
                                    <th>Percentage</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.sources.forEach(source => {
                        html += `
                            <tr>
                                <td>${source.source}</td>
                                <td>${source.count}</td>
                                <td>${source.percentage.toFixed(2)}%</td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table>
                        <div class="total">Total: ${data.total}</div>
                    `;

                    document.getElementById('content').innerHTML = html;
                } else {
                    document.getElementById('content').innerHTML = '<p>No data available.</p>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('content').innerHTML = '<p>Error loading data. Please try again later.</p>';
            }
        }

        fetchData();
    </script>
</body>
</html>

import pytest
from fastapi.testclient import TestClient
from sqlalchemy import create_engine
from sqlalchemy.orm import sessionmaker
from sqlalchemy.pool import StaticPool
from app.db import get_session
from app.models import Base, McpServerRegistry, VulnAdvisory

def create_test_app():
    from fastapi import FastAPI
    from services.active.server_cve_correlation_api.router import router
    
    app = FastAPI()
    app.include_router(router, prefix="/api", tags=["server_cve_correlation_api"])
    return app

@pytest.fixture
def test_db():
    engine = create_engine(
        "sqlite:///:memory:",
        connect_args={"check_same_thread": False},
        poolclass=StaticPool
    )
    Base.metadata.create_all(bind=engine)
    TestingSessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
    
    db = TestingSessionLocal()
    try:
        yield db
    finally:
        db.close()

@pytest.fixture
def client(test_db):
    from services.active.server_cve_correlation_api.router import router
    from fastapi import FastAPI
    
    app = FastAPI()
    app.include_router(router, prefix="/api", tags=["server_cve_correlation_api"])
    
    def override_get_session():
        try:
            yield test_db
        finally:
            pass
    
    app.dependency_overrides[get_session] = override_get_session
    
    with TestClient(app) as test_client:
        yield test_client

def test_health_check(client):
    response = client.get("/api/health")
    assert response.status_code == 200
    data = response.json()
    assert data["status"] == "healthy"
    assert data["service"] == "server_cve_correlation_api"

def test_get_server_cves_not_found(client):
    response = client.get("/api/servers/9999/cves")
    assert response.status_code == 404

def test_get_server_cves_found(client, test_db):
    server = McpServerRegistry(
        id=1,
        name="test-server",
        description="Test MCP Server"
    )
    test_db.add(server)
    test_db.commit()
    
    response = client.get("/api/servers/1/cves")
    assert response.status_code == 200
    data = response.json()
    assert data["server_id"] == 1
    assert data["server_name"] == "test-server"
    assert "cve_count" in data

def test_correlate_endpoint(client):
    response = client.post("/api/correlate", json={})
    assert response.status_code == 200
    data = response.json()
    assert "matched" in data
    assert "correlation_score" in data

def test_get_server_risk_score_not_found(client):
    response = client.get("/api/servers/9999/risk-score")
    assert response.status_code == 404

def test_get_server_risk_score_found(client, test_db):
    server = McpServerRegistry(
        id=2,
        name="risk-test-server",
        description="Test Server"
    )
    test_db.add(server)
    test_db.commit()
    
    response = client.get("/api/servers/2/risk-score")
    assert response.status_code == 200
    data = response.json()
    assert data["server_id"] == 2
    assert "base_risk" in data
    assert "combined_risk" in data
"""


[program:zo_sentinel_scanner]
command=python3 /home/workspace/zo_sentinel/mcp_scanner.py
directory=/home/workspace/zo_sentinel
autostart=true
autorestart=true
startretries=5
stdout_logfile=/home/workspace/logs/sentinel_scanner.log
stderr_logfile=/home/workspace/logs/sentinel_scanner.log
stdout_logfile_maxbytes=5MB


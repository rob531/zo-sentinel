name: e2e-nightly

# Nightly FULL-PIPELINE end-to-end test: directive -> promoter -> build_artifact
# -> publisher, with the real plumbing modules wired together and run against the
# real-DuckDB write_service (tests/integration/it_write_service.py). The two
# LLM-bearing rungs (architect, goose build) are stubbed -- a runner has no
# LLM/ladder -- but every hand-off module between them is the real thing.
#
# Heavier + broader than the per-PR `integration` tier (which checks the DB
# contract in isolation), so it runs NIGHTLY rather than on every PR. Also
# dispatchable on demand. Not a required check.
#
# When the app migrates to Postgres (docs/POSTGRES_APP_MIGRATION_SCOPE.md) this
# job gains a `services: postgres:16` container + IT_DB_BACKEND=postgres, same as
# the integration tier; the pipeline test runs unchanged.

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt pytest requests
      - name: Start real-DuckDB write_service
        env:
          IT_WS_PORT: "8772"
        run: |
          nohup python tests/integration/it_write_service.py > /tmp/it_ws.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8772/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://127.0.0.1:8772/health || { echo "service failed to start"; cat /tmp/it_ws.log; exit 1; }
          echo "write_service up: $(curl -s http://127.0.0.1:8772/health)"
      - name: Run full-pipeline E2E
        env:
          ZO_WRITE_SERVICE: "http://127.0.0.1:8772"
        run: python -m pytest tests/integration/test_pipeline_e2e.py -v
      - name: Run app functional E2E (DB-cutover snapshot)
        env:
          ZO_WRITE_SERVICE: "http://127.0.0.1:8772"
          IT_DB_BACKEND: "duckdb"
        run: python -m pytest tests/integration/test_app_e2e.py -v
      - name: Upload app E2E snapshot (pre/post-cutover baseline)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-snapshot-duckdb
          path: artifacts/app_e2e_snapshot_*.json
          retention-days: 90
      - name: Service log (on failure)
        if: failure()
        run: cat /tmp/it_ws.log || true

  app-e2e-postgres:
    # ONLY the APP E2E flips to Postgres; the factory pipeline E2E stays DuckDB
    # (docs/POSTGRES_APP_MIGRATION_SCOPE.md). Produces app-e2e-snapshot-postgres to
    # diff against -duckdb across the cutover.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zo
          POSTGRES_PASSWORD: zo
          POSTGRES_DB: zo_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt pytest requests
      - name: Start write_service (Postgres backend)
        env:
          IT_WS_PORT: "8772"
          IT_DB_BACKEND: "postgres"
          IT_DB_DSN: "postgresql://zo:zo@127.0.0.1:5432/zo_app"
        run: |
          nohup python tests/integration/it_write_service.py > /tmp/it_ws_pg.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8772/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://127.0.0.1:8772/health || { echo "service failed to start"; cat /tmp/it_ws_pg.log; exit 1; }
          echo "write_service up: $(curl -s http://127.0.0.1:8772/health)"
      - name: Run app functional E2E (Postgres snapshot)
        env:
          ZO_WRITE_SERVICE: "http://127.0.0.1:8772"
          IT_DB_BACKEND: "postgres"
        run: python -m pytest tests/integration/test_app_e2e.py -v
      - name: Upload app E2E snapshot (postgres)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-snapshot-postgres
          path: artifacts/app_e2e_snapshot_*.json
          retention-days: 90
      - name: Service log (on failure)
        if: failure()
        run: cat /tmp/it_ws_pg.log || true

  app-e2e-parity:
    # Cutover gate: the DuckDB and Postgres app-E2E snapshots must be byte-identical
    # (modulo the `backend` field). This is the missing assert that made the two
    # uploaded snapshots actually mean something -- previously parity was eyeballed.
    needs: [full-pipeline, app-e2e-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download DuckDB snapshot
        uses: actions/download-artifact@v8
        with:
          name: app-e2e-snapshot-duckdb
          path: snap-duckdb
      - name: Download Postgres snapshot
        uses: actions/download-artifact@v8
        with:
          name: app-e2e-snapshot-postgres
          path: snap-postgres
      - name: Assert cutover parity (duckdb == postgres)
        run: |
          DUCK="$(ls snap-duckdb/app_e2e_snapshot_*.json | head -n1)"
          PG="$(ls snap-postgres/app_e2e_snapshot_*.json | head -n1)"
          echo "duckdb=$DUCK  postgres=$PG"
          python tests/integration/diff_app_e2e_snapshots.py "$DUCK" "$PG"


  axis-reality:
    # Gate-2 (council): verdict API must return REAL values for all 7 named axes
    # from the real schema for a known server -- fail-closed on null/synthetic.
    # Runs on a real Postgres service (the production backend).
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zo
          POSTGRES_PASSWORD: zo
          POSTGRES_DB: zo_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install app deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt || true
          pip install fastapi "sqlalchemy>=2" "psycopg[binary]" "pyjwt[crypto]" httpx pytest requests
      - name: Axis-reality E2E (real 7 axes, fail-closed)
        env:
          DATABASE_URL: "postgresql+psycopg://zo:zo@127.0.0.1:5432/zo_app"
          JWT_SECRET: "ci-test-secret"
          JWT_ALG: "HS256"
          CLERK_PUBLISHABLE_KEY: "pk_test_ci"
          CLERK_SECRET_KEY: "sk_test_ci"
        run: python -m pytest tests/integration/test_axis_reality.py -v

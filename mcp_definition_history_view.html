<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Definition History View</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        th:hover {
            background-color: #e6e6e6;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .filter-container {
            margin-bottom: 20px;
        }
        .filter-container input {
            padding: 8px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>MCP Definition History</h1>
    <div class="filter-container">
        <input type="text" id="filterInput" placeholder="Filter by any field...">
    </div>
    <table id="mcpDefinitionHistoryTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">ID</th>
                <th onclick="sortTable(1)">Definition ID</th>
                <th onclick="sortTable(2)">Version</th>
                <th onclick="sortTable(3)">Change Type</th>
                <th onclick="sortTable(4)">Change Description</th>
                <th onclick="sortTable(5)">Changed By</th>
                <th onclick="sortTable(6)">Change Date</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Table data will be inserted here by JavaScript -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchData();
        });

        function fetchData() {
            // Fetch data from the API
            fetch('http://localhost:5000/mcp_definition_history_report_api.py')
                .then(response => response.json())
                .then(data => {
                    populateTable(data);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function populateTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.definition_id}</td>
                    <td>${item.version}</td>
                    <td>${item.change_type}</td>
                    <td>${item.change_description}</td>
                    <td>${item.changed_by}</td>
                    <td>${item.change_date}</td>
                `;
                tableBody.appendChild(row);
            });

            // Add event listener for filtering
            document.getElementById('filterInput').addEventListener('keyup', function() {
                filterTable();
            });
        }

        function filterTable() {
            const input = document.getElementById('filterInput');
            const filter = input.value.toUpperCase();
            const table = document.getElementById('mcpDefinitionHistoryTable');
            const tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                let rowVisible = false;
                const td = tr[i].getElementsByTagName('td');

                for (let j = 0; j < td.length; j++) {
                    if (td[j]) {
                        const txtValue = td[j].textContent || td[j].innerText;
                        if (txtValue.toUpperCase().indexOf(filter) > -1) {
                            rowVisible = true;
                            break;
                        }
                    }
                }

                tr[i].style.display = rowVisible ? '' : 'none';
            }
        }

        function sortTable(columnIndex) {
            const table = document.getElementById('mcpDefinitionHistoryTable');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const isAscending = table.querySelectorAll('th')[columnIndex].classList.toggle('asc');

            rows.sort((a, b) => {
                const aValue = a.cells[columnIndex].textContent;
                const bValue = b.cells[columnIndex].textContent;

                if (aValue < bValue) return isAscending ? -1 : 1;
                if (aValue > bValue) return isAscending ? 1 : -1;
                return 0;
            });

            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
</body>
</html>

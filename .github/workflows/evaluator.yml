name: evaluator

# Goose-T2 evaluator (cheap version). GH-hosted runner takes the role
# the tower-side Goose-T2 would otherwise play: run the canonical test
# target, naturally produce a check pass/fail, and upload junit.xml so
# the reverse-feed fetcher can ingest structured failures into
# mesh_memory as `gh_check_failure` rows.

on:
  push:
    branches:
      - "**"
  # pr-relander dispatches this on relanded PR branches: GITHUB_TOKEN pushes
  # (its update-branch merge commits) never fire push/pull_request workflows
  # (GitHub recursion guard), and `pytest` here is a REQUIRED context -- without
  # a dispatch path a relanded head can never report it and never merges.
  workflow_dispatch:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
        # No pip cache: this repo ships no dep manifest in git (dev/requirements-dev.txt
        # is tower-local and untracked), so there is nothing for setup-python's pip
        # cache to key off of. Install step below falls through to `pip install pytest`,
        # which is fast enough that the cache is not worth the lockfile gymnastics.

      - name: Install dependencies
        # Only dev/requirements-dev.txt exists in this repo (no pyproject /
        # requirements.txt). Most modules in this repo are designed for the
        # ZoComputer host and would not import cleanly here — that's fine,
        # the evaluator runs the small subset of environment-independent
        # tests selected below.
        run: |
          python -m pip install --upgrade pip
          if [ -f dev/requirements-dev.txt ]; then
            pip install -r dev/requirements-dev.txt
          else
            # requests is needed by zo_sentinel.probes.duckdb_schema_uptime_probe
            # (loaded at import time by its test module). Stays cheap to install.
            # PyYAML: tests/test_graph_gap_directives_wired.py proves a CI
            # caller from PARSED workflow structure, never from raw text
            # (FU-305 -- a commented-out path string reads as an invocation).
            # Pinned here rather than importorskip'd: a skip is not a pass.
            pip install pytest requests PyYAML
          # app-tier deps so the Perspectives/Ask module self-tests run here
          pip install -r tests/ci/requirements-ci.txt
          fi

      - name: Run pytest (Goose-T2 cheap evaluator)
        # Canonical targets, picked because they import cleanly outside the
        # /home/workspace/zo_sentinel layout:
        #   tests/test_scoring.py       - pure scoring boundary tests
        #   tests/test_evaluator_smoke.py - reverse-feed fetcher smoke
        #   tests/test_proposed_to_pending_promoter.py - Step 4b promoter
#   tests/test_hollow_gate.py   - the anti-hollow rule + every seam that calls it
#   tests/test_park_hollow.py   - parking a refused build (durable, not re-admitted)
        # Other tests (test_wiring, smoke_test, test_known_threats) require
        # the live ZoComputer host or have pre-existing failures unrelated
        # to this PR; they are intentionally not in the evaluator scope.
        # 2026-08-05: test_fire_gate.py and test_sha_green.py ADDED. They were
        # never in scope, so the fire-decision path -- the code deploy_prod.ps1
        # names as a precondition -- has been merging on a green that never
        # collected it, and main carried 2 failing tests there under a green
        # pytest. Both are network-free; the 2 failures are repaired in the same
        # commit, which is what makes adding them here safe rather than red.
        # Junit XML is the structured artifact that gh_actions_fetcher.py
        # parses when reverse-feeding failures into mesh_memory.
        run: |
          mkdir -p artifacts
          # 2026-09-01: the five tests/test_rescore_*.py files and the
          # vast_spend self-test ADDED. Until today NONE of them was collected
          # here, so every change to the weekly moat rescore -- the harness that
          # rents paid GPUs and writes the production corpus -- merged on a
          # green that had never run one of its tests. Caught by the count, not
          # the colour: this check reported `577 passed` on a PR that added ten
          # tests, which is exactly the same number it reported the day before.
          # All six are network-free (stdlib imports at module scope; psycopg2
          # and vastai_sdk are imported inside functions, and the one socket
          # touched is 127.0.0.1:9, whose REFUSAL is the assertion).
          # The last three are DEPLOY-SAFETY gates: Dockerfile COPY coverage,
          # the prod deploy wrapper's invariants, and the alembic revision
          # graph. Until 2026-07-27 none of them ran on a PR -- they lived only
          # in the tower-side verifier, so they gated nothing a human merges,
          # while the class they catch (FU-102) had already killed 7 prod
          # services on v64. All three are stdlib-only text/graph checks.
          python -m pytest \
            tests/test_fu_ledger_read_shape.py \
            tests/test_fu_ledger_fu_arg_shape.py \
            tests/test_fu_ledger_write_path_shape.py \
            tests/test_scoring.py \
            tests/test_evaluator_smoke.py \
            tests/test_schema_loader.py \
            tests/test_duckdb_schema_uptime_probe.py \
            tests/test_proposed_to_pending_promoter.py \
          tests/test_hollow_gate.py \
          tests/test_park_hollow.py \
            tests/test_sft_ingest.py \
            tests/test_artifact_ingestor.py \
            tests/test_ingestor_governor.py \
            tests/test_breaker_autorecover.py \
            tests/test_breaker_retire.py \
            tests/test_ladder_routing.py \
            tests/test_pr_publisher.py \
            tests/test_build_routing.py \
            tests/test_queue_janitor.py \
            tests/test_engine_build.py \
            tests/test_anchor_refill.py \
            tests/test_policy.py \
            tests/test_policy_chain_integration.py \
            tests/test_directive_simplifier.py \
            tests/test_perspectives_ask.py \
            tests/test_vast_jobs.py \
            tests/test_vuln_and_scan.py \
            tests/test_vuln_enrich_otx.py \
            tests/test_glama_counts.py \
            tests/test_tier_backfill_trust_cap.py \
            tests/test_vuln_surfacing.py \
            tests/test_freshness_metadata.py \
            tests/test_cadence_admin.py \
            tests/test_dockerfile_copy_covers_active_services.py \
            tests/test_deploy_prod_script.py \
            tests/test_ui_version_badge.py \
            tests/test_accept_gate.py \
            tests/test_migration_graph_single_head.py \
            tests/test_fire_gate.py \
            tests/test_sha_green.py \
            tests/test_ops_audit_state.py \
            tests/test_schema_truth_current.py \
            tests/test_queue_census.py \
            tests/test_graph_gap_directives_wired.py \
            tests/test_undeclared_write_guard.py \
            tests/test_rescore_billed_dph.py \
            tests/test_rescore_lstree_parse.py \
            tests/test_rescore_open_run_detection.py \
            tests/test_rescore_trust_priority.py \
            tests/test_rescore_refresh_yield.py \
            tests/test_vast_spend_selftest.py \
            tests/test_promoter_repair_wiring.py \
            tests/test_canary_classify_smoke.py \
            tests/test_requeue_quarantined.py \
            tests/test_quarantine_topup.py \
            tests/test_no_module_scope_test_imports.py \
            # 2026-09-10, improvement-loop cycle-0090: the 89 files below were
            # ADDED IN ONE BATCH. A census of ALL 18 workflow files (not just this
            # one) found 100 of the 156 tests/test_*.py on origin/main were named by
            # NO workflow, and no workflow runs a wholesale `pytest tests/` -- so
            # 64%% of the committed suite had been written, reviewed, merged and
            # NEVER ONCE EXECUTED. This is the same defect the 2026-08-05 and
            # 2026-09-01 notes above each repaired for one small family; batching it
            # is what stops it recurring a fourth time.
            # NOT a new gate (HARNESS_DOCTRINE R7, and the standing META CAP): no
            # check is added, no threshold moves. Assertions that were already
            # committed are simply made to run.
            # CHOSEN FROM EVIDENCE, NOT OPTIMISM: all 100 were executed against a
            # clean origin/main worktree first; 89 PASS, 9 FAIL, 2 collect nothing.
            # ONLY THE 89 ARE ADDED, so this batch cannot dam the queue with a red
            # that is not about the PR under test. The 11 excluded are real latent
            # breakage and are reported separately -- they are findings, not noise.
            # NEGATIVE CONTROL: `pytest -q` on this file list before the batch
            # collected 0 of these 89; the junit test count must rise by roughly the
            # number they contain, and a count that does not move means the batch
            # ran none of them (the 2026-09-01 tell, restated).
            tests/test_app_surface_kl.py \
            tests/test_arch_salvage.py \
            tests/test_architect_rotation.py \
            tests/test_architect_service_schooling.py \
            tests/test_bakeoff_scorer.py \
            tests/test_build_completion.py \
            tests/test_build_lessons.py \

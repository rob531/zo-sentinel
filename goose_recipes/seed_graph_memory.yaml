version: "1.0.0"
title: "Seed goose Memory from the graphify code graph"
description: >
  Reads the code-graph domain map (Leiden communities = the app's domains) + the
  parked list and stores them in goose's native Memory, so the Directive Architect
  recalls the app's domain landscape every session and ranges across it instead of
  fixating on ~5 subjects. Idempotent; schedule it to keep the memory fresh.
extensions:
  - type: builtin
    name: developer        # shell -- run the digest tool
  - type: builtin
    name: memory           # remember_memory / retrieve_memories
prompt: |-
  Seed goose Memory from the live repo code graph. Do EXACTLY these steps, then
  STOP -- do NOT propose or build anything:

  1. Run this and capture its full stdout:
       python3 /home/workspace/zo_sentinel/tools/graph_domain_digest.py
     It prints a compact DOMAIN MAP (the app's domains + module counts) followed by
     a PARKED list. If it errors (bus unreachable), report the error and STOP.

  2. Store it natively with the memory tool:
       remember_memory(category="repo_domain_map", is_global=false,
                       tags="graph domains landscape range",
                       data=<the FULL stdout from step 1, verbatim -- it is already
                             compact; do not expand it>)

  3. Verify with retrieve_memories(category="repo_domain_map"), report how many
     domains were stored, and STOP. This recipe ONLY seeds memory.

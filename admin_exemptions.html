<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Exemptions Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .exemptions-list {
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .revoke-btn {
            background-color: #f44336;
        }
        .revoke-btn:hover {
            background-color: #d32f2f;
        }
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manage MCP Exemptions</h1>

        <div class="exemptions-list">
            <h2>Current Exemptions</h2>
            <table id="exemptionsTable">
                <thead>
                    <tr>
                        <th>MCP Name</th>
                        <th>Reason</th>
                        <th>Expires At</th>
                        <th>Approved By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="exemptionsBody">
                    <!-- Exemptions will be loaded here -->
                </tbody>
            </table>
        </div>

        <div class="add-exemption">
            <h2>Add New Exemption</h2>
            <form id="addExemptionForm">
                <div class="form-group">
                    <label for="mcp_name">MCP Name:</label>
                    <input type="text" id="mcp_name" name="mcp_name" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason:</label>
                    <textarea id="reason" name="reason" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="expires_at">Expires At:</label>
                    <input type="datetime-local" id="expires_at" name="expires_at" required>
                </div>
                <div class="form-group">
                    <label for="approved_by">Approved By:</label>
                    <input type="text" id="approved_by" name="approved_by" required>
                </div>
                <button type="submit">Add Exemption</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mock data for testing
            const mockExemptions = [
                {
                    id: 1,
                    mcp_name: "MCP-001",
                    reason: "Temporary maintenance",
                    expires_at: "2023-12-31T23:59:59",
                    approved_by: "Admin1"
                },
                {
                    id: 2,
                    mcp_name: "MCP-002",
                    reason: "Scheduled downtime",
                    expires_at: "2023-11-30T23:59:59",
                    approved_by: "Admin2"
                }
            ];

            // Load exemptions on page load
            loadExemptions(mockExemptions);

            // Handle form submission
            document.getElementById('addExemptionForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = {
                    mcp_name: document.getElementById('mcp_name').value,
                    reason: document.getElementById('reason').value,
                    expires_at: document.getElementById('expires_at').value,
                    approved_by: document.getElementById('approved_by').value
                };

                // Mock API call to add exemption
                mockAddExemption(formData);
            });
        });

        function loadExemptions(exemptions) {
            const tbody = document.getElementById('exemptionsBody');
            tbody.innerHTML = '';

            exemptions.forEach(exemption => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${exemption.mcp_name}</td>
                    <td>${exemption.reason}</td>
                    <td>${new Date(exemption.expires_at).toLocaleString()}</td>
                    <td>${exemption.approved_by}</td>
                    <td>
                        <button class="revoke-btn" onclick="revokeExemption(${exemption.id})">Revoke</button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        function mockAddExemption(formData) {
            // Mock API call to add exemption
            console.log('Adding exemption:', formData);

            // In a real application, you would send this data to your backend API
            // For this example, we'll just add it to our mock data and reload the table
            const newExemption = {
                id: Date.now(), // Simple way to generate a unique ID
                ...formData
            };

            // In a real app, you would fetch the updated list from the server
            const updatedExemptions = [...mockExemptions, newExemption];
            loadExemptions(updatedExemptions);

            // Reset the form
            document.getElementById('addExemptionForm').reset();
        }

        function revokeExemption(exemptionId) {
            // Mock API call to revoke exemption
            console.log('Revoking exemption with ID:', exemptionId);

            // In a real application, you would send this request to your backend API
            // For this example, we'll just remove it from our mock data and reload the table
            const updatedExemptions = mockExemptions.filter(exemption => exemption.id !== exemptionId);
            loadExemptions(updatedExemptions);
        }
    </script>
</body>
</html>

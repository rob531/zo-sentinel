name: pr-gates

# Pull-request quality gates for the zo-sentinel app:
#   1. static-analysis -- ruff (pyflakes + syntax/runtime errors)
#   2. smoke-ladder     -- the recursive hermetic smoke gates (tests/ci)
#
# Both run on every PR and must pass to merge. They are HERMETIC: no ZoComputer
# host, no write_service, no /home/workspace. The smoke ladder stands up a mock
# write_service + an ephemeral DuckDB in-runner (see tests/ci/run_ci_smoke.py).
#
# This is the GitHub-side counterpart to the host-only gates under tests/gates/
# (run by `zm go` / watchdog on ZoComputer). Both emit junit so
# gh_actions_fetcher.py can reverse-feed failures into mesh_memory.

on:
  pull_request:
  push:
    branches:
      - "feature/ci-smoke-gates"   # let the introducing branch self-verify pre-merge

permissions:
  contents: read

jobs:
  capmap-check:
    # The "check these pulls" gate: a deterministic capmap scan -> schema-drift +
    # orphaned-UI report on every PR. Pure stdlib static scan (no host, no deps).
    # BLOCKING as of 2026-06-10: drift is 0, so any PR that introduces a wrong-table
    # reference (endpoint -> table not in schema/app.sql) now fails the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Deterministic capmap pull-check (BLOCKING -- fails on schema drift)
        run: python tools/pull_check.py

      - name: Reachability ratchet (ENFORCE -- blocks silent orphan growth)
        # 2026-07-19 postmortem: every gate we had was differential or local, so
        # none could see 246 routers that mount nowhere. This is the missing
        # assertion class -- a global existential invariant over the repo.
        #
        # ARMED 2026-07-21 by CofC ruling. It sat in observe for two days and
        # the census drifted 246 -> 276 (+30 in a single day) while the gate
        # blocked nothing, which is the same shape as every expensive failure
        # here: an instrument reporting faithfully into a place nobody reads.
        #
        # This does NOT require anyone to mount anything. The baseline is pinned
        # at 276 (the level, frozen) and the gate is on the DERIVATIVE, so no
        # pre-existing orphan fails any PR. A PR that adds a NEW unmounted
        # router passes by either mounting it or naming it in
        # tools/reachability_deferred.json with a one-line reason. The builder
        # is structurally incapable of mounting (module_from_exemplar lane guard
        # + edit-class output_file:null), so without that hatch this flag would
        # be an unsatisfiable predicate and every builder PR would go red for a
        # rule none of them could comply with. Declaring is not mounting; what
        # stops here is SILENT orphan growth.
        #
        # ROLLBACK is one word: delete `--enforce` from the run line below.
        # HALT CONDITION (ruling): >3 builder PRs red on this gate within 6h.
        run: python tools/reachability_ratchet.py --enforce

      - name: Upload reachability census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reachability-ratchet
          path: artifacts/reachability_ratchet.json
          if-no-files-found: warn
          retention-days: 30

      - name: Reachability trend check (advisory)
        # The ratchet is per-PR; this is the cross-day view it structurally
        # cannot have. Advisory in CI (|| true) because a shallow CI checkout
        # has no trend history -- the authoritative daily row is appended on the
        # tower by the chairman review. Here it only proves the script runs.
        if: always()
        run: python tools/reachability_trend.py --check-only || true

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff (BLOCKING -- maintained surface)
        # Real-bug rules (F = pyflakes, E9 = syntax/runtime) over the code we
        # maintain. A new undefined name / unused import / broken f-string here
        # fails the PR.
        run: |
          ruff check --select F,E9 --output-format github \
            zo_sentinel tests/ci tests/gates

      - name: Ruff (report-only -- whole repo)
        # Visibility into the legacy root debt without blocking. Ratchet target.
        if: always()
        run: |
          ruff check --select F,E9 --exit-zero --output-format github .

  smoke-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CI ladder deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt

      - name: Run recursive smoke ladder
        # tier0 syntax -> tier1 import -> tier2 schema -> tier3 mock-service,
        # short-circuiting on the first tier that fails.
        env:
          CI_SMOKE_WS_PORT: "8772"
          CI_SMOKE_JUNIT: "artifacts/ci_smoke_junit.xml"
        run: python -m tests.ci.run_ci_smoke

      - name: Upload smoke junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-smoke-junit
          path: artifacts/ci_smoke_junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CI ladder deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt

      - name: Stage ui_server host path
        # ui_server.py (a PROTECTED file we boot unmodified) does a module-level
        # mkdir on /home/workspace/zo_sentinel/logs and talks to write_service on
        # 127.0.0.1:8772. Create + own the path so the import succeeds; the
        # runner starts a mock on 8772 itself. FE2/FE3 self-skip if this is
        # absent, but in CI we make them run for real.
        run: |
          sudo mkdir -p /home/workspace/zo_sentinel/logs
          sudo chown -R "$(whoami)" /home/workspace

      - name: Run front-end runner
        # FE0 html -> FE1 html_interactive -> FE2 app_build -> FE3 routes,
        # driving ui_server's FastAPI app in-process via Starlette TestClient.
        env:
          CI_FE_WS_PORT: "8772"
          CI_FE_JUNIT: "artifacts/ci_frontend_junit.xml"
        run: python -m tests.ci.run_ci_frontend

      - name: Upload frontend junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend-junit
          path: artifacts/ci_frontend_junit.xml
          if-no-files-found: warn
          retention-days: 14

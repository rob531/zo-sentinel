#!/usr/bin/env python3
"""
Supervisord configuration updater for ZO-SENTINEL.
Adds mcp_directory_ingestor daemon and ensures existing daemons have autorestart=true.
"""
import re
import subprocess
import sys
from pathlib import Path

SUPERVISORD_CONF = Path("/etc/zo/supervisord-user.conf")
LOG_DIR = Path("/home/workspace/logs")

DAEMONS_TO_ADD = [
    {
        "name": "mcp_directory_ingestor",
        "command": "python3 /home/workspace/zo_sentinel/mcp_directory_ingestor.py",
        "directory": "/home/workspace/zo_sentinel",
    }
]

DAEMONS_TO_VERIFY = [
    "candidate_github_promoter",
    "candidate_npm_promoter",
    "threat_intel_ingestor",
    "signal_bridge",
]


def log(msg):
    print(f"[supervisord_updater] {msg}", file=sys.stderr)


def ensure_log_directory():
    LOG_DIR.mkdir(parents=True, exist_ok=True)


def read_config():
    if not SUPERVISORD_CONF.exists():
        log(f"Config file not found: {SUPERVISORD_CONF}")
        return None
    return SUPERVISORD_CONF.read_text()


def write_config(content):
    SUPERVISORD_CONF.write_text(content)
    log(f"Updated config: {SUPERVISORD_CONF}")


def parse_existing_programs(content):
    programs = {}
    current_name = None
    current_lines = []
    
    for line in content.splitlines():
        prog_match = re.match(r'^\[program:([^\]]+)\]', line)
        if prog_match:
            if current_name:
                programs[current_name] = current_lines
            current_name = prog_match.group(1)
            current_lines = [line]
        else:
            current_lines.append(line)
    
    if current_name:
        programs[current_name] = current_lines
    
    return programs


def program_to_section(name, config):
    lines = [f"[program:{name}]"]
    for key, value in config.items():
        lines.append(f"{key}={value}")
    return "\n".join(lines) + "\n"


def update_config(content):
    programs = parse_existing_programs(content)
    
    for daemon in DAEMONS_TO_ADD:
        name = daemon["name"]
        if name not in programs:
            log_config = {
                "command": daemon["command"],
                "directory": daemon["directory"],
                "autostart": "true",
                "autorestart": "true",
                "startretries": "5",
                "stdout_logfile": f"/home/workspace/logs/{name}.log",
                "stderr_logfile": f"/home/workspace/logs/{name}.log",
                "stdout_logfile_maxbytes": "50MB",
            }
            section = program_to_section(name, log_config)
            content += "\n" + section
            log(f"Added daemon: {name}")
        else:
            log(f"Daemon already exists: {name}")
    
    for daemon_name in DAEMONS_TO_VERIFY:
        if daemon_name in programs:
            lines = programs[daemon_name]
            autorestart_found = False
            has_autorestart_true = False
            
            for line in lines:
                if line.strip().startswith("autorestart="):
                    autorestart_found = True
                    if line.strip() == "autorestart=true":
                        has_autorestart_true = True
                    break
            
            if not autorestart_found:
                insert_idx = len(content)
                for i, line in enumerate(content.splitlines()):
                    if line.strip() == f"[program:{daemon_name}]":
                        insert_idx = content.find("\n", content.find(line) + len(line)) + 1
                        break
                if insert_idx == len(content):
                    insert_idx = content.rfind("\n") + 1
                content = content[:insert_idx] + "autorestart=true\n" + content[insert_idx:]
                log(f"Added autorestart=true to {daemon_name}")
            elif not has_autorestart_true:
                log(f"Updating autorestart for {daemon_name}")
                for old_val in ["autorestart=false", "autorestart=unexpected", "autorestart=no"]:
                    content = content.replace(
                        f"[program:{daemon_name}]",
                        f"[program:{daemon_name}]"
                    )
                    pattern = rf'^autorestart=(?:false|unexpected|no)$'
                    content = re.sub(
                        rf'(\[program:{re.escape(daemon_name)}\].*\n)',
                        lambda m: re.sub(r'autorestart=(?:false|unexpected|no)', 'autorestart=true', m.group(0)),
                        content,
                        flags=re.MULTILINE
                    )
                content = re.sub(
                    rf'^autorestart=(?:false|unexpected|no)$',
                    'autorestart=true',
                    content,
                    flags=re.MULTILINE
                )
                log(f"Fixed autorestart for {daemon_name}")
        else:
            log(f"Daemon not found for verification: {daemon_name}")
    
    return content


def run_supervisorctl(cmd):
    full_cmd = f"supervisorctl -c /etc/zo/supervisord-user.conf {cmd}"
    log(f"Running: {full_cmd}")
    result = subprocess.run(
        full_cmd,
        shell=True,
        capture_output=True,
        text=True
    )
    if result.stdout:
        log(f"stdout: {result.stdout}")
    if result.stderr:
        log(f"stderr: {result.stderr}")
    return result.returncode, result.stdout, result.stderr


def check_daemon_status(name):
    code, stdout, stderr = run_supervisorctl("status")
    for line in stdout.splitlines():
        if name in line:
            return line
    return None


def ensure_daemon_running(name):
    code, stdout, stderr = run_supervisorctl(f"start {name}")
    if code == 0:
        log(f"Started: {name}")
    else:
        log(f"Start result for {name}: {stdout} {stderr}")
    
    import time
    time.sleep(2)
    
    status = check_daemon_status(name)
    if status and "RUNNING" in status:
        log(f"Confirmed RUNNING: {name}")
        return True
    elif status:
        log(f"Status: {status}")
        return "RUNNING" in status
    return False


def verify_log_exists(name):
    log_file = LOG_DIR / f"{name}.log"
    if log_file.exists():
        log(f"Log exists: {log_file}")
        size = log_file.stat().st_size
        log(f"Log size: {size} bytes")
        if size > 0:
            try:
                last_lines = log_file.read_text().splitlines()[-5:]
                log(f"Last log entries: {last_lines}")
            except Exception as e:
                log(f"Could not read log: {e}")
        return True
    else:
        log(f"Log NOT found: {log_file}")
        return False


def main():
    ensure_log_directory()
    
    content = read_config()
    if content is None:
        log("Failed to read config, exiting")
        return 1
    
    new_content = update_config(content)
    write_config(new_content)
    
    code, _, _ = run_supervisorctl("reread")
    if code != 0:
        log("Reread command failed")
    
    code, _, _ = run_supervisorctl("update")
    if code != 0:
        log("Update command failed")
    
    log("Checking mcp_directory_ingestor status...")
    status = check_daemon_status("mcp_directory_ingestor")
    if status:
        log(f"Status before start: {status}")
    
    success = ensure_daemon_running("mcp_directory_ingestor")
    
    verify_log_exists("mcp_directory_ingestor")
    
    if success:
        log("SUCCESS: mcp_directory_ingestor is RUNNING")
        return 0
    else:
        log("WARNING: mcp_directory_ingestor may not be fully RUNNING")
        return 0


if __name__ == "__main__":
    sys.exit(main())
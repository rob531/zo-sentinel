<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Details</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .risk-tier {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .risk-tier.high {
            background-color: #ff6b6b;
            color: white;
        }
        .risk-tier.medium {
            background-color: #ffcc00;
            color: #333;
        }
        .risk-tier.low {
            background-color: #2ed573;
            color: white;
        }
        .signal-score {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .signal-score .score {
            font-weight: bold;
        }
        .attestation-status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .attestation-status.verified {
            background-color: #2ed573;
            color: white;
        }
        .attestation-status.unverified {
            background-color: #ff6b6b;
            color: white;
        }
        .threat-intel {
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h1>MCP Server Details</h1>
                <div id="server-details" class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h2 id="server-name">Loading...</h2>
                                <p id="server-description">Loading...</p>
                            </div>
                            <div class="col-md-6 text-right">
                                <div id="risk-tier" class="risk-tier">Loading...</div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <h3>Signal Scores</h3>
                                <div id="signal-scores">
                                    <div class="signal-score">
                                        <span>Loading...</span>
                                        <span class="score">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <h3>Attestation Status</h3>
                                <div id="attestation-status" class="attestation-status">Loading...</div>
                            </div>
                        </div>
                        <div class="row mt-4 threat-intel">
                            <div class="col-md-12">
                                <h3>Threat Intelligence</h3>
                                <div id="threat-intel">
                                    <p>Loading...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock data for demonstration
        const mockData = {
            server: {
                id: 1,
                name: "MCP Server 1",
                description: "This is a sample MCP server used for demonstration purposes.",
                risk_tier: "medium",
                signals: [
                    { name: "Network Activity", score: 85 },
                    { name: "File Integrity", score: 92 },
                    { name: "Process Monitoring", score: 78 },
                    { name: "User Activity", score: 88 }
                ],
                attestation: {
                    status: "verified",
                    last_verified: "2023-10-15T14:30:00Z"
                },
                threat_intel: {
                    summary: "No active threats detected. Last scan was clean.",
                    details: "The server has been scanned for known vulnerabilities and malware. No issues were found during the last scan."
                }
            }
        };

        // Function to render the server details
        function renderServerDetails(server) {
            document.getElementById('server-name').textContent = server.name;
            document.getElementById('server-description').textContent = server.description;

            const riskTierElement = document.getElementById('risk-tier');
            riskTierElement.textContent = server.risk_tier.charAt(0).toUpperCase() + server.risk_tier.slice(1);
            riskTierElement.className = `risk-tier ${server.risk_tier}`;

            const signalScoresElement = document.getElementById('signal-scores');
            signalScoresElement.innerHTML = '';
            server.signals.forEach(signal => {
                const signalElement = document.createElement('div');
                signalElement.className = 'signal-score';
                signalElement.innerHTML = `
                    <span>${signal.name}</span>
                    <span class="score">${signal.score}</span>
                `;
                signalScoresElement.appendChild(signalElement);
            });

            const attestationStatusElement = document.getElementById('attestation-status');
            attestationStatusElement.textContent = server.attestation.status.charAt(0).toUpperCase() + server.attestation.status.slice(1);
            attestationStatusElement.className = `attestation-status ${server.attestation.status}`;

            const threatIntelElement = document.getElementById('threat-intel');
            threatIntelElement.innerHTML = `
                <p>${server.threat_intel.summary}</p>
                <p><strong>Details:</strong> ${server.threat_intel.details}</p>
                <p><strong>Last Scan:</strong> ${new Date(server.attestation.last_verified).toLocaleString()}</p>
            `;
        }

        // Simulate API call and render the data
        setTimeout(() => {
            renderServerDetails(mockData.server);
        }, 1000);
    </script>
</body>
</html>

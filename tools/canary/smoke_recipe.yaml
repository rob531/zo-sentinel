version: "1.0.0"
title: "goose canary smoke"
description: >
  Minimal recipe to prove a CANDIDATE goose version still (a) loads a recipe,
  (b) drives a model, and (c) executes a developer/shell tool call -- the three
  things a goose upgrade is most likely to break for us. Bus-free: no zo bridges,
  so it isolates goose-core health from our pipeline. The workflow greps stdout
  for the nonce to assert the full loop worked.
extensions:
  - type: builtin
    timeout: 900  # FU-017: MCP request timeout for this extension. NOTE (canary-proven 2026-07-19): the 1.43 developer-shell kill (#10348) is governed ONLY by GOOSE_DEFAULT_EXTENSION_TIMEOUT env/config (set 900 in zo_mesh/.zo_env), NOT this field.
    name: developer
prompt: |-
  Run exactly this shell command and report its output, then STOP:
    echo "CANARY_TOOLCALL_OK::{{ nonce }}"
  Do not do anything else.
parameters:
  - key: nonce
    input_type: string
    requirement: required
    description: "unique token the CI asserts on"

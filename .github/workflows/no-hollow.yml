name: no-hollow
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  no-hollow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject hollow scaffolds
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python tests/ci/no_hollow_scaffold.py

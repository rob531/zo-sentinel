<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Axis Scores Distribution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .total {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>LLM Axis Scores Distribution</h1>
    <table id="scoresTable">
        <thead>
            <tr>
                <th>Axis</th>
                <th>Average Score</th>
                <th>Minimum Score</th>
                <th>Maximum Score</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be populated by JavaScript -->
        </tbody>
    </table>
    <div class="total">Total: <span id="totalCount">0</span></div>

    <script>
        // Fetch data from the API endpoint
        fetch('/llm-axis-scores/distribution')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#scoresTable tbody');
                const totalCount = document.getElementById('totalCount');

                // Populate the table with data
                data.axes.forEach(axis => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${axis.axis}</td>
                        <td>${axis.avg_score.toFixed(2)}</td>
                        <td>${axis.min_score}</td>
                        <td>${axis.max_score}</td>
                    `;
                    tbody.appendChild(row);
                });

                // Update the total count
                totalCount.textContent = data.total;
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    </script>
</body>
</html>

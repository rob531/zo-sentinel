name: goose-canary

# Eval a CANDIDATE goose version BEFORE it touches the live tower (rule #1: don't
# break goose). The live mesh is on 1.43.0 (flipped 2026-07-19, FU-017/#1652).
# This canary proves an upgrade is safe:
#   1. install the candidate goose,
#   2. tool-call smoke (new goose loads a recipe + drives a model + calls a tool),
#   3. stdio NAMESPACING probe (scar #454 -- 1.38 renamed stdio tools and starved
#      the architect at +0; every version bump MUST clear this),
#   4. PreToolUse hook fire/deny parity,
#   5. our-recipe load check (architect.yaml / directive_architect.yaml still parse),
#   6. LONG SHELL STEP (FU-017/#10348 -- the 300s default shell kill must stay
#      overridden by GOOSE_DEFAULT_EXTENSION_TIMEOUT),
#   7. full writer integration tier (real ephemeral write_service + DB round-trip),
# then report pass/fail. Manual-only; never auto-runs.
#
# 2026-07-27: steps 3 and 6 were ADDED. Their recipes were committed on 2026-07-19
# and run ad hoc during the 1.43 flip, but no workflow step ever invoked them --
# the scar-#454 guard the upgrade doctrine requires existed as a FILE and not as a
# GATE. That is the "proves presence, never correctness" class (Harness Engineering
# row, GOOSE_WATCH). Also repointed the installer from block/goose to aaif-goose/goose
# (the project moved to the Linux Foundation's AAIF; the old org only worked by
# GitHub rename-redirect, which is not a contract).

on:
  workflow_dispatch:
    inputs:
      goose_version:
        description: "candidate goose version (e.g. 1.44.0)"
        required: true
        default: "1.44.0"
      smoke_rung:
        description: "cheap provider to drive the smoke (cerebras|groq)"
        default: "cerebras"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      - name: Install candidate goose (Rust CLI, aaif-goose org)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false GOOSE_VERSION="v${{ inputs.goose_version }}" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: goose --version
        run: goose --version

      - name: Map smoke rung to goose provider env
        run: |
          set -euo pipefail
          if [ "${{ inputs.smoke_rung }}" = "cerebras" ]; then
            echo "OPENAI_BASE_URL=https://api.cerebras.ai/v1" >> "$GITHUB_ENV"
            echo "OPENAI_API_KEY=${{ secrets.CEREBRAS_API_KEY }}" >> "$GITHUB_ENV"
            echo "GOOSE_MODEL=gpt-oss-120b" >> "$GITHUB_ENV"
          elif [ "${{ inputs.smoke_rung }}" = "groq" ]; then
            echo "OPENAI_BASE_URL=https://api.groq.com/openai/v1" >> "$GITHUB_ENV"
            echo "OPENAI_API_KEY=${{ secrets.GROQ_API_KEY }}" >> "$GITHUB_ENV"
            echo "GOOSE_MODEL=llama-3.3-70b-versatile" >> "$GITHUB_ENV"
          else
            echo "unknown rung ${{ inputs.smoke_rung }}"; exit 1
          fi
          echo "GOOSE_PROVIDER=openai" >> "$GITHUB_ENV"

      - name: Tool-call smoke (recipe load + model + tool call)
        run: |
          set -euo pipefail
          NONCE="ci-$RANDOM-$RANDOM"
          goose run --no-session --recipe tools/canary/smoke_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/smoke.out
          if grep -q "CANARY_TOOLCALL_OK::$NONCE" /tmp/smoke.out; then
            echo "SMOKE PASS: new goose loads recipe + drives model + calls a tool"
          else
            echo "SMOKE FAIL: nonce not echoed -- this goose broke our recipe/tool loop"
            exit 1
          fi

      # SCAR #454 (goose 1.38): stdio tool names were namespaced away from what
      # directive_architect.yaml hardcodes, every architect call returned
      # "Tool not found", and the architect silently emitted +0 for days. The
      # probe loads the REAL zo_directive_bridge stdio extension and calls the
      # VERBATIM name the architect recipe uses. cwd MUST be the repo root so the
      # relative extension arg resolves (goose stdio extensions resolve paths
      # against the goose PROCESS cwd). directive_mcp.py is stdlib-only, so this
      # step needs no extra install.
      - name: stdio namespacing probe (scar #454 -- MANDATORY for any version bump)
        run: |
          set -euo pipefail
          NONCE="ns-$RANDOM-$RANDOM"
          goose run --no-session --recipe tools/canary/namespacing_probe_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/namespacing.out
          if grep -q "NAMESPACING_OK::$NONCE" /tmp/namespacing.out; then
            echo "NAMESPACING PASS: zo_directive_bridge__read_protected_files resolves verbatim under this goose"
          else
            echo "NAMESPACING FAIL: the architect's hardcoded tool name did NOT resolve."
            echo "This is the 1.38 starvation shape. DO NOT FLIP. Tool list the agent reported:"
            tail -40 /tmp/namespacing.out
            exit 1
          fi

      - name: PreToolUse hooks test (do hooks fire under `goose run`? is deny enforced?)
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.agents/plugins"
          cp -R tools/canary/plugins/tool-budget "$HOME/.agents/plugins/tool-budget"
          cp -R tools/canary/plugins/hook-probe  "$HOME/.agents/plugins/hook-probe"
          rm -f /tmp/tool_budget*.count /tmp/tool_budget.log /tmp/budget_exec_* /tmp/hook_probe_fired
          HOOK_BUDGET=2 goose run --no-session --recipe tools/canary/hook_budget_recipe.yaml 2>&1 | tee /tmp/hook.out || true
          fired=no; [ -f /tmp/hook_probe_fired ] && fired=yes
          ran=$(ls /tmp/budget_exec_* 2>/dev/null | wc -l | tr -d ' ')
          echo "hooks_fire_under_goose_run=$fired ; tools_executed=$ran (budget=2)"
          echo "--- tool-budget log ---"; cat /tmp/tool_budget.log 2>/dev/null || echo "(empty)"
          if [ "$fired" = no ]; then
            echo "VERDICT: hooks DO NOT fire under \`goose run\` -> PreToolUse approach is DEAD for the architect (it runs non-interactively). Go recipe-simplification."
            exit 1
          fi
          if [ "$ran" -le 2 ]; then
            echo "VERDICT: PASS -- hooks fire AND deny enforced ($ran<=2). Build the architect tool-budget hook."
          else
            echo "VERDICT: hooks fire but DENY IGNORED ($ran>2). Use exit-2 deny or another convergence lever."
            exit 1
          fi

      - name: Our-recipe load check (catch recipe-schema breaks)
        run: |
          set -uo pipefail
          rc=0
          for r in goose_recipes/directive_architect.yaml goose_recipes/architect.yaml; do
            out="$(timeout 25 goose run --no-session --recipe "$r" 2>&1 || true)"
            if echo "$out" | grep -qiE "Loading recipe|provide the following parameters"; then
              echo "LOAD OK (schema parses under this goose): $r"
            else
              echo "LOAD FAIL: $r"; echo "$out" | tail -5; rc=1
            fi
          done
          exit $rc

      # FU-017 / upstream #10348: from 1.43 the default extension timeout applies
      # to the builtin developer SHELL, and it is governed ONLY by
      # GOOSE_DEFAULT_EXTENSION_TIMEOUT -- the per-extension `timeout:` field in the
      # recipe is NOT honoured for that kill (canary-proven 2026-07-19: negative
      # control died at exactly 300s). The tower exports 900 in zo_mesh/.zo_env;
      # this step asserts that guard still works on the candidate version, because
      # builder shell steps (installs, test suites) routinely exceed 300s.
      - name: Long shell step (FU-017 -- 300s default kill must stay overridden)
        env:
          GOOSE_DEFAULT_EXTENSION_TIMEOUT: "900"
        run: |
          set -euo pipefail
          NONCE="ls-$RANDOM-$RANDOM"
          goose run --no-session --recipe tools/canary/long_shell_step_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/long_shell.out
          if grep -q "LONG_STEP_OK::$NONCE" /tmp/long_shell.out; then
            echo "LONG STEP PASS: a 400s shell call survived under GOOSE_DEFAULT_EXTENSION_TIMEOUT=900"
          else
            echo "LONG STEP FAIL: the 400s shell call did not complete. Either the env guard"
            echo "no longer overrides the default kill, or the resolution order changed again."
            echo "DO NOT FLIP -- long builder shell steps would be silently truncated."
            tail -40 /tmp/long_shell.out
            exit 1
          fi

      - name: Full writer integration tier (real ephemeral write_service)
        env:
          IT_WS_PORT: "8772"
          ZO_WRITE_SERVICE: "http://127.0.0.1:8772"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt pytest
          nohup python tests/integration/it_write_service.py > /tmp/it_ws.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8772/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://127.0.0.1:8772/health || { echo "ws failed to start"; cat /tmp/it_ws.log; exit 1; }
          python -m pytest tests/integration -v

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- smoke ---"; cat /tmp/smoke.out 2>/dev/null || true
          echo "--- namespacing ---"; cat /tmp/namespacing.out 2>/dev/null || true
          echo "--- hooks ---"; cat /tmp/hook.out 2>/dev/null || true
          echo "--- long shell ---"; cat /tmp/long_shell.out 2>/dev/null || true
          echo "--- write_service ---"; cat /tmp/it_ws.log 2>/dev/null || true

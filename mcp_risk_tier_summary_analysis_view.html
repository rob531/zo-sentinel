<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tier Summary Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .highlight {
            background-color: #e6f7ff;
        }
    </style>
</head>
<body>
    <h1>Risk Tier Summary Analysis</h1>
    <p>This page displays the distribution of risk tiers across all servers in the registry.</p>

    <table>
        <thead>
            <tr>
                <th>Risk Tier</th>
                <th>Count</th>
                <th>Percentage</th>
            </tr>
        </thead>
        <tbody id="riskTierData">
            <!-- Data will be populated by JavaScript -->
        </tbody>
    </table>

    <script>
        // Fetch data from the API endpoint
        fetch('/risk-tier-summary')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('riskTierData');
                let total = 0;

                // Calculate total count
                for (const tier in data) {
                    total += data[tier];
                }

                // Sort tiers by count (descending)
                const sortedTiers = Object.entries(data).sort((a, b) => b[1] - a[1]);

                // Populate the table
                sortedTiers.forEach(([tier, count], index) => {
                    const percentage = ((count / total) * 100).toFixed(2);
                    const row = document.createElement('tr');

                    if (index < 5) {
                        row.classList.add('highlight');
                    }

                    row.innerHTML = `
                        <td>${tier}</td>
                        <td>${count}</td>
                        <td>${percentage}%</td>
                    `;

                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('riskTierData').innerHTML = '<tr><td colspan="3">Error loading data. Please try again later.</td></tr>';
            });
    </script>
</body>
</html>

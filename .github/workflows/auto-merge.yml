name: auto-merge

# Owner-directed auto-merge:
#   (A) autonomous-build PRs -> squash auto-merge only once the triage bot labels them
#       'triage:solid' (CI green + mergeable + NOT dup/scaffold/stale) AND required checks pass,
#       EXCEPT scoring/enrichment paths (training-convergence freeze -> labelled
#       freeze-hold, left for manual review until the LLM-risk cutover).
#   (B) Dependabot PRs -> squash auto-merge patch + minor updates once green;
#       MAJOR bumps fall through to manual review (breaking-change risk).
# Required checks are enforced by branch protection (capmap-check, static-analysis,
# smoke-ladder, frontend, pytest); enforce_admins=false keeps a manual escape hatch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # The triage bot adds triage:solid with GITHUB_TOKEN, whose events (GitHub
  # recursion guard) do NOT re-fire the 'labeled' trigger above -- so after each
  # pr-triage run, sweep its fresh solids and enable auto-merge here.
  workflow_run:
    workflows: ["pr-triage", "pr-gates", "evaluator", "no-hollow", "schema-prm", "referent-verify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# RATE-BUDGET GUARD (added 2026-09-04).
#
# MEASURED, 2026-09-04 (only these three numbers are measurements):
#   - auto-merge runs: 100 runs spanning 4.67h == ~21/hour.
#   - `pr-relander` still dies at 23:01Z on "GraphQL: API rate limit already
#     exceeded for site ID installation", 0.3s after its token validates.
#   - 14 of the 30 open autonomous-build+triage:solid PRs are ALREADY armed,
#     and both sweeps below re-arm them on every run. `gh pr merge --auto` on
#     an armed PR is a no-op; the `gh pr view` preceding it is not.
#
# NOT ESTABLISHED: that these sweeps are the sole or even the dominant consumer
# of the installation budget. An earlier estimate of ~7,800 calls/hour assumed
# ~250 triage:solid PRs; the real figure is 30, so that arithmetic was wrong and
# is withdrawn. This change removes measured waste and a real burst amplifier.
# It may not be sufficient. Whatever is actually draining the budget still needs
# to be identified by logging resources.graphql.used/remaining at the head of
# each job -- do not read a green relander as proof this was the whole cause.
#
# Two sweep jobs fire on workflow_run:completed for SIX workflows, so one CI
# pass over one PR can start six identical sweeps. A cancelled sweep is
# superseded by an identical newer one, so collapsing a burst loses nothing.
# Mirrors pr-relander.yml's own `group: pr-relander`.
concurrency:
  group: auto-merge-sweep
  cancel-in-progress: true

jobs:
  autonomous-build:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'autonomous-build') && contains(github.event.pull_request.labels.*.name, 'triage:solid') && github.event.pull_request.draft == false
    steps:
      - name: Convergence-freeze guard + enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! files=$(gh pr view "$PR" -R "$REPO" --json files -q '.files[].path'); then
            echo "::warning::cannot read changed files for #$PR -> skip auto-merge (fail-closed)"; exit 0
          fi
          echo "changed files:"; echo "$files"
          # CI-SURFACE GUARD (added 2026-09-01, alongside RELANDER_TOKEN).
          # A write-scoped PAT now exists in this PUBLIC repo, and ~90% of PRs
          # here are machine-authored and self-landing. A builder PR that edits
          # .github/ could therefore alter the very gates that approve it, or
          # exfiltrate a secret, with no human in the loop. The PAT is
          # fine-grained with Workflows:NO ACCESS so a push of workflow files
          # under that identity is rejected by GitHub -- this guard is the
          # second, independent layer: such PRs never reach auto-merge at all.
          if echo "$files" | grep -Eq '^\.github/'; then
            echo "::notice::#$PR touches .github/ (CI surface) -> NOT auto-merging; human review required"
            gh pr edit "$PR" -R "$REPO" --add-label ci-hold || true
            gh pr merge "$PR" -R "$REPO" --disable-auto || true
            exit 0
          fi
          if echo "$files" | grep -Eiq 'trust_synthesiser|risk_ranker|enrichment|signal_analyser|mcp_llm_'; then
            echo "::notice::#$PR touches FROZEN scoring/enrichment paths -> NOT auto-merging (convergence freeze)"
            gh pr edit "$PR" -R "$REPO" --add-label freeze-hold || true
            gh pr merge "$PR" -R "$REPO" --disable-auto || true
            exit 0
          fi
          echo "::notice::enabling squash auto-merge for #$PR"
          gh pr merge "$PR" -R "$REPO" --auto --squash

  opt-in-land:
    # Operator-directed landing for HAND-authored PRs (LOCO_CHAIRMAN.md §13):
    # the label 'land-when-green' is the explicit "this PR is wanted; merge it
    # the moment gates pass" signal, so reviewed/solid hand PRs stop sitting
    # open on nothing but the absence of a click. Required checks still gate
    # the actual merge via branch protection; the same convergence-freeze
    # guard applies as for autonomous builds.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'land-when-green') && github.event.pull_request.draft == false
    steps:
      - name: Convergence-freeze guard + enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! files=$(gh pr view "$PR" -R "$REPO" --json files -q '.files[].path'); then
            echo "::warning::cannot read changed files for #$PR -> skip auto-merge (fail-closed)"; exit 0
          fi
          # CI-SURFACE GUARD (added 2026-09-01, alongside RELANDER_TOKEN).
          # A write-scoped PAT now exists in this PUBLIC repo, and ~90% of PRs
          # here are machine-authored and self-landing. A builder PR that edits
          # .github/ could therefore alter the very gates that approve it, or
          # exfiltrate a secret, with no human in the loop. The PAT is
          # fine-grained with Workflows:NO ACCESS so a push of workflow files
          # under that identity is rejected by GitHub -- this guard is the
          # second, independent layer: such PRs never reach auto-merge at all.
          if echo "$files" | grep -Eq '^\.github/'; then
            echo "::notice::#$PR touches .github/ (CI surface) -> NOT auto-merging; human review required"
            gh pr edit "$PR" -R "$REPO" --add-label ci-hold || true
            gh pr merge "$PR" -R "$REPO" --disable-auto || true
            exit 0
          fi
          if echo "$files" | grep -Eiq 'trust_synthesiser|risk_ranker|enrichment|signal_analyser|mcp_llm_'; then
            echo "::notice::#$PR touches FROZEN scoring/enrichment paths -> NOT auto-merging (convergence freeze)"
            gh pr edit "$PR" -R "$REPO" --add-label freeze-hold || true
            gh pr merge "$PR" -R "$REPO" --disable-auto || true
            exit 0
          fi
          echo "::notice::#$PR labelled land-when-green -> enabling squash auto-merge"
          gh pr merge "$PR" -R "$REPO" --auto --squash

  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}
      - name: Auto-merge patch + minor (major held)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "::notice::Dependabot ${{ steps.meta.outputs.update-type }} for #$PR -> squash auto-merge"
          gh pr merge "$PR" -R "$REPO" --auto --squash
      - name: Hold majors for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "::notice::Dependabot MAJOR update for #$PR -> held for manual review"
          gh pr edit "$PR" -R "$REPO" --add-label major-hold || true

  triage-solid-sweep:
    # Enables auto-merge on the triage bot's solids (pr-triage labels with
    # GITHUB_TOKEN, which can't re-trigger the pull_request_target job above).
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge on triage:solid autonomous-build PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # ALREADY-ARMED PRs ARE SKIPPED AT THE LIST (added 2026-09-04).
          # `gh pr merge --auto` on an already-armed PR is a no-op, but the
          # `gh pr view --json files` above it costs an API call every run.
          # Measured 2026-09-04: 14 of 30 matching PRs were already armed.
          # This job is UNCAPPED (green-sweep caps at 60; this one does not),
          # so the waste scales with queue depth -- and the queue grew 276->321
          # in two days. A cost that scales with a growing population fails
          # worse every day. Filtering changes no outcome: an armed PR needs no
          # re-arming, and the ci-hold/freeze-hold guards still run on every
          # push via the pull_request_target `autonomous-build` job.
          prs=$( { gh pr list -R "$REPO" --state open --label autonomous-build --label triage:solid --json number,autoMergeRequest -q '.[] | select(.autoMergeRequest == null) | .number';
                   gh pr list -R "$REPO" --state open --label land-when-green --json number,isDraft,autoMergeRequest -q '.[] | select(.isDraft == false) | select(.autoMergeRequest == null) | .number'; } | sort -u ) || prs=""
          for pr in $prs; do
            files=$(gh pr view "$pr" -R "$REPO" --json files -q '.files[].path') || continue
            # CI-SURFACE GUARD (added 2026-09-01, alongside RELANDER_TOKEN).
          # A write-scoped PAT now exists in this PUBLIC repo, and ~90% of PRs
          # here are machine-authored and self-landing. A builder PR that edits
          # .github/ could therefore alter the very gates that approve it, or
          # exfiltrate a secret, with no human in the loop. The PAT is
          # fine-grained with Workflows:NO ACCESS so a push of workflow files
          # under that identity is rejected by GitHub -- this guard is the
          # second, independent layer: such PRs never reach auto-merge at all.
            if echo "$files" | grep -Eq '^\.github/'; then
              echo "::notice::#$pr touches .github/ (CI surface) -> ci-hold, no auto-merge"
              gh pr edit "$pr" -R "$REPO" --add-label ci-hold || true
              gh pr merge "$pr" -R "$REPO" --disable-auto || true
              continue
            fi
          if echo "$files" | grep -Eiq 'trust_synthesiser|risk_ranker|enrichment|signal_analyser|mcp_llm_'; then
              echo "::notice::#$pr frozen scoring/enrichment path -> freeze-hold"
              gh pr edit "$pr" -R "$REPO" --add-label freeze-hold || true
              gh pr merge "$pr" -R "$REPO" --disable-auto || true
              continue
            fi
            echo "::notice::#$pr triage:solid -> enabling squash auto-merge"
            gh pr merge "$pr" -R "$REPO" --squash --auto || true
          done

  green-sweep:
    # LABEL-INDEPENDENT LANDING (added 2026-09-01).
    #
    # pr-triage evaluates a PR the moment it is opened/reopened/synchronised --
    # which is BEFORE its gates finish. A PR refreshed by pr-relander therefore
    # gets labelled triage:stale against incomplete checks, then goes green, and
    # nothing ever re-triages it. Observed on #1684: mergeStateStatus=UNSTABLE
    # (all 8 required contexts passing) but labelled triage:stale, so the
    # triage:solid sweep skipped it and it sat unmergeable on a stale label.
    #
    # The triage label is a cache of a CI outcome. Branch protection is the
    # actual authority. This job therefore ignores the label entirely and asks
    # GitHub directly whether the required checks are satisfied.
    #
    # NOTE: mergeStateStatus is computed LAZILY -- it returns UNKNOWN for every
    # row of a list query and only materialises on a single-PR read. It must be
    # fetched per PR, never filtered in the list.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enable auto-merge on any green autonomous-build PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SWEEP_CAP: "60"
        run: |
          set -uo pipefail
          # Already-armed PRs skipped at the list (added 2026-09-04): each one
          # otherwise costs TWO calls below (mergeStateStatus, then files) to
          # re-arm something already armed. ~80 of the open PRs are armed.
          if ! prs=$(gh pr list -R "$REPO" --state open --label autonomous-build \
                       --limit 500 --json number,isDraft,autoMergeRequest \
                       -q '.[] | select(.isDraft == false) | select(.autoMergeRequest == null) | .number' 2>qerr.txt); then
            echo "::error::green-sweep query FAILED: $(tr -d '\n' < qerr.txt | head -c 300)"
            exit 1
          fi
          examined=0; enabled=0; held=0
          for pr in $prs; do
            [ "$examined" -ge "$SWEEP_CAP" ] && break
            examined=$((examined+1))
            # CLEAN = all required green. UNSTABLE = all REQUIRED green, some
            # non-required check red (e.g. CodeQL); branch protection permits
            # that merge, so we do too.
            ms=$(gh pr view "$pr" -R "$REPO" --json mergeStateStatus -q .mergeStateStatus) || continue
            case "$ms" in CLEAN|UNSTABLE) ;; *) continue ;; esac

            files=$(gh pr view "$pr" -R "$REPO" --json files -q '.files[].path') || continue
            if echo "$files" | grep -Eq '^\.github/'; then
              echo "::notice::#$pr green but touches .github/ -> ci-hold"
              gh pr edit "$pr" -R "$REPO" --add-label ci-hold || true
              held=$((held+1)); continue
            fi
            if echo "$files" | grep -Eiq 'trust_synthesiser|risk_ranker|enrichment|signal_analyser|mcp_llm_'; then
              echo "::notice::#$pr green but touches frozen scoring paths -> freeze-hold"
              gh pr edit "$pr" -R "$REPO" --add-label freeze-hold || true
              held=$((held+1)); continue
            fi
            echo "::notice::#$pr $ms with required checks satisfied -> enabling auto-merge (label ignored)"
            gh pr merge "$pr" -R "$REPO" --squash --auto && enabled=$((enabled+1)) || true
          done
          {
            echo "### auto-merge green-sweep"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| examined | $examined |"
            echo "| auto-merge enabled | $enabled |"
            echo "| held (ci/freeze) | $held |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::green-sweep: examined $examined, enabled $enabled, held $held"

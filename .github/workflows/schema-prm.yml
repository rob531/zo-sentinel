name: schema-prm
on:
  pull_request:
    branches: [main]
  # DISPATCHABLE ON PURPOSE. This gate is a REQUIRED status context, and
  # GITHUB_TOKEN pushes are recursion-guarded, so without a dispatch trigger the
  # only way to re-run it on an existing PR was a push under a human identity --
  # i.e. a human-held PAT. That dependency cost four weeks of deadlock and an
  # evening of secret-handling failures. workflow_dispatch is exempt from the
  # recursion guard, so pr-relander can now refresh this context with the stock
  # GITHUB_TOKEN and no credential is required from anyone.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-prm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject hallucinated schemas (GraphifyKL PRM)
        env:
          # github.base_ref is empty on workflow_dispatch. These gates always
          # diff against main, so default explicitly rather than emitting the
          # unusable ref "origin/".
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python tests/ci/schema_prm_check.py

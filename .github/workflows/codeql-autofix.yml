name: codeql-autofix

# Runs after a successful codeql-scan on main.
# For each open HIGH/CRITICAL alert, asks Claude Haiku to generate a fix,
# validates it with ruff, and opens a PR labelled codeql-fix + autonomous-build
# so it flows through the standard triage → auto-merge pipeline.

on:
  workflow_run:
    workflows: ["codeql-scan"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: read

jobs:
  autofix:
    name: Fix open CodeQL alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run when the scan itself passed; skip on PR scans (head_branch != main)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff (for fix validation)
        run: pip install --quiet ruff

      - name: Run CodeQL autofix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          CODEQL_AUTOFIX_MAX_FILES: '5'
          CODEQL_AUTOFIX_SEVERITIES: 'critical,high'
        run: python tools/codeql_autofix.py

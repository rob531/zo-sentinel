<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Policy Rules Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input[type="text"], select {
            width: 200px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>MCP Policy Rules Editor</h1>

    <form id="ruleForm">
        <input type="hidden" id="ruleId" name="ruleId">
        <div>
            <label for="ruleType">Rule Type:</label>
            <select id="ruleType" name="ruleType" required>
                <option value="">Select a rule type</option>
                <option value="allow">Allow</option>
                <option value="deny">Deny</option>
            </select>
        </div>
        <div>
            <label for="pattern">Pattern:</label>
            <input type="text" id="pattern" name="pattern" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <input type="text" id="description" name="description">
        </div>
        <button type="button" id="saveButton">Save</button>
        <button type="button" id="cancelButton">Cancel</button>
    </form>

    <table id="rulesTable">
        <thead>
            <tr>
                <th>Rule Type</th>
                <th>Pattern</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rules will be added here dynamically -->
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ruleForm = document.getElementById('ruleForm');
            const ruleIdInput = document.getElementById('ruleId');
            const ruleTypeSelect = document.getElementById('ruleType');
            const patternInput = document.getElementById('pattern');
            const descriptionInput = document.getElementById('description');
            const saveButton = document.getElementById('saveButton');
            const cancelButton = document.getElementById('cancelButton');
            const rulesTable = document.getElementById('rulesTable').getElementsByTagName('tbody')[0];

            let currentRuleId = null;

            // Load rules from the backend API
            function loadRules() {
                fetch('/api/mcp_policy_rules')
                    .then(response => response.json())
                    .then(data => {
                        rulesTable.innerHTML = '';
                        data.forEach(rule => {
                            addRuleToTable(rule);
                        });
                    })
                    .catch(error => console.error('Error loading rules:', error));
            }

            // Add a rule to the table
            function addRuleToTable(rule) {
                const row = rulesTable.insertRow();
                row.dataset.id = rule.id;

                const ruleTypeCell = row.insertCell(0);
                ruleTypeCell.textContent = rule.rule_type;

                const patternCell = row.insertCell(1);
                patternCell.textContent = rule.pattern;

                const descriptionCell = row.insertCell(2);
                descriptionCell.textContent = rule.description;

                const actionsCell = row.insertCell(3);
                const editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.addEventListener('click', () => editRule(rule.id));
                actionsCell.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => deleteRule(rule.id));
                actionsCell.appendChild(deleteButton);
            }

            // Edit a rule
            function editRule(id) {
                fetch(`/api/mcp_policy_rules/${id}`)
                    .then(response => response.json())
                    .then(rule => {
                        currentRuleId = rule.id;
                        ruleIdInput.value = rule.id;
                        ruleTypeSelect.value = rule.rule_type;
                        patternInput.value = rule.pattern;
                        descriptionInput.value = rule.description;
                    })
                    .catch(error => console.error('Error loading rule:', error));
            }

            // Delete a rule
            function deleteRule(id) {
                if (confirm('Are you sure you want to delete this rule?')) {
                    fetch(`/api/mcp_policy_rules/${id}`, {
                        method: 'DELETE'
                    })
                    .then(() => {
                        loadRules();
                    })
                    .catch(error => console.error('Error deleting rule:', error));
                }
            }

            // Save a rule (create or update)
            function saveRule() {
                const rule = {
                    rule_type: ruleTypeSelect.value,
                    pattern: patternInput.value,
                    description: descriptionInput.value
                };

                const method = currentRuleId ? 'PUT' : 'POST';
                const url = currentRuleId ? `/api/mcp_policy_rules/${currentRuleId}` : '/api/mcp_policy_rules';

                fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(rule)
                })
                .then(() => {
                    loadRules();
                    resetForm();
                })
                .catch(error => console.error('Error saving rule:', error));
            }

            // Reset the form
            function resetForm() {
                currentRuleId = null;
                ruleIdInput.value = '';
                ruleTypeSelect.value = '';
                patternInput.value = '';
                descriptionInput.value = '';
            }

            // Event listeners
            saveButton.addEventListener('click', saveRule);
            cancelButton.addEventListener('click', resetForm);

            // Load rules when the page loads
            loadRules();
        });
    </script>
</body>
</html>

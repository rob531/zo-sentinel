<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Policies Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .policy-list {
            margin-bottom: 20px;
        }
        .policy-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .policy-item:last-child {
            border-bottom: none;
        }
        .policy-details {
            flex: 1;
        }
        .policy-actions {
            display: flex;
            gap: 10px;
        }
        .policy-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
        }
        .btn-add {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .btn-edit {
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .btn-cancel {
            background-color: #e7e7e7;
            color: #333;
            border: none;
            border-radius: 4px;
        }
        .btn-save {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Policies Management</h1>

        <div class="policy-form" id="addPolicyForm">
            <h2>Add New Policy</h2>
            <form id="policyForm">
                <input type="hidden" id="policyId" value="">
                <div class="form-group">
                    <label for="ruleType">Rule Type</label>
                    <select id="ruleType" required>
                        <option value="">Select Rule Type</option>
                        <option value="allow">Allow</option>
                        <option value="deny">Deny</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pattern">Pattern</label>
                    <input type="text" id="pattern" required>
                </div>
                <div class="form-group">
                    <label for="action">Action</label>
                    <input type="text" id="action" required>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <input type="number" id="priority" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="cancelForm()">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>

        <div class="policy-list" id="policyList">
            <!-- Policies will be loaded here -->
        </div>
    </div>

    <script>
        // Mock data for testing
        const mockPolicies = [
            {
                id: 1,
                rule_type: "allow",
                pattern: "*.example.com",
                action: "allow",
                priority: 1,
                description: "Allow all subdomains of example.com"
            },
            {
                id: 2,
                rule_type: "deny",
                pattern: "*.malicious.com",
                action: "deny",
                priority: 2,
                description: "Deny all subdomains of malicious.com"
            }
        ];

        // Load policies on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPolicies();
        });

        // Load policies from the backend (mocked)
        function loadPolicies() {
            // In a real application, this would be a fetch call to the backend API
            // fetch('/api/admin/policies')
            //     .then(response => response.json())
            //     .then(data => displayPolicies(data))
            //     .catch(error => console.error('Error:', error));

            // Mock data for testing
            displayPolicies(mockPolicies);
        }

        // Display policies in the list
        function displayPolicies(policies) {
            const policyList = document.getElementById('policyList');
            policyList.innerHTML = '';

            policies.forEach(policy => {
                const policyItem = document.createElement('div');
                policyItem.className = 'policy-item';
                policyItem.innerHTML = `
                    <div class="policy-details">
                        <h3>${policy.pattern}</h3>
                        <p><strong>Rule Type:</strong> ${policy.rule_type}</p>
                        <p><strong>Action:</strong> ${policy.action}</p>
                        <p><strong>Priority:</strong> ${policy.priority}</p>
                        <p><strong>Description:</strong> ${policy.description}</p>
                    </div>
                    <div class="policy-actions">
                        <button class="btn-edit" onclick="editPolicy(${policy.id})">Edit</button>
                        <button class="btn-delete" onclick="deletePolicy(${policy.id})">Delete</button>
                    </div>
                `;
                policyList.appendChild(policyItem);
            });
        }

        // Handle form submission
        document.getElementById('policyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const policyId = document.getElementById('policyId').value;
            const ruleType = document.getElementById('ruleType').value;
            const pattern = document.getElementById('pattern').value;
            const action = document.getElementById('action').value;
            const priority = document.getElementById('priority').value;
            const description = document.getElementById('description').value;

            const policyData = {
                rule_type: ruleType,
                pattern: pattern,
                action: action,
                priority: priority,
                description: description
            };

            if (policyId) {
                // Update existing policy (mocked)
                updatePolicy(policyId, policyData);
            } else {
                // Add new policy (mocked)
                addPolicy(policyData);
            }

            // Reset form
            document.getElementById('policyForm').reset();
            document.getElementById('policyId').value = '';
        });

        // Add a new policy (mocked)
        function addPolicy(policyData) {
            // In a real application, this would be a fetch call to the backend API
            // fetch('/api/admin/policies', {
            //     method: 'POST',
            //     headers: {
            //         'Content-Type': 'application/json',
            //     },
            //     body: JSON.stringify(policyData),
            // })
            // .then(response => response.json())
            // .then(data => {
            //     loadPolicies();
            // })
            // .catch(error => console.error('Error:', error));

            // Mock data for testing
            const newPolicy = {
                id: mockPolicies.length + 1,
                ...policyData
            };
            mockPolicies.push(newPolicy);
            loadPolicies();
        }

        // Edit an existing policy
        function editPolicy(policyId) {
            // In a real application, this would be a fetch call to the backend API
            // fetch(`/api/admin/policies/${policyId}`)
            //     .then(response => response.json())
            //     .then(data => {
            //         document.getElementById('policyId').value = data.id;
            //         document.getElementById('ruleType').value = data.rule_type;
            //         document.getElementById('pattern').value = data.pattern;
            //         document.getElementById('action').value = data.action;
            //         document.getElementById('priority').value = data.priority;
            //         document.getElementById('description').value = data.description;
            //     })
            //     .catch(error => console.error('Error:', error));

            // Mock data for testing
            const policy = mockPolicies.find(p => p.id === policyId);
            if (policy) {
                document.getElementById('policyId').value = policy.id;
                document.getElementById('ruleType').value = policy.rule_type;
                document.getElementById('pattern').value = policy.pattern;
                document.getElementById('action').value = policy.action;
                document.getElementById('priority').value = policy.priority;
                document.getElementById('description').value = policy.description;
            }
        }

        // Update an existing policy (mocked)
        function updatePolicy(policyId, policyData) {
            // In a real application, this would be a fetch call to the backend API
            // fetch(`/api/admin/policies/${policyId}`, {
            //     method: 'PUT',
            //     headers: {
            //         'Content-Type': 'application/json',
            //     },
            //     body: JSON.stringify(policyData),
            // })
            // .then(response => response.json())
            // .then(data => {
            //     loadPolicies();
            // })
            // .catch(error => console.error('Error:', error));

            // Mock data for testing
            const index = mockPolicies.findIndex(p => p.id === policyId);
            if (index !== -1) {
                mockPolicies[index] = {
                    id: policyId,
                    ...policyData
                };
                loadPolicies();
            }
        }

        // Delete a policy (mocked)
        function deletePolicy(policyId) {
            if (confirm('Are you sure you want to delete this policy?')) {
                // In a real application, this would be a fetch call to the backend API
                // fetch(`/api/admin/policies/${policyId}`, {
                //     method: 'DELETE',
                // })
                // .then(response => response.json())
                // .then(data => {
                //     loadPolicies();
                // })
                // .catch(error => console.error('Error:', error));

                // Mock data for testing
                const index = mockPolicies.findIndex(p => p.id === policyId);
                if (index !== -1) {
                    mockPolicies.splice(index, 1);
                    loadPolicies();
                }
            }
        }

        // Cancel form and reset
        function cancelForm() {
            document.getElementById('policyForm').reset();
            document.getElementById('policyId').value = '';
        }
    </script>
</body>
</html>

[service]
name = "risk_tier_deriver"
import_path = "services.active.risk_tier_deriver.router"
prefix = "/api"
tag = "risk_tier_deriver"
origin = "service"
auth = "public"
needs_data_layer = true

[router]
class_name = "router"

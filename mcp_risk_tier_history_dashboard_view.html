<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Risk Tier History Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .dashboard-container {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .filters {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .filter-item {
            margin-right: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        th:hover {
            background-color: #e6e6e6;
        }
        .graph-container {
            margin-top: 20px;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
        }
        .loading {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>MCP Risk Tier History Dashboard</h1>
    <div class="dashboard-container">
        <div class="filters">
            <label for="mcp-select">Select MCP:</label>
            <select id="mcp-select" class="filter-item">
                <option value="all">All MCPs</option>
                <!-- Options will be populated dynamically -->
            </select>

            <label for="date-range">Date Range:</label>
            <input type="date" id="start-date" class="filter-item">
            <span>to</span>
            <input type="date" id="end-date" class="filter-item">

            <button id="apply-filters" class="filter-item">Apply Filters</button>
        </div>

        <div class="loading" id="loading">Loading data...</div>

        <div id="graph-container" class="graph-container">
            <!-- Graph will be rendered here -->
        </div>

        <table id="risk-tier-table">
            <thead>
                <tr>
                    <th id="mcp-id-header">MCP ID</th>
                    <th id="risk-tier-header">Risk Tier</th>
                    <th id="computed-at-header">Computed At</th>
                    <th id="change-reason-header">Change Reason</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Table rows will be populated dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        // Mock data for self-test
        const mockData = [
            { mcp_id: 'MCP001', risk_tier: 'High', computed_at: '2023-01-01T10:00:00', change_reason: 'Increased activity' },
            { mcp_id: 'MCP001', risk_tier: 'Medium', computed_at: '2023-01-02T11:00:00', change_reason: 'Activity normalized' },
            { mcp_id: 'MCP002', risk_tier: 'Low', computed_at: '2023-01-01T12:00:00', change_reason: 'Initial assessment' },
            { mcp_id: 'MCP002', risk_tier: 'Medium', computed_at: '2023-01-03T13:00:00', change_reason: 'Suspicious pattern detected' },
            { mcp_id: 'MCP003', risk_tier: 'High', computed_at: '2023-01-01T14:00:00', change_reason: 'Known threat match' },
        ];

        // Function to fetch data (mock implementation)
        async function fetchData() {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve(mockData);
                }, 1000);
            });
        }

        // Function to render the table
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.mcp_id}</td>
                    <td>${item.risk_tier}</td>
                    <td>${new Date(item.computed_at).toLocaleString()}</td>
                    <td>${item.change_reason}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Function to render the graph (placeholder)
        function renderGraph(data) {
            const graphContainer = document.getElementById('graph-container');
            graphContainer.innerHTML = `<h3>Risk Tier Evolution Graph</h3><p>Graph would be rendered here using a library like Chart.js</p>`;
        }

        // Function to populate MCP select dropdown
        function populateMcpSelect(data) {
            const mcpSelect = document.getElementById('mcp-select');
            const uniqueMcps = [...new Set(data.map(item => item.mcp_id))];

            uniqueMcps.forEach(mcp => {
                const option = document.createElement('option');
                option.value = mcp;
                option.textContent = mcp;
                mcpSelect.appendChild(option);
            });
        }

        // Function to handle sorting
        function handleSort(column) {
            // Sorting logic would be implemented here
            console.log(`Sorting by ${column}`);
        }

        // Function to handle filtering
        function handleFilter() {
            // Filtering logic would be implemented here
            console.log('Applying filters');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', async () => {
            const loadingElement = document.getElementById('loading');
            loadingElement.style.display = 'block';

            try {
                const data = await fetchData();
                renderTable(data);
                renderGraph(data);
                populateMcpSelect(data);

                // Add sort event listeners
                document.getElementById('mcp-id-header').addEventListener('click', () => handleSort('mcp_id'));
                document.getElementById('risk-tier-header').addEventListener('click', () => handleSort('risk_tier'));
                document.getElementById('computed-at-header').addEventListener('click', () => handleSort('computed_at'));
                document.getElementById('change-reason-header').addEventListener('click', () => handleSort('change_reason'));

                // Add filter event listener
                document.getElementById('apply-filters').addEventListener('click', handleFilter);

                loadingElement.style.display = 'none';
            } catch (error) {
                console.error('Error loading data:', error);
                loadingElement.textContent = 'Error loading data. Please try again later.';
            }
        });

        // Self-test
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = {
                test: () => {
                    const testData = [
                        { mcp_id: 'TEST001', risk_tier: 'High', computed_at: '2023-01-01T10:00:00', change_reason: 'Test reason' }
                    ];

                    // Test table headers
                    const headers = ['MCP ID', 'Risk Tier', 'Computed At', 'Change Reason'];
                    const tableHeaders = Array.from(document.querySelectorAll('#risk-tier-table th')).map(th => th.textContent.trim());
                    console.assert(
                        headers.every(header => tableHeaders.includes(header)),
                        'Table headers are not as expected'
                    );

                    // Test graph container
                    const graphContainer = document.getElementById('graph-container');
                    console.assert(
                        graphContainer && graphContainer.classList.contains('graph-container'),
                        'Graph container is not present or has incorrect class'
                    );

                    // Test data rendering
                    renderTable(testData);
                    const tableRows = document.querySelectorAll('#table-body tr');
                    console.assert(
                        tableRows.length === 1 && tableRows[0].cells[0].textContent === 'TEST001',
                        'Test data is not rendered correctly'
                    );

                    console.log('Self-test completed. All assertions passed.');
                }
            };
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Axis Scores Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Server Axis Scores Summary</h1>
    <table>
        <thead>
            <tr>
                <th>Axis Name</th>
                <th>Label</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            {% for axis in axes %}
            <tr>
                <td>{{ axis.axis_name }}</td>
                <td>{{ axis.label }}</td>
                <td>{{ axis.score }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

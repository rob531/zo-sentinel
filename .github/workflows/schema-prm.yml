name: schema-prm

concurrency:
  # cancel superseded runs on the same PR branch so the cheap-build PR
  # velocity cannot pile up concurrent runners and flake required checks.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  # DISPATCHABLE ON PURPOSE. This gate is a REQUIRED status context, and
  # GITHUB_TOKEN pushes are recursion-guarded, so without a dispatch trigger the
  # only way to re-run it on an existing PR was a push under a human identity --
  # i.e. a human-held PAT. That dependency cost four weeks of deadlock and an
  # evening of secret-handling failures. workflow_dispatch is exempt from the
  # recursion guard, so pr-relander can now refresh this context with the stock
  # GITHUB_TOKEN and no credential is required from anyone.
  workflow_dispatch:
permissions:
  contents: read
# CI-pileup guard (added 2026-10-05). Collapse redundant runs of THIS workflow
# on the SAME ref so a burst (e.g. the autonomous builder landing several
# scaffold PRs in one hour) cannot pin every GitHub-hosted runner at once and
# starve other PRs' required checks into cancelled/no-runner failures. Keyed by
# ref, so it NEVER cancels a different PR's run -- only a superseded run of the
# same branch/PR. No gate is weakened: the newest run on each ref still must
# pass. Safe re the 2026-09 sweep storm -- auto-merge sweeps now gate on
# workflow_run.conclusion=='success', so a concurrency-cancelled run no longer
# triggers a sweep.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schema-prm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject hallucinated schemas (GraphifyKL PRM)
        env:
          # github.base_ref is empty on workflow_dispatch. These gates always
          # diff against main, so default explicitly rather than emitting the
          # unusable ref "origin/".
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python tests/ci/schema_prm_check.py

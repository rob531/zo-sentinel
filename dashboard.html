<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZO-SENTINEL Build Watch</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#1a1228;font-family:'Courier New',monospace;overflow:hidden}
#ambient{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 40% 30% at 30% 44%,rgba(20,100,255,.5) 0%,transparent 100%),
  radial-gradient(ellipse 40% 30% at 70% 44%,rgba(180,20,255,.5) 0%,transparent 100%),
  radial-gradient(ellipse 80% 60% at 50% 50%,#2a0e48 0%,#1a1228 100%)}
/* Base stream -- hidden, used as data source */
#stream-base{display:none}
/* Two eye-hole windows -- above SVG, clipped to goggle lens shapes */
.eye-window{
  position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;
  display:flex;align-items:center;
}
#eye-left{ clip-path:ellipse(14.6% 9.2% at 30% 44%); }
#eye-right{ clip-path:ellipse(14.6% 9.2% at 70% 44%); }
.eye-track{
  display:flex;align-items:center;gap:14px;padding:0 20px;
  width:max-content;animation:marquee 52s linear infinite;
  will-change:transform;
}
.eye-idle .eye-track{animation-duration:120s;opacity:.8;filter:saturate(0.25)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pill{
  display:flex;align-items:center;gap:7px;padding:5px 10px;
  border:1.5px solid currentColor;border-radius:3px;
  background:rgba(8,4,18,.92);flex-shrink:0;
  font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
  filter:drop-shadow(0 0 6px currentColor);
}
.pill-icon{font-size:12px;width:14px;text-align:center}
.pill-name{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.pill-tag{font-size:7px;padding:2px 5px;border-radius:2px;font-weight:800;letter-spacing:.12em;background:currentColor;color:#06030f;opacity:.85}
.c-py{color:#22d3ee}.c-html{color:#f472b6}.c-sh{color:#4ade80}.c-conf{color:#fb923c}.c-md{color:#c084fc}.c-json{color:#facc15}.c-other{color:#94a3b8}
/* SVG mask layer */
#mask-svg{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none;overflow:visible}
@keyframes cog-spin{to{transform:rotate(360deg)}}@keyframes cog-rev{to{transform:rotate(-360deg)}}
@keyframes steam-rise{0%{opacity:0;transform:translateY(0) scaleX(1)}12%{opacity:.55}88%{opacity:.3}100%{opacity:0;transform:translateY(-7vh) scaleX(2.2)}}
@keyframes steam-rise2{0%{opacity:0;transform:translateY(0) scaleX(1)}12%{opacity:.45}88%{opacity:.25}100%{opacity:0;transform:translateY(-6vh) scaleX(1.8)}}
@keyframes needle-wobble{0%,100%{transform:rotate(-25deg)}30%{transform:rotate(40deg)}60%{transform:rotate(-10deg)}85%{transform:rotate(22deg)}}
@keyframes needle-wobble2{0%,100%{transform:rotate(10deg)}40%{transform:rotate(-30deg)}70%{transform:rotate(35deg)}}
@keyframes piston-pump{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes dot-blink{0%,100%{opacity:1}50%{opacity:.1}}
#cog-main{transform-origin:50% 15%;animation:cog-spin 8s linear infinite}
#cog-small{transform-origin:61% 18%;animation:cog-rev 3.2s linear infinite}
#steam-l-1{animation:steam-rise 3.8s ease-in-out infinite}#steam-l-2{animation:steam-rise2 5.2s ease-in-out infinite 1.4s}#steam-l-3{animation:steam-rise 4.5s ease-in-out infinite .8s}
#steam-r-1{animation:steam-rise 4.1s ease-in-out infinite .6s}#steam-r-2{animation:steam-rise2 3.6s ease-in-out infinite 2.1s}
#needle-l{animation:needle-wobble 4.3s ease-in-out infinite}#needle-r{animation:needle-wobble2 5.7s ease-in-out infinite 1.2s}
#piston{animation:piston-pump 1.2s ease-in-out infinite}
#chrome{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px}
.status-row{display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:.25em;color:rgba(180,150,90,.45);text-transform:uppercase}
#sd{width:4px;height:4px;border-radius:50%;background:#c8943a}#sd.active{animation:dot-blink 2s ease-in-out infinite}
#ticker{font-size:8px;letter-spacing:.08em;color:rgba(180,140,70,.3);margin-top:2px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<div id="chrome">
  <div class="status-row"><div id="sd" class="active"></div><span id="sl">OBSERVATIONAL PROCESSES NOMINAL</span></div>
  <div id="ticker"></div>
</div>

<script>
var FEED_API='/api/build-stream',POLL_MS=30000;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var T={'.py':'c-py','.html':'c-html','.sh':'c-sh','.conf':'c-conf','.md':'c-md','.json':'c-json'};
var IC={'.py':'\u2b21','.html':'\u25c8','.sh':'\u229e','.conf':'\u229b','.md':'\u25c9','.json':'\u25ce'};
function ext(n){var i=n.lastIndexOf('.');return i>0?n.slice(i).toLowerCase():''}
function pill(f){
  var e=ext(f.name),c=T[e]||'c-other',ic=IC[e]||'\u25b7';
  var nm=f.name.length>22?f.name.slice(0,20)+'..':f.name;
  var ag=f.age_display?'<span class="pill-tag">'+esc(f.age_display)+'</span>':'';
  return '<div class="pill '+c+'"><span class="pill-icon">'+ic+'</span><span class="pill-name">'+esc(nm)+'</span>'+ag+'</div>';
}
var DEMO=['signal_analyser.py','trust_synthesiser.py','mcp_scanner.py','registry_api.py','forensic_detail_api.py','email_guid_auth.py','manifest_blast_radius.py','prompt_injection_scanner.py','sybil_burst_detector.py','npm_typo_squatter.py','mcp_detail_view.html','supervisord_sentinel.conf','sentinel_cli.py','sentinel_sdk.py','metrics_exporter.py','status.sh','compliance_export_service.py','audit_trail.py','certificate_analyser.py','threat_feed_aggregator.py'].map(function(n){return{name:n,age_display:''}});

var tL=document.getElementById('track-left');
var tR=document.getElementById('track-right');
var eL=document.getElementById('eye-left');
var eR=document.getElementById('eye-right');

function renderEyes(files,idle){
  var html='';
  files.forEach(function(f){html+=pill(f);});
  files.forEach(function(f){html+=pill(f);});
  tL.innerHTML=html;
  tR.innerHTML=html;
  if(idle){eL.classList.add('eye-idle');eR.classList.add('eye-idle');}
  else{eL.classList.remove('eye-idle');eR.classList.remove('eye-idle');}
}

renderEyes(DEMO,true);

function poll(){
  fetch(FEED_API).then(function(r){return r.json();}).then(function(d){
    if(d&&d.status==='active'&&d.files&&d.files.length){
      var clean=d.files.filter(function(f){return f&&f.name&&/^[\w\-.]+$/.test(f.name);});
      if(clean.length){
        renderEyes(clean,false);
        document.getElementById('sd').className='active';
        document.getElementById('sl').textContent='OBSERVATIONAL PROCESSES NOMINAL';
        document.getElementById('ticker').textContent=clean[clean.length-1].name;
        return;
      }
    }
    renderEyes(DEMO,true);
    document.getElementById('sd').className='';
    document.getElementById('sl').textContent='OBSERVATIONAL PROCESSES SUSPENDED';
  }).catch(function(){});
}
setTimeout(poll,3000);
setInterval(poll,POLL_MS);
</script>

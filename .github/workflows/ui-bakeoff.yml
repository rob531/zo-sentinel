name: ui-bakeoff
on:
  workflow_dispatch:
    inputs:
      rungs:
        description: "comma-separated rungs"
        default: "cerebras,groq,mistral,nvidia,gemini,anthropic"
      directive:
        description: "path to directive file"
        default: "tools/bakeoff/directive.example.txt"
jobs:
  bakeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Install Playwright + chromium (with system deps)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run bake-off
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY:   ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY:  ${{ secrets.MINIMAX_API_KEY }}
        run: |
          cd tools/bakeoff
          python3 run_bakeoff.py --directive "../../${{ inputs.directive }}" --rungs "${{ inputs.rungs }}"
      - uses: actions/upload-artifact@v7
        with: { name: bakeoff-results, path: "tools/bakeoff/bakeoff_*" }

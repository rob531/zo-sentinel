<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZO·SENTINEL — Build Watch</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --kraft:#c49240;--kraft-dark:#8a6018;--kraft-shadow:#5a3c08;
  --gold:#f0c040;--gold-glow:rgba(240,192,64,.6);
  --bg:#0d0814;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Courier New',monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 100% 100% at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%);pointer-events:none;z-index:900}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.06) 2px 3px);pointer-events:none;z-index:950}
#ambient{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 38% 28% at 30% 44%,rgba(20,80,255,.35) 0%,transparent 100%),radial-gradient(ellipse 38% 28% at 70% 44%,rgba(160,20,255,.35) 0%,transparent 100%),radial-gradient(ellipse 70% 55% at 50% 44%,#1e0c38 0%,var(--bg) 100%)}
@keyframes drift{0%{transform:translateY(0) translateX(0);opacity:.0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(-80px) translateX(30px);opacity:.0}}
.mote{position:fixed;border-radius:50%;pointer-events:none;z-index:1;animation:drift linear infinite}
#stream-wrap{position:fixed;top:34.5%;left:0;right:0;height:19%;z-index:2;display:flex;align-items:center;overflow:hidden}
#stream-track{display:flex;align-items:center;gap:18px;padding:0 50px;width:max-content;animation:marquee 55s linear infinite;will-change:transform}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stream-idle{animation-play-state:paused;opacity:.15;filter:saturate(0.1) blur(1px)}
.pill{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 10px;border:1.5px solid currentColor;border-radius:4px;background:rgba(10,6,20,.9);flex-shrink:0;font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap;filter:drop-shadow(0 0 6px currentColor)}
.pill-icon{font-size:13px;width:16px;text-align:center;opacity:.95}
.pill-name{max-width:165px;overflow:hidden;text-overflow:ellipsis}
.pill-tag{font-size:7.5px;padding:2px 5px;border-radius:2px;font-weight:800;letter-spacing:.15em;background:currentColor;color:#08050f;opacity:.8}
.c-py{color:#22d3ee}.c-html{color:#f472b6}.c-sh{color:#4ade80}.c-conf{color:#fb923c}.c-md{color:#c084fc}.c-json{color:#facc15}.c-other{color:#64748b}
#mask-svg{position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
@keyframes mask-glow{0%,100%{filter:drop-shadow(0 0 6px rgba(190,130,30,.4)) drop-shadow(0 8px 20px rgba(0,0,0,.8))}50%{filter:drop-shadow(0 0 14px rgba(240,180,40,.65)) drop-shadow(0 8px 24px rgba(0,0,0,.9))}}
@keyframes eye-blink{0%,86%,100%{opacity:.7}93%{opacity:.05}}
#mask-body{animation:mask-glow 6s ease-in-out infinite}
#eye-left{animation:eye-blink 16s ease-in-out infinite}
#eye-right{animation:eye-blink 16s ease-in-out infinite 8s}
#chrome{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 24px 12px}
.wordmark{font-size:9px;letter-spacing:.55em;color:var(--gold);opacity:.5;text-transform:uppercase;text-shadow:0 0 12px var(--gold-glow)}
.status-row{display:flex;align-items:center;gap:10px;font-size:8.5px;letter-spacing:.25em;color:rgba(220,190,120,.4);text-transform:uppercase}
#sd{width:5px;height:5px;border-radius:50%;background:var(--gold)}
@keyframes dp{0%,100%{opacity:1;box-shadow:0 0 6px var(--gold-glow)}50%{opacity:.1}}
#sd.active{animation:dp 1.8s ease-in-out infinite}
#sd.idle{background:#4a5568;animation:none}
#ticker{font-size:8.5px;letter-spacing:.1em;color:rgba(240,180,40,.3);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
</style>
<script>window.ZO_FEED_API = 'https://zo-build-feed-robinc.zocomputer.io/api/build-stream';</script>
</head>
<body>
<div id="ambient"></div>
<div id="stream-wrap"><div id="stream-track"></div></div>
<svg id="mask-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <mask id="em">
      <rect width="100" height="100" fill="white"/>
      <ellipse cx="30" cy="44" rx="15.2" ry="9.6" fill="black"/>
      <ellipse cx="70" cy="44" rx="15.2" ry="9.6" fill="black"/>
    </mask>
    <pattern id="fiber" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#c49240"/>
      <line x1="0" y1="0" x2="3" y2="3" stroke="#a07a28" stroke-width=".3" opacity=".45"/>
      <line x1="3" y1="0" x2="0" y2="3" stroke="#d4aa58" stroke-width=".2" opacity=".25"/>
      <line x1="0" y1="1.5" x2="3" y2="1.5" stroke="#8a6415" stroke-width=".15" opacity=".2"/>
    </pattern>
    <pattern id="corr" x="0" y="0" width="1" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="none"/>
      <line x1="0" y1="1" x2="1" y2="1" stroke="rgba(80,48,8,.35)" stroke-width=".4"/>
    </pattern>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.03" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mshadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="rgba(0,0,0,.85)"/>
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="rgba(240,160,20,.3)"/>
    </filter>
    <filter id="gglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#0d0814" mask="url(#em)"/>
  <g filter="url(#mshadow)">
    <path id="mask-body"
      d="M5,44 C5,30 17,26 30,27 C39,27 45,31 47.5,36.5 L50,38 L52.5,36.5 C55,31 61,27 70,27 C83,26 95,30 95,44 C95,57 83,62 70,61 C62,63 55,58 52.5,54 L50,51 L47.5,54 C45,58 38,63 30,61 C17,62 5,57 5,44 Z"
      fill="url(#fiber)" mask="url(#em)" filter="url(#rough)"/>
    <path d="M5,44 C5,30 17,26 30,27 C39,27 45,31 47.5,36.5 L50,38 L52.5,36.5 C55,31 61,27 70,27 C83,26 95,30 95,44 C95,57 83,62 70,61 C62,63 55,58 52.5,54 L50,51 L47.5,54 C45,58 38,63 30,61 C17,62 5,57 5,44 Z"
      fill="url(#corr)" opacity=".5" mask="url(#em)" filter="url(#rough)"/>
    <path d="M5,44 C5,30 17,26 30,27 C39,27 45,31 47.5,36.5 L50,38 L52.5,36.5 C55,31 61,27 70,27 C83,26 95,30 95,44 C95,57 83,62 70,61 C62,63 55,58 52.5,54 L50,51 L47.5,54 C45,58 38,63 30,61 C17,62 5,57 5,44 Z"
      fill="none" stroke="#5a3c08" stroke-width="1.8" mask="url(#em)" filter="url(#rough)"/>
    <path d="M5,44 C5,30 17,26 30,27 C39,27 45,31 47.5,36.5 L50,38 L52.5,36.5 C55,31 61,27 70,27 C83,26 95,30 95,44 C95,57 83,62 70,61 C62,63 55,58 52.5,54 L50,51 L47.5,54 C45,58 38,63 30,61 C17,62 5,57 5,44 Z"
      fill="none" stroke="#e0b848" stroke-width=".5" opacity=".7" mask="url(#em)" filter="url(#rough)"/>
  </g>
  <line x1="8" y1="44" x2="46" y2="44" stroke="#8a6018" stroke-width=".25" opacity=".6" mask="url(#em)"/>
  <line x1="54" y1="44" x2="92" y2="44" stroke="#8a6018" stroke-width=".25" opacity=".6" mask="url(#em)"/>
  <line x1="12" y1="30" x2="8" y2="57" stroke="#7a5412" stroke-width=".2" opacity=".5" mask="url(#em)"/>
  <line x1="88" y1="30" x2="92" y2="57" stroke="#7a5412" stroke-width=".2" opacity=".5" mask="url(#em)"/>
  <path d="M50,33 L51.2,36 L54,36 L51.8,37.8 L52.6,40.5 L50,38.8 L47.4,40.5 L48.2,37.8 L46,36 L48.8,36 Z" fill="none" stroke="#6a4810" stroke-width=".3" opacity=".6" mask="url(#em)"/>
  <text x="14" y="37" font-size="2" fill="#7a5818" opacity=".55" font-family="Courier New,monospace" transform="rotate(-3,14,37)" mask="url(#em)">01</text>
  <text x="83" y="37" font-size="2" fill="#7a5818" opacity=".55" font-family="Courier New,monospace" transform="rotate(3,83,37)" mask="url(#em)">02</text>
  <circle cx="5" cy="44" r="1.2" fill="#0d0814" stroke="#6a4810" stroke-width=".4"/>
  <circle cx="5" cy="44" r="0.6" fill="#000" opacity=".8"/>
  <circle cx="95" cy="44" r="1.2" fill="#0d0814" stroke="#6a4810" stroke-width=".4"/>
  <circle cx="95" cy="44" r="0.6" fill="#000" opacity=".8"/>
  <circle cx="5" cy="44" r="2" fill="none" stroke="#a07828" stroke-width=".3" opacity=".6"/>
  <circle cx="95" cy="44" r="2" fill="none" stroke="#a07828" stroke-width=".3" opacity=".6"/>
  <ellipse cx="30" cy="44" rx="16" ry="10.5" fill="rgba(240,160,20,.08)"/>
  <ellipse id="eye-left" cx="30" cy="44" rx="15.2" ry="9.6" fill="none" stroke="#f0c040" stroke-width=".5" filter="url(#gglow)" opacity=".85"/>
  <ellipse cx="30" cy="44" rx="14.5" ry="9" fill="none" stroke="rgba(90,50,5,.8)" stroke-width=".6"/>
  <ellipse cx="30" cy="44" rx="17" ry="11" fill="none" stroke="rgba(240,160,20,.25)" stroke-width="1.5"/>
  <ellipse cx="70" cy="44" rx="16" ry="10.5" fill="rgba(200,120,255,.08)"/>
  <ellipse id="eye-right" cx="70" cy="44" rx="15.2" ry="9.6" fill="none" stroke="#f0c040" stroke-width=".5" filter="url(#gglow)" opacity=".85"/>
  <ellipse cx="70" cy="44" rx="14.5" ry="9" fill="none" stroke="rgba(90,50,5,.8)" stroke-width=".6"/>
  <ellipse cx="70" cy="44" rx="17" ry="11" fill="none" stroke="rgba(240,160,20,.25)" stroke-width="1.5"/>
  <text x="30" y="57.5" text-anchor="middle" font-size="1.6" fill="#8a6018" opacity=".55" letter-spacing=".35" font-family="Courier New,monospace" mask="url(#em)">OBSERVE</text>
  <text x="70" y="57.5" text-anchor="middle" font-size="1.6" fill="#8a6018" opacity=".55" letter-spacing=".35" font-family="Courier New,monospace" mask="url(#em)">OBSERVE</text>
</svg>
<div id="chrome">
  <div class="wordmark">ZO·SENTINEL</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div class="status-row"><div id="sd" class="active"></div><span id="sl">BUILD FEED</span></div>
    <div id="ticker"></div>
  </div>
</div>
<script>
const T={'.py':{i:'⬡',c:'c-py',t:'PY'},'.html':{i:'◈',c:'c-html',t:'HTML'},'.sh':{i:'⊞',c:'c-sh',t:'SH'},'.conf':{i:'⊛',c:'c-conf',t:'CONF'},'.md':{i:'◉',c:'c-md',t:'MD'},'.json':{i:'◎',c:'c-json',t:'JSON'},'.txt':{i:'○',c:'c-other',t:'TXT'}};
const ext=n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i).toLowerCase():''};
const pill=f=>{const t=T[ext(f.name)]??{i:'▷',c:'c-other',t:ext(f.name).slice(1).toUpperCase()||'FILE'};const nm=f.name.length>26?f.name.slice(0,24)+'…':f.name;const ph=f.phase?`<span class="pill-tag">${f.phase}</span>`:'';return `<div class="pill ${t.c}"><span class="pill-icon">${t.i}</span><span class="pill-name">${nm}</span>${ph}</div>`};
const FILES=[{name:'signal_analyser.py',phase:'P3'},{name:'trust_synthesiser.py',phase:'P3'},{name:'mcp_scanner.py',phase:'P2'},{name:'registry_api.py',phase:'P6'},{name:'forensic_detail_api.py',phase:'P18'},{name:'email_guid_auth.py',phase:'P17'},{name:'advanced_filter_api.py',phase:'P17'},{name:'manifest_blast_radius.py',phase:'P16'},{name:'prompt_injection_scanner.py',phase:'P16'},{name:'sybil_burst_detector.py',phase:'P16'},{name:'npm_typo_squatter.py',phase:'P16'},{name:'mcp_detail_view.html',phase:'P19'},{name:'supervisord_sentinel.conf',phase:'P6'},{name:'sentinel_cli.py',phase:''},{name:'sentinel_sdk.py',phase:''},{name:'metrics_exporter.py',phase:''},{name:'status.sh',phase:'P10'},{name:'compliance_export_service.py',phase:'P17'},{name:'audit_trail.py',phase:''},{name:'shodan_exposure_correlator.py',phase:'P16'},{name:'certificate_analyser.py',phase:'P16'},{name:'threat_feed_aggregator.py',phase:'P16'},{name:'github_repo_velocity.py',phase:'P16'},{name:'vendor_concentration_monitor.py',phase:'P16'}];
const track=document.getElementById('stream-track');
track.innerHTML=[...FILES,...FILES].map(pill).join('');
document.getElementById('ticker').textContent='· '+FILES[Math.floor(Math.random()*FILES.length)].name;
for(let i=0;i<12;i++){const m=document.createElement('div');m.className='mote';const sz=Math.random()*2+1;Object.assign(m.style,{width:sz+'px',height:sz+'px',left:Math.random()*100+'vw',top:Math.random()*100+'vh',animationDuration:(12+Math.random()*18)+'s',animationDelay:(Math.random()*12)+'s',background:['rgba(100,200,255,.4)','rgba(200,100,255,.4)','rgba(255,200,80,.3)'][Math.floor(Math.random()*3)]});document.body.appendChild(m)}
async function poll(){try{const r=await fetch('/build/api/build-stream',{signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error();const d=await r.json();if(d.status==='idle'||!d.files?.length){track.classList.add('stream-idle');document.getElementById('sd').className='idle';document.getElementById('sl').textContent='BUILDER IDLE';document.getElementById('ticker').textContent=''}else{track.innerHTML=[...d.files,...d.files].map(pill).join('');track.classList.remove('stream-idle');document.getElementById('sd').className='active';document.getElementById('sl').textContent='BUILD FEED';document.getElementById('ticker').textContent='· '+(d.files.at(-1)?.name??'')}}catch{}}
poll();setInterval(poll,30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server Registry Source Distribution Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .dashboard {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 20px;
        }
        .table-container {
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>MCP Server Registry Source Distribution</h1>
        <div class="chart-container">
            <canvas id="registrySourceChart"></canvas>
        </div>
        <div class="table-container">
            <table id="registrySourceTable">
                <thead>
                    <tr>
                        <th>Registry Source</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Mock data for testing
        const mockData = {
            "registry_sources": [
                {"source": "AWS", "count": 15},
                {"source": "Azure", "count": 10},
                {"source": "GCP", "count": 8},
                {"source": "On-Prem", "count": 5},
                {"source": "Other", "count": 2}
            ]
        };

        // Function to fetch data from API
        async function fetchData() {
            try {
                const response = await fetch('/mcp_server_registry/source_distribution');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching data:', error);
                return mockData; // Fallback to mock data if API fails
            }
        }

        // Function to render chart
        function renderChart(data) {
            const ctx = document.getElementById('registrySourceChart').getContext('2d');
            const labels = data.registry_sources.map(item => item.source);
            const counts = data.registry_sources.map(item => item.count);

            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: [
                            '#FF6384',
                            '#36A2EB',
                            '#FFCE56',
                            '#4BC0C0',
                            '#9966FF'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = Math.round((value / total) * 100);
                                    return `${label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Function to render table
        function renderTable(data) {
            const tableBody = document.querySelector('#registrySourceTable tbody');
            tableBody.innerHTML = '';

            data.registry_sources.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.source}</td>
                    <td>${item.count}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Main function to initialize the dashboard
        async function initDashboard() {
            const data = await fetchData();
            renderChart(data);
            renderTable(data);
        }

        // Initialize the dashboard when the page loads
        document.addEventListener('DOMContentLoaded', initDashboard);

        // Include Chart.js library inline
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        script.onload = function() {
            initDashboard();
        };
        document.head.appendChild(script);
    </script>
</body>
</html>

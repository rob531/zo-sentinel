<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tier Distribution Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #chart-container {
            width: 100%;
            height: 500px;
        }
        #time-period-selector {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Risk Tier Distribution Dashboard</h1>
    <div id="time-period-selector">
        <label for="time-period">Time Period:</label>
        <select id="time-period">
            <option value="7">Last 7 Days</option>
            <option value="30">Last 30 Days</option>
            <option value="all">All Time</option>
        </select>
    </div>
    <div id="chart-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const timePeriodSelector = document.getElementById('time-period');
            const chartContainer = document.getElementById('chart-container');

            function fetchData(timePeriod) {
                let url = '/api/risk/distribution';
                if (timePeriod !== 'all') {
                    url += `?days=${timePeriod}`;
                }

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        updateChart(data);
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                    });
            }

            function updateChart(data) {
                const riskTiers = Object.keys(data);
                const counts = Object.values(data);

                const trace = {
                    x: riskTiers,
                    y: counts,
                    type: 'bar',
                    marker: {
                        color: ['#ff0000', '#ff9900', '#ffff00', '#00ff00']
                    }
                };

                const layout = {
                    title: 'Server Distribution by Risk Tier',
                    xaxis: {
                        title: 'Risk Tier'
                    },
                    yaxis: {
                        title: 'Number of Servers'
                    }
                };

                Plotly.newPlot(chartContainer, [trace], layout);
            }

            timePeriodSelector.addEventListener('change', function() {
                fetchData(this.value);
            });

            // Initial load
            fetchData('7');
        });
    </script>
</body>
</html>

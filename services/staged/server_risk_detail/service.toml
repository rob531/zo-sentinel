# service.toml for server_risk_detail
import sys
from contextlib import asynccontextmanager
from typing import Any, Optional

import requests
from fastapi import Depends, FastAPI, HTTPException, Query
from pydantic import BaseModel, Field
from sqlalchemy import create_engine, func, select
from sqlalchemy.orm import Session, sessionmaker
from sqlalchemy.sql import select

from app.db import get_session
from app.models import (
    McpScoreDispute,
    McpServerRegistry,
    McpLlmAxisScore,
    Orgs,
    Users,
)


class ServerRiskDetail(BaseModel):
    server_id: str
    server_name: str
    org_id: str
    category: str
    risk_level: str
    status: str
    axis_scores: list[dict[str, Any]]
    signal_scores: list[dict[str, Any]]
    mesh_memory: list[dict[str, Any]]
    disputes: list[dict[str, Any]]


@asynccontextmanager
async def lifespan(app: FastAPI):
    yield


router = FastAPI(lifespan=lifespan)
app = FastAPI(title="server_risk_detail", version="1.0.0")
app.include_router(router, prefix="/api", tags=["server_risk_detail"])


@router.get("/server_risk_detail", response_model=ServerRiskDetail)
async def get_server_risk_detail(
    server_id: str = Query(..., description="Server ID to fetch risk details for"),
    session: Session = Depends(get_session),
) -> ServerRiskDetail:
    result = session.execute(
        select(McpServerRegistry).where(McpServerRegistry.server_id == server_id)
    )
    server = result.scalar_one_or_none()
    if not server:
        raise HTTPException(status_code=404, detail=f"Server {server_id} not found")

    axis_scores = session.execute(
        select(McpLlmAxisScore).where(McpLlmAxisScore.server_id == server_id)
    ).scalars().all()

    disputes = session.execute(
        select(McpScoreDispute).where(McpScoreDispute.server_id == server_id)
    ).scalars().all()

    signal_scores = []
    mesh_memory = []
    try:
        resp = requests.post(
            "http://127.0.0.1:8772/query",
            json={"table": "mcp_signal_scores", "filters": {"server_id": server_id}},
            timeout=5,
        )
        if resp.status_code == 200:
            signal_scores = resp.json().get("data", [])
    except Exception:
        pass

    try:
        resp = requests.post(
            "http://127.0.0.1:8772/query",
            json={"table": "mesh_memory", "filters": {"entity_id": server_id}},
            timeout=5,
        )
        if resp.status_code == 200:
            mesh_memory = resp.json().get("data", [])
    except Exception:
        pass

    return ServerRiskDetail(
        server_id=server.server_id,
        server_name=server.server_name,
        org_id=server.org_id,
        category=server.category,
        risk_level=server.risk_level,
        status=server.status,
        axis_scores=[
            {"axis": s.axis, "score": s.score, "model": s.model_name}
            for s in axis_scores
        ],
        signal_scores=signal_scores,
        mesh_memory=mesh_memory,
        disputes=[
            {"id": d.dispute_id, "reason": d.reason, "status": d.status}
            for d in disputes
        ],
    )



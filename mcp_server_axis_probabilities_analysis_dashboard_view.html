<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Axis Probabilities Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .axis-card {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .risk-tier {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .axis-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .probability-value {
            font-size: 1.5em;
            color: #337ab7;
        }
        .overall-risk {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Server Axis Probabilities Analysis</h1>

        <div id="server-selector" class="mb-4">
            <select id="serverDropdown" class="form-select">
                <option value="">Select a Server</option>
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <div id="dashboard-content" class="row" style="display: none;">
            <div class="col-md-6">
                <div class="overall-risk">
                    <h3>Overall Risk Assessment</h3>
                    <div id="overallRiskTier" class="risk-tier">-</div>
                    <div id="overallRiskValue" class="probability-value">-</div>
                    <div id="criteriaVersion">Criteria Version: -</div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="row">
                    <div class="col-md-6">
                        <div class="axis-card" id="axis1">
                            <div class="axis-label">Axis 1: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="axis-card" id="axis2">
                            <div class="axis-label">Axis 2: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="axis-card" id="axis3">
                            <div class="axis-label">Axis 3: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="axis-card" id="axis4">
                            <div class="axis-label">Axis 4: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="axis-card" id="axis5">
                            <div class="axis-label">Axis 5: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="axis-card" id="axis6">
                            <div class="axis-label">Axis 6: -</div>
                            <div class="probability-value">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch server list
            fetch('/servers')
                .then(response => response.json())
                .then(servers => {
                    const serverDropdown = document.getElementById('serverDropdown');
                    servers.forEach(server => {
                        const option = document.createElement('option');
                        option.value = server.id;
                        option.textContent = server.name;
                        serverDropdown.appendChild(option);
                    });

                    // Add event listener for server selection
                    serverDropdown.addEventListener('change', function() {
                        const serverId = this.value;
                        if (serverId) {
                            fetchAxisProbabilities(serverId);
                        } else {
                            document.getElementById('dashboard-content').style.display = 'none';
                        }
                    });
                });

            function fetchAxisProbabilities(serverId) {
                fetch(`/servers/${serverId}/axis-probabilities`)
                    .then(response => response.json())
                    .then(data => {
                        displayDashboardContent(data);
                    });
            }

            function displayDashboardContent(data) {
                const dashboard = document.getElementById('dashboard-content');
                dashboard.style.display = 'block';

                // Display overall risk
                document.getElementById('overallRiskTier').textContent = data.risk_tier;
                document.getElementById('overallRiskValue').textContent = data.overall_risk.toFixed(2);
                document.getElementById('criteriaVersion').textContent = `Criteria Version: ${data.criteria_version}`;

                // Display axes
                const axes = data.axes;
                for (let i = 1; i <= 6; i++) {
                    const axis = axes[`axis${i}`];
                    const axisElement = document.getElementById(`axis${i}`);
                    axisElement.querySelector('.axis-label').textContent = `Axis ${i}: ${axis.label}`;
                    axisElement.querySelector('.probability-value').textContent = axis.p_top.toFixed(2);
                }
            }
        });
    </script>
</body>
</html>

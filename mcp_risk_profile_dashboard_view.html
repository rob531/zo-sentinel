<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Risk Profile Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .risk-tier {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .risk-tier.low {
            color: #28a745;
        }
        .risk-tier.medium {
            color: #ffc107;
        }
        .risk-tier.high {
            color: #dc3545;
        }
        .axis-scores {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .axis-score {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 10px;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }
        .axis-score h3 {
            margin-top: 0;
        }
        .history-filters {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th, .history-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .history-table th {
            background-color: #f2f2f2;
        }
        .history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .history-table tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>MCP Risk Profile Dashboard</h1>
            <div class="risk-tier" id="risk-tier">Loading...</div>
        </div>
        <div class="axis-scores" id="axis-scores">
            <!-- Axis scores will be loaded here -->
        </div>
        <div class="history-filters">
            <div>
                <label for="date-filter">Filter by Date:</label>
                <input type="date" id="date-filter">
            </div>
            <div>
                <label for="sort-by">Sort by:</label>
                <select id="sort-by">
                    <option value="date">Date</option>
                    <option value="risk">Risk Level</option>
                </select>
            </div>
        </div>
        <table class="history-table" id="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Risk Level</th>
                    <th>Verdict</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                <!-- History data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        // Dummy data for testing
        const dummyData = {
            risk_tier: "medium",
            axis_scores: [
                { name: "Confidentiality", score: 75 },
                { name: "Integrity", score: 80 },
                { name: "Availability", score: 65 },
                { name: "Compliance", score: 70 }
            ],
            history: [
                { date: "2023-01-15", risk_level: "high", verdict: "Block", notes: "Suspicious activity detected" },
                { date: "2023-01-10", risk_level: "medium", verdict: "Monitor", notes: "Potential threat identified" },
                { date: "2023-01-05", risk_level: "low", verdict: "Allow", notes: "Normal operation" },
                { date: "2023-01-01", risk_level: "medium", verdict: "Monitor", notes: "System update performed" }
            ]
        };

        // Function to load and display data
        function loadData() {
            // In a real application, this would be an API call
            // For now, we'll use the dummy data
            const data = dummyData;

            // Display risk tier
            const riskTierElement = document.getElementById('risk-tier');
            riskTierElement.textContent = `Overall Risk Tier: ${data.risk_tier}`;
            riskTierElement.className = `risk-tier ${data.risk_tier}`;

            // Display axis scores
            const axisScoresContainer = document.getElementById('axis-scores');
            axisScoresContainer.innerHTML = '';
            data.axis_scores.forEach(axis => {
                const axisElement = document.createElement('div');
                axisElement.className = 'axis-score';
                axisElement.innerHTML = `
                    <h3>${axis.name}</h3>
                    <p>Score: ${axis.score}</p>
                `;
                axisScoresContainer.appendChild(axisElement);
            });

            // Display history table
            const historyTableBody = document.querySelector('#history-table tbody');
            historyTableBody.innerHTML = '';
            data.history.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>${item.risk_level}</td>
                    <td>${item.verdict}</td>
                    <td>${item.notes}</td>
                `;
                historyTableBody.appendChild(row);
            });
        }

        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', loadData);

        // Add event listeners for filters
        document.getElementById('date-filter').addEventListener('change', function() {
            // In a real application, this would filter the data based on the selected date
            console.log('Filter by date:', this.value);
        });

        document.getElementById('sort-by').addEventListener('change', function() {
            // In a real application, this would sort the data based on the selected option
            console.log('Sort by:', this.value);
        });
    </script>
</body>
</html>

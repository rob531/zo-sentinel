<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Risk Tier Trend Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        #chart-container {
            width: 100%;
            height: 500px;
            margin-top: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>MCP Risk Tier Trend Analysis</h1>
    <div class="controls">
        <button id="refresh-btn">Refresh Data</button>
    </div>
    <div id="chart-container">
        <canvas id="riskTierChart"></canvas>
    </div>
    <div id="loading" class="loading" style="display: none;">
        Loading data...
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('riskTierChart').getContext('2d');
            let riskTierChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Tier 1',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 2',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 3',
                            backgroundColor: 'rgba(255, 206, 86, 0.2)',
                            borderColor: 'rgba(255, 206, 86, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 4',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            data: [],
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Servers'
                            },
                            beginAtZero: true
                        }
                    }
                }
            });

            const refreshBtn = document.getElementById('refresh-btn');
            const loadingDiv = document.getElementById('loading');

            function fetchData() {
                loadingDiv.style.display = 'block';

                fetch('/dashboard/risk-tier-trend')
                    .then(response => response.json())
                    .then(data => {
                        updateChart(data);
                        loadingDiv.style.display = 'none';
                    })
                    .catch(error => {
                        console.error('Error fetching data:', error);
                        loadingDiv.style.display = 'none';
                    });
            }

            function updateChart(data) {
                const dates = data.dates;
                const tier1 = data.tier1;
                const tier2 = data.tier2;
                const tier3 = data.tier3;
                const tier4 = data.tier4;

                riskTierChart.data.labels = dates;
                riskTierChart.data.datasets[0].data = tier1;
                riskTierChart.data.datasets[1].data = tier2;
                riskTierChart.data.datasets[2].data = tier3;
                riskTierChart.data.datasets[3].data = tier4;

                riskTierChart.update();
            }

            refreshBtn.addEventListener('click', fetchData);

            // Initial data fetch
            fetchData();
        });
    </script>
</body>
</html>

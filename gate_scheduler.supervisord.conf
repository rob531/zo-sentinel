# ZO-SENTINEL Gate Scheduler -- supervisord registration block
#
# Append this block to /etc/zo/supervisord-user.conf, then:
#    supervisorctl -c /etc/zo/supervisord-user.conf reread
#    supervisorctl -c /etc/zo/supervisord-user.conf update
#    supervisorctl -c /etc/zo/supervisord-user.conf status gate_scheduler

[program:gate_scheduler]
command=python3 /home/workspace/zo_sentinel/gate_scheduler.py
directory=/home/workspace/zo_sentinel
autostart=true
autorestart=true
startretries=5
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/home/workspace/logs/gate_scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/workspace/logs/gate_scheduler.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=GATE_INTERVAL_SEC="21600"

# Notes:
# - autorestart=true: supervisord restarts on crash
# - startretries=5: prevents infinite restart loop on broken deploy
# - startsecs=10: considers start successful after 10s uptime
# - stopsignal=TERM / stopwaitsecs=30: graceful shutdown with up to 30s for
#   in-progress gate run to finish
# - No 'user=' line: runs as whatever user supervisord was started as
#   (same behavior as the other mesh daemons in this container)
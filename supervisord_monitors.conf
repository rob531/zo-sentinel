; zo-sentinel MONITORS -- the watch/heal daemons, separate from the build pipeline
; (supervisord_sentinel_full.conf) and from go.sh's imperative bootstrap. Apply by
; including this file in the live supervisord config + `supervisorctl reread && update`.
; Both are READ-mostly: loop_watch is read-only (+ a heartbeat + email on alert);
; graph_refresh only writes on an actual deploy (HEAD change) and idle-gates so its
; one bulk load never contends with a live build on write_service.

[program:zo_sentinel_loop_watch]
command=python3 /home/workspace/zo_sentinel/loop_watch.py --interval 1800
directory=/home/workspace/zo_sentinel
autostart=true
autorestart=true
startretries=5
stdout_logfile=/home/workspace/logs/loop_watch.log
stderr_logfile=/home/workspace/logs/loop_watch.log
stdout_logfile_maxbytes=5MB

[program:zo_sentinel_graph_refresh]
command=python3 /home/workspace/zo_sentinel/tools/graph_refresh.py --interval 900
directory=/home/workspace/zo_sentinel
autostart=true
autorestart=true
startretries=5
stdout_logfile=/home/workspace/logs/graph_refresh.log
stderr_logfile=/home/workspace/logs/graph_refresh.log
stdout_logfile_maxbytes=5MB

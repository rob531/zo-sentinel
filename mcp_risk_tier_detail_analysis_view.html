<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tier Detail Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chart-container {
            width: 100%;
            height: 400px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Risk Tier Detail Analysis</h1>
        <div class="chart-container">
            <canvas id="riskTierChart"></canvas>
        </div>
        <table id="riskTierTable">
            <thead>
                <tr>
                    <th>Server ID</th>
                    <th>Risk Tier</th>
                    <th>Score</th>
                    <th>Dispute Count</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const session = await getSession();
            const servers = await getServers(session);
            const scores = await getScores(session);
            const disputes = await getDisputes(session);

            const riskTierData = processData(servers, scores, disputes);
            renderChart(riskTierData);
            renderTable(riskTierData);
        });

        async function getSession() {
            const response = await fetch('/api/session');
            return await response.json();
        }

        async function getServers(session) {
            const response = await fetch('/api/servers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ session }),
            });
            return await response.json();
        }

        async function getScores(session) {
            const response = await fetch('/api/scores', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ session }),
            });
            return await response.json();
        }

        async function getDisputes(session) {
            const response = await fetch('/api/disputes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ session }),
            });
            return await response.json();
        }

        function processData(servers, scores, disputes) {
            const riskTierData = {};

            servers.forEach(server => {
                const serverId = server.id;
                const score = scores.find(score => score.server_id === serverId);
                const disputeCount = disputes.filter(dispute => dispute.server_id === serverId).length;

                if (!riskTierData[server.risk_tier]) {
                    riskTierData[server.risk_tier] = {
                        count: 0,
                        totalScore: 0,
                        totalDisputes: 0,
                        servers: []
                    };
                }

                riskTierData[server.risk_tier].count++;
                riskTierData[server.risk_tier].totalScore += score ? score.score : 0;
                riskTierData[server.risk_tier].totalDisputes += disputeCount;
                riskTierData[server.risk_tier].servers.push({
                    id: serverId,
                    score: score ? score.score : 0,
                    disputeCount
                });
            });

            return riskTierData;
        }

        function renderChart(data) {
            const ctx = document.getElementById('riskTierChart').getContext('2d');
            const labels = Object.keys(data);
            const counts = labels.map(label => data[label].count);
            const avgScores = labels.map(label => data[label].totalScore / data[label].count);
            const avgDisputes = labels.map(label => data[label].totalDisputes / data[label].count);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Number of Servers',
                            data: counts,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Average Score',
                            data: avgScores,
                            backgroundColor: 'rgba(153, 102, 255, 0.2)',
                            borderColor: 'rgba(153, 102, 255, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Average Disputes',
                            data: avgDisputes,
                            backgroundColor: 'rgba(255, 159, 64, 0.2)',
                            borderColor: 'rgba(255, 159, 64, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function renderTable(data) {
            const tableBody = document.querySelector('#riskTierTable tbody');
            tableBody.innerHTML = '';

            Object.keys(data).forEach(tier => {
                data[tier].servers.forEach(server => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${server.id}</td>
                        <td>${tier}</td>
                        <td>${server.score}</td>
                        <td>${server.disputeCount}</td>
                    `;
                    tableBody.appendChild(row);
                });
            });
        }
    </script>
</body>
</html>

name: goose-canary

# Eval a CANDIDATE goose version BEFORE it touches the live tower (rule #1: don't
# break goose). The live mesh is on 1.43.0 (flipped 2026-07-19, FU-017/#1652).
# This canary proves an upgrade is safe:
#   1. install the candidate goose,
#   2. tool-call smoke (new goose loads a recipe + drives a model + calls a tool),
#   3. stdio NAMESPACING probe (scar #454 -- 1.38 renamed stdio tools and starved
#      the architect at +0; every version bump MUST clear this),
#   4. PreToolUse hook fire/deny parity,
#   5. our-recipe load check (architect.yaml / directive_architect.yaml still parse),
#   6. LONG SHELL STEP (FU-017/#10348 -- the 300s default shell kill must stay
#      overridden by GOOSE_DEFAULT_EXTENSION_TIMEOUT),
#   7. full writer integration tier (real ephemeral write_service + DB round-trip),
# then report pass/fail. Manual-only; never auto-runs.
#
# 2026-07-27: steps 3 and 6 were ADDED. Their recipes were committed on 2026-07-19
# and run ad hoc during the 1.43 flip, but no workflow step ever invoked them --
# the scar-#454 guard the upgrade doctrine requires existed as a FILE and not as a
# GATE. That is the "proves presence, never correctness" class (Harness Engineering
# row, GOOSE_WATCH). Also repointed the installer from block/goose to aaif-goose/goose
# (the project moved to the Linux Foundation's AAIF; the old org only worked by
# GitHub rename-redirect, which is not a contract).

on:
  workflow_dispatch:
    inputs:
      goose_version:
        # The default must name a version this workflow has ACTUALLY adjudicated,
        # not merely the newest one upstream -- otherwise a bare re-run silently
        # grades a candidate nobody has a verdict for. 1.45.0: run 30828744813,
        # conclusion success, all steps, `goose --version` -> 1.45.0.
        description: "candidate goose version (e.g. 1.45.0)"
        required: true
        default: "1.45.0"
      smoke_rung:
        description: "cheap provider to drive the smoke (cerebras|groq)"
        default: "cerebras"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      - name: Install candidate goose (Rust CLI, aaif-goose org)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false GOOSE_VERSION="v${{ inputs.goose_version }}" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: goose --version
        run: goose --version

      # THREE OUTCOMES, NOT TWO -- and a rung failover. (chairman issue #4077)
      #
      # Until 2026-09-02 this was two steps: a `Map smoke rung` step that pinned
      # ONE provider into $GITHUB_ENV for the whole job, and a smoke step whose
      # only two verdicts were "nonce echoed" and
      #     SMOKE FAIL: nonce not echoed -- this goose broke our recipe/tool loop
      #
      # Run 33387672279 (2026-08-31) published exactly that sentence about a
      # transcript reading `Please check your account with your provider to add
      # more credits`. goose loaded the recipe, opened a session and reached
      # cerebras; cerebras refused on BILLING. Nothing was learned about the
      # candidate version, and the canary asserted a version verdict anyway.
      # That is the FU-108 class (EXTRACTION_FAILURE != DEGENERATE) and R6
      # (unknown != zero) -- both of which the `namespacing` step below already
      # respects with its PROBE INCONCLUSIVE branch. The FIRST step, the one
      # that actually failed, was the one without them.
      #
      # tools/canary/classify_smoke.py owns the three-way decision and carries
      # its negative controls in tests/test_canary_classify_smoke.py (mutating
      # its phrase patterns to naive keywords turns 7 of them red -- observed,
      # not assumed). Exit codes: 0 PASS, 1 FAIL, 2 PROVIDER_UNAVAILABLE.
      #
      # ONLY a PROVIDER_UNAVAILABLE falls through to the other rung. A FAIL
      # stops the job on the spot: retrying a genuine loop regression on a
      # second provider is how a red canary is talked into green, which is the
      # one failure mode worse than the one being fixed here. The rung that
      # WINS is the rung written to $GITHUB_ENV, so every later step in this
      # job runs on a provider proven reachable seconds earlier rather than on
      # a dead one chosen at dispatch time.
      - name: Tool-call smoke (recipe load + model + tool call, with rung failover)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PREFERRED_RUNG: ${{ inputs.smoke_rung }}
        run: |
          set -uo pipefail

          case "$PREFERRED_RUNG" in
            cerebras) RUNGS="cerebras groq" ;;
            groq)     RUNGS="groq cerebras" ;;
            *) echo "unknown rung $PREFERRED_RUNG"; exit 1 ;;
          esac

          UNAVAILABLE_NOTES=""
          for RUNG in $RUNGS; do
            if [ "$RUNG" = "cerebras" ]; then
              BASE_URL="https://api.cerebras.ai/v1"; KEY="$CEREBRAS_API_KEY"; MODEL="gpt-oss-120b"
            else
              BASE_URL="https://api.groq.com/openai/v1"; KEY="$GROQ_API_KEY"; MODEL="openai/gpt-oss-120b"
            fi

            if [ -z "$KEY" ]; then
              echo "rung $RUNG: no API key configured -- skipping (not a goose verdict)"
              UNAVAILABLE_NOTES="$UNAVAILABLE_NOTES\n  $RUNG: secret not set"
              continue
            fi

            echo "=== smoke on rung: $RUNG ($MODEL) ==="
            NONCE="ci-$RANDOM-$RANDOM"
            OPENAI_BASE_URL="$BASE_URL" OPENAI_API_KEY="$KEY" \
            GOOSE_MODEL="$MODEL" GOOSE_PROVIDER="openai" \
              goose run --no-session --recipe tools/canary/smoke_recipe.yaml \
                --params nonce="$NONCE" 2>&1 | tee /tmp/smoke.out

            python tools/canary/classify_smoke.py --transcript /tmp/smoke.out --nonce "$NONCE"
            case "$?" in
              0)
                echo "SMOKE PASS on rung $RUNG: this goose loads a recipe, drives a model and calls a tool."
                {
                  echo "OPENAI_BASE_URL=$BASE_URL"
                  echo "OPENAI_API_KEY=$KEY"
                  echo "GOOSE_MODEL=$MODEL"
                  echo "GOOSE_PROVIDER=openai"
                  echo "CANARY_WINNING_RUNG=$RUNG"
                } >> "$GITHUB_ENV"
                exit 0
                ;;
              2)
                echo "rung $RUNG is PROVIDER_UNAVAILABLE -- this says nothing about the candidate goose."
                UNAVAILABLE_NOTES="$UNAVAILABLE_NOTES\n  $RUNG: provider refused (see verdict line above)"
                ;;
              *)
                echo "SMOKE FAIL on rung $RUNG: goose was driven and the recipe->model->tool loop did not close."
                echo "No provider-layer signal was present, so this IS a verdict on the candidate version."
                echo "NOT retrying on another rung: a second provider cannot un-break a broken loop, and"
                echo "trying would only convert a true red into a green nobody can trust."
                tail -40 /tmp/smoke.out
                exit 1
                ;;
            esac
          done

          echo "SMOKE INCONCLUSIVE -- NOT A GOOSE VERDICT, AND NOT A PASS."
          printf 'Every rung was unavailable at the provider layer:%b\n' "$UNAVAILABLE_NOTES"
          echo "The candidate version has been neither cleared nor condemned. Restore a rung"
          echo "(credits/quota/key) and re-dispatch; do not record a version decision from this run."
          tail -40 /tmp/smoke.out 2>/dev/null || true
          exit 1

      # The bridge needs the MCP SDK. It is NOT declared in any requirements file
      # in this repo -- it exists only in the tower's ambient Python env, which is
      # why the first CI run of this probe died on `No module named 'mcp'`. Pinned
      # loose-but-bounded, same philosophy as tests/ci/requirements-ci.txt.
      - name: Install the MCP SDK the bridge imports
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "mcp>=1.2,<2.0"
          python -c "from mcp.server.fastmcp import FastMCP; print('mcp SDK import OK')"

      # SCAR #454 (goose 1.38): stdio tool names were namespaced away from what
      # directive_architect.yaml hardcodes, every architect call returned
      # "Tool not found", and the architect silently emitted +0 for days. The
      # probe loads the REAL zo_directive_bridge stdio extension and calls the
      # VERBATIM name the architect recipe uses. cwd MUST be the repo root so the
      # relative extension arg resolves (goose stdio extensions resolve paths
      # against the goose PROCESS cwd).
      #
      # TWO FAILURE MODES, and they are NOT the same defect (the FU-108 lesson:
      # EXTRACTION_FAILURE != DEGENERATE -- never let one bucket absorb the other):
      #   (a) EXTENSION_START_FAILURE -- the bridge process never initialised.
      #       goose does NOT abort on this: it prints "continuing without it" and
      #       runs the session with only python/bash. That is the 1.38 starvation
      #       shape reproduced by a different cause, so it must still fail the
      #       build -- an architect with no bridge is dead either way.
      #   (b) genuine RENAME -- bridge started, but the verbatim tool name is gone.
      - name: stdio namespacing probe (scar #454 -- MANDATORY for any version bump)
        env:
          # The bridge defaults its root to /home/workspace/zo_sentinel (the tower).
          # A runner cannot write there, so point it at a scratch root. The DEFAULT
          # is unchanged -- this only exercises the override.
          ZO_SENTINEL_DIR: ${{ runner.temp }}/zo_sentinel
          ZO_DIRECTIVE_MCP_LOG: ${{ runner.temp }}/directive_mcp.log
          # DRIVE THIS STEP ON A NON-REASONING MODEL, and understand why before
          # changing it back. This canary points goose DIRECTLY at a provider,
          # whereas the mesh points goose at the ladder shim on :8796. On the
          # direct path, a multi-turn tool-calling turn against a REASONING model
          # (cerebras gpt-oss-120b) dies with:
          #   400: messages.2.assistant.reasoning_content ... is unsupported
          # because goose preserves reasoning_content across tool-call turns
          # (upstream #10366) and the provider rejects the property on replay.
          # PROVEN NOT A VERSION REGRESSION: runs 30262869986 (1.44.0) and
          # 30262977744 (1.43.0 control) fail identically, and 1.43 is what is
          # live today. PROVEN NOT A PRODUCTION BUG EITHER: ladder_shim.py
          # chat_completions() reads only role+content off each message and
          # rebuilds a fresh [system, user] payload, so reasoning_content never
          # reaches a provider in the real path.
          # The single-turn smoke above is unaffected -- it never replays an
          # assistant turn. See FU-119 for the standing divergence this exposes.
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOSE_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail
          NONCE="ns-$RANDOM-$RANDOM"
          goose run --no-session --recipe tools/canary/namespacing_probe_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/namespacing.out

          if grep -qi "Failed to start extension 'zo_directive_bridge'" /tmp/namespacing.out; then
            echo "CANARY FAIL (a): EXTENSION_START_FAILURE -- the bridge never initialised."
            echo "This is NOT a goose namespacing regression; it is our extension being unloadable."
            echo "Note what goose did: it warned and CONTINUED WITHOUT THE BRIDGE. A bridge that"
            echo "fails to start on the tower therefore produces a live-looking architect with no"
            echo "bridge tools -- i.e. +0 -- and goose will not tell you louder than a warning."
            grep -i "Failed to start extension" -A2 /tmp/namespacing.out || true
            exit 1
          fi

          # THREE OUTCOMES, NOT TWO. Until 2026-08-10 this block had a PASS and a
          # single catch-all FAIL that asserted "genuine rename" for any reason the
          # nonce failed to appear. Run 31384666172 published exactly that false
          # verdict -- "DO NOT FLIP", on a version where the name resolved six
          # times -- because the MODEL emitted `null` args for a zero-argument tool
          # and the provider then refused the whole function call. A guard that can
          # only say "renamed" will say "renamed" about a bad afternoon.
          #
          # KEY INSIGHT, and the reason this is not merely a softened assertion:
          # the -32602 dispatcher error NAMES THE TOOL. goose can only print
          #   -32602: Tool arguments for zo_directive_bridge__read_protected_files ...
          # if it RESOLVED that name. So the error line is POSITIVE evidence of
          # correct namespacing and was being thrown away. We harvest it.
          VERBATIM="zo_directive_bridge__read_protected_files"

          if grep -q "NAMESPACING_OK::$NONCE" /tmp/namespacing.out; then
            echo "NAMESPACING PASS (direct evidence): $VERBATIM resolved and the call completed."
            exit 0
          fi

          if grep -qE -- "-32602: Tool arguments for $VERBATIM" /tmp/namespacing.out; then
            echo "NAMESPACING PASS (dispatcher evidence): goose RESOLVED $VERBATIM --"
            echo "it could not have named the tool in a -32602 otherwise. Namespacing is intact."
            echo
            echo "SEPARATE DEFECT, do not conflate it with a version verdict: the model emitted"
            echo "malformed tool arguments (null, for a zero-argument tool) and the provider then"
            echo "refused the call. That is the #9832 / #10230 class -- and note WHERE it bites:"
            echo "only on this DIRECT-to-provider tier. The mesh routes through escalation.py,"
            echo "which salvages exactly this. FU-119's thesis, demonstrated by accident."
            grep -E -- "-32602|Failed to call a function" /tmp/namespacing.out | head -8
            exit 0
          fi

          if grep -q "$VERBATIM" /tmp/namespacing.out; then
            echo "PROBE INCONCLUSIVE -- NOT A NAMESPACING VERDICT."
            echo "The verbatim name appears in the transcript but neither the nonce nor a"
            echo "dispatcher error was seen. Something failed upstream of the tool call"
            echo "(provider outage, rate limit, truncated turn). Read the log; do not record"
            echo "a rename, and do not record a pass."
            tail -40 /tmp/namespacing.out
            exit 1
          fi

          echo "CANARY FAIL (b): the architect's hardcoded tool name did NOT resolve, the"
          echo "bridge DID start, and the name appears NOWHERE in the transcript -- so this"
          echo "is a genuine rename. The 1.38 starvation shape. DO NOT FLIP."
          tail -40 /tmp/namespacing.out
          exit 1

      - name: PreToolUse hooks test (do hooks fire under `goose run`? is deny enforced?)
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.agents/plugins"
          cp -R tools/canary/plugins/tool-budget "$HOME/.agents/plugins/tool-budget"
          cp -R tools/canary/plugins/hook-probe  "$HOME/.agents/plugins/hook-probe"
          rm -f /tmp/tool_budget*.count /tmp/tool_budget.log /tmp/budget_exec_* /tmp/hook_probe_fired
          HOOK_BUDGET=2 goose run --no-session --recipe tools/canary/hook_budget_recipe.yaml 2>&1 | tee /tmp/hook.out || true
          fired=no; [ -f /tmp/hook_probe_fired ] && fired=yes
          ran=$(ls /tmp/budget_exec_* 2>/dev/null | wc -l | tr -d ' ')
          echo "hooks_fire_under_goose_run=$fired ; tools_executed=$ran (budget=2)"
          echo "--- tool-budget log ---"; cat /tmp/tool_budget.log 2>/dev/null || echo "(empty)"
          if [ "$fired" = no ]; then
            echo "VERDICT: hooks DO NOT fire under \`goose run\` -> PreToolUse approach is DEAD for the architect (it runs non-interactively). Go recipe-simplification."
            exit 1
          fi
          if [ "$ran" -le 2 ]; then
            echo "VERDICT: PASS -- hooks fire AND deny enforced ($ran<=2). Build the architect tool-budget hook."
          else
            echo "VERDICT: hooks fire but DENY IGNORED ($ran>2). Use exit-2 deny or another convergence lever."
            exit 1
          fi

      - name: Our-recipe load check (catch recipe-schema breaks)
        run: |
          set -uo pipefail
          rc=0
          for r in goose_recipes/directive_architect.yaml goose_recipes/architect.yaml; do
            out="$(timeout 25 goose run --no-session --recipe "$r" 2>&1 || true)"
            if echo "$out" | grep -qiE "Loading recipe|provide the following parameters"; then
              echo "LOAD OK (schema parses under this goose): $r"
            else
              echo "LOAD FAIL: $r"; echo "$out" | tail -5; rc=1
            fi
          done
          exit $rc

      # FU-017 / upstream #10348: from 1.43 the default extension timeout applies
      # to the builtin developer SHELL, and it is governed ONLY by
      # GOOSE_DEFAULT_EXTENSION_TIMEOUT -- the per-extension `timeout:` field in the
      # recipe is NOT honoured for that kill (canary-proven 2026-07-19: negative
      # control died at exactly 300s). The tower exports 900 in zo_mesh/.zo_env;
      # this step asserts that guard still works on the candidate version, because
      # builder shell steps (installs, test suites) routinely exceed 300s.
      - name: Long shell step (FU-017 -- 300s default kill must stay overridden)
        env:
          GOOSE_DEFAULT_EXTENSION_TIMEOUT: "900"
        run: |
          set -euo pipefail
          NONCE="ls-$RANDOM-$RANDOM"
          goose run --no-session --recipe tools/canary/long_shell_step_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/long_shell.out
          if grep -q "LONG_STEP_OK::$NONCE" /tmp/long_shell.out; then
            echo "LONG STEP PASS: a 400s shell call survived under GOOSE_DEFAULT_EXTENSION_TIMEOUT=900"
          else
            echo "LONG STEP FAIL: the 400s shell call did not complete. Either the env guard"
            echo "no longer overrides the default kill, or the resolution order changed again."
            echo "DO NOT FLIP -- long builder shell steps would be silently truncated."
            tail -40 /tmp/long_shell.out
            exit 1
          fi

      - name: Full writer integration tier (real ephemeral write_service)
        env:
          IT_WS_PORT: "8772"
          ZO_WRITE_SERVICE: "http://127.0.0.1:8772"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r tests/ci/requirements-ci.txt pytest
          nohup python tests/integration/it_write_service.py > /tmp/it_ws.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8772/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://127.0.0.1:8772/health || { echo "ws failed to start"; cat /tmp/it_ws.log; exit 1; }
          python -m pytest tests/integration -v


      - name: Logs on failure
        if: failure()
        run: |
          echo "--- smoke ---"; cat /tmp/smoke.out 2>/dev/null || true
          echo "--- namespacing ---"; cat /tmp/namespacing.out 2>/dev/null || true
          echo "--- hooks ---"; cat /tmp/hook.out 2>/dev/null || true
          echo "--- long shell ---"; cat /tmp/long_shell.out 2>/dev/null || true
          echo "--- write_service ---"; cat /tmp/it_ws.log 2>/dev/null || true

  # ------------------------------------------------------------------
  # SPLIT OUT OF `canary` ON 2026-08-10. It was appended to that job and
  # therefore SKIPPED the first time it ran (31384666172, step 9 red) --
  # a tier that can only execute once every other tier is already green
  # cannot report on the condition it exists for. `skipped` is not `pass`
  # (R3), and the whole point of this tier is to see failures the direct
  # tier cannot. It needs no provider secret, so it has no reason to be
  # coupled to a job that does.
  # ------------------------------------------------------------------
  shim_tier:
    name: Shim tier (production transport, FU-119)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install candidate goose (Rust CLI, aaif-goose org)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false GOOSE_VERSION="v${{ inputs.goose_version }}" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the MCP SDK the bridge imports
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "mcp>=1.2,<2.0"
      # ================================================================
      # TIER 2 -- THE PRODUCTION TRANSPORT (FU-119)
      #
      # Every step above drives goose STRAIGHT AT A PROVIDER. The mesh never
      # does that: the architect and the builder both drive goose at
      # ladder_shim.py on 127.0.0.1:8796. So everything above is blind to the
      # shim, the rung rotation, the key hydrator and the tool-call salvage --
      # which is exactly where our scars live (scar #454, TOOL:-as-prose,
      # key_hydrator 502s). FU-119, open since 2026-07-27.
      #
      # The tier stands the shim up FROM THE CHECKOUT rather than reaching the
      # tower. A runner cannot reach :8796 on the tower, and it should not want
      # to: booting from the checkout gates THE SHIM CODE THIS PR CHANGES,
      # rather than whatever happens to be running elsewhere.
      #
      # NO SECRET IS REQUIRED, and that is deliberate. The assertion is about
      # the REQUEST goose sends, not the RESPONSE a provider returns, so the
      # ladder is replaced by a recorder (tools/canary/shim_tier_recorder.py).
      # Zero tokens, zero keys. A tier gated on a secret we are not authorised
      # to add would skip forever, and a skip that reads as a pass is the
      # failure class this repo has paid for most.
      #
      # WHAT THIS TIER DOES NOT CLAIM: rung rotation, key hydration and real
      # provider behaviour are NOT exercised here -- they need keys. Do not read
      # this green as "the ladder works". Read it as "the shim's HTTP surface,
      # request model and tool passthrough survive this goose version, and
      # escalation.py still imports".
      # ================================================================

      - name: Shim tier -- boot ladder_shim.py from the checkout
        env:
          ZO_SENTINEL_DIR: ${{ runner.temp }}/zo_sentinel_shim
        run: |
          set -euo pipefail
          pip install fastapi uvicorn pydantic requests
          nohup python tools/canary/shim_tier_recorder.py \
            --port 8796 --record /tmp/shim_tier_requests.json \
            > /tmp/shim_tier_boot.log 2>&1 &
          echo $! > /tmp/shim_tier.pid

          # Bounded wait. A shim that never comes up must fail the step with a
          # NAMED message -- an unbounded wait is how a boot failure becomes a
          # timeout nobody attributes.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8796/health > /tmp/shim_health.json 2>/dev/null; then
              echo "SHIM_TIER::health=$(cat /tmp/shim_health.json)"
              exit 0
            fi
            sleep 1
          done
          echo "SHIM TIER FAIL: ladder_shim.py never became healthy on 127.0.0.1:8796 within 30s."
          echo "This is a BOOT failure, not a goose-version failure. Boot log:"
          cat /tmp/shim_tier_boot.log || true
          exit 1

      - name: Shim tier -- drive the candidate goose through :8796
        env:
          # THE LINE THIS WHOLE TIER EXISTS FOR. FU-119's predicate asserts on it.
          OPENAI_BASE_URL: http://127.0.0.1:8796/v1
          # The shim does not authenticate; goose requires the var to be set.
          OPENAI_API_KEY: shim-tier-no-auth-required
          # NOT INHERITED. `GOOSE_PROVIDER=openai` is written to $GITHUB_ENV by the
          # `canary` job's "Map smoke rung" step; splitting this tier into its own
          # job left it behind, and the installer runs CONFIGURE=false so there is
          # no config file to fall back on. goose then exits in 0.03s having sent
          # nothing -- which run 31385033251 reported, correctly, as requests=0 /
          # TRANSPORT failure rather than as a rename.
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: zo-ladder-v1
          ZO_SENTINEL_DIR: ${{ runner.temp }}/zo_sentinel_shim
          ZO_DIRECTIVE_MCP_LOG: ${{ runner.temp }}/directive_mcp_shim.log
        run: |
          set -uo pipefail
          NONCE="shim-$RANDOM-$RANDOM"
          # We do NOT assert on the recipe's own output here. The recorder
          # returns canned text, so the agent never completes a real tool call --
          # that is the direct tier's job. This tier asserts on the REQUEST.
          goose run --no-session --recipe tools/canary/namespacing_probe_recipe.yaml \
            --params nonce="$NONCE" 2>&1 | tee /tmp/shim_tier_goose.out || true

          if grep -qi "Failed to start extension 'zo_directive_bridge'" /tmp/shim_tier_goose.out; then
            echo "SHIM TIER FAIL: EXTENSION_START_FAILURE -- the bridge never initialised."
            echo "goose warned and CONTINUED WITHOUT IT (FU-117), so the tool list is empty"
            echo "for a reason that has nothing to do with the transport. Fix the bridge first."
            exit 1
          fi
          echo "SHIM_TIER::goose_run=completed"

      - name: Shim tier -- assert the namespaced tool name arrived UNTRUNCATED
        run: |
          set -uo pipefail
          cat /tmp/shim_tier_requests.json
          set +e
          python tools/canary/assert_shim_tool_names.py --record /tmp/shim_tier_requests.json
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "---- goose transcript (the step that failed showed none) ----"
            cat /tmp/shim_tier_goose.out || echo "(no transcript)"
            echo "---- shim boot log ----"
            cat /tmp/shim_tier_boot.log || echo "(no boot log)"
            exit "$RC"
          fi

      # NEGATIVE CONTROL. An assertion that has never been observed failing is
      # not evidence that the transport works; it is evidence that nothing was
      # measured (R4). This step re-runs the recorder with --truncate-names,
      # simulating upstream #10659, and REQUIRES the assertion above to go RED.
      # If this step's inner assertion passes, the guard is vacuous and the
      # build fails -- which is the correct outcome.
      - name: Shim tier -- NEGATIVE CONTROL (truncation must turn the assertion RED)
        env:
          ZO_SENTINEL_DIR: ${{ runner.temp }}/zo_sentinel_shim
          OPENAI_BASE_URL: http://127.0.0.1:8796/v1
          OPENAI_API_KEY: shim-tier-no-auth-required
          # NOT INHERITED. `GOOSE_PROVIDER=openai` is written to $GITHUB_ENV by the
          # `canary` job's "Map smoke rung" step; splitting this tier into its own
          # job left it behind, and the installer runs CONFIGURE=false so there is
          # no config file to fall back on. goose then exits in 0.03s having sent
          # nothing -- which run 31385033251 reported, correctly, as requests=0 /
          # TRANSPORT failure rather than as a rename.
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: zo-ladder-v1
          ZO_DIRECTIVE_MCP_LOG: ${{ runner.temp }}/directive_mcp_neg.log
        run: |
          set -uo pipefail
          kill "$(cat /tmp/shim_tier.pid)" 2>/dev/null || true
          sleep 2
          nohup python tools/canary/shim_tier_recorder.py \
            --port 8796 --record /tmp/shim_tier_neg.json --truncate-names 12 \
            > /tmp/shim_tier_neg_boot.log 2>&1 &
          echo $! > /tmp/shim_tier_neg.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8796/health >/dev/null 2>&1 && break
            sleep 1
          done

          goose run --no-session --recipe tools/canary/namespacing_probe_recipe.yaml \
            --params nonce="neg-control" > /tmp/shim_tier_neg_goose.out 2>&1 || true

          set +e
          python tools/canary/assert_shim_tool_names.py --record /tmp/shim_tier_neg.json
          RC=$?
          set -e
          kill "$(cat /tmp/shim_tier_neg.pid)" 2>/dev/null || true

          if [ "$RC" -eq 0 ]; then
            echo "NEGATIVE CONTROL FAILED: names truncated to 12 chars and the assertion"
            echo "still PASSED. The untruncated-name guard is vacuous -- it cannot detect"
            echo "the thing it was written to detect. Do not trust the green above."
            exit 1
          fi
          echo "SHIM_TIER_VERDICT::negative_control::PASS::assertion went RED under truncation (rc=$RC)"

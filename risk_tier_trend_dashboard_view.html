<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Tier Trend Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .filter-section {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Risk Tier Trend Dashboard</h1>

        <div class="filter-section">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="dateRange" class="form-label">Date Range</label>
                    <div class="input-group">
                        <input type="date" class="form-control" id="startDate">
                        <span class="input-group-text">to</span>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="serverFilter" class="form-label">Server Filter</label>
                    <select class="form-select" id="serverFilter">
                        <option value="">All Servers</option>
                        <!-- Server options will be populated dynamically -->
                    </select>
                </div>
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <button id="applyFilters" class="btn btn-primary w-100">Apply Filters</button>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="riskTierChart"></canvas>
        </div>

        <div class="mt-4">
            <button id="exportCSV" class="btn btn-secondary">Export Data as CSV</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('riskTierChart').getContext('2d');
            let riskTierChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Tier 1',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 2',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 3',
                            backgroundColor: 'rgba(255, 206, 86, 0.2)',
                            borderColor: 'rgba(255, 206, 86, 1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: 'Tier 4',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            data: [],
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Number of Servers'
                            },
                            beginAtZero: true
                        }
                    }
                }
            });

            // Load initial data
            loadData();

            // Load server options for filter
            loadServerOptions();

            // Event listeners
            document.getElementById('applyFilters').addEventListener('click', function() {
                loadData();
            });

            document.getElementById('exportCSV').addEventListener('click', function() {
                exportToCSV();
            });

            function loadData() {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const serverFilter = document.getElementById('serverFilter').value;

                const params = {
                    start_date: startDate,
                    end_date: endDate,
                    server_id: serverFilter === '' ? null : serverFilter
                };

                axios.post('http://127.0.0.1:8772/query', {
                    query: 'SELECT * FROM risk_tier_transition_tracker WHERE 1=1',
                    params: params
                })
                .then(response => {
                    processData(response.data);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
            }

            function processData(data) {
                const dateMap = {};

                data.forEach(item => {
                    const date = item.date;
                    const tier = item.risk_tier;

                    if (!dateMap[date]) {
                        dateMap[date] = { 'Tier 1': 0, 'Tier 2': 0, 'Tier 3': 0, 'Tier 4': 0 };
                    }

                    dateMap[date][`Tier ${tier}`]++;
                });

                const dates = Object.keys(dateMap).sort();
                const tier1Data = dates.map(date => dateMap[date]['Tier 1']);
                const tier2Data = dates.map(date => dateMap[date]['Tier 2']);
                const tier3Data = dates.map(date => dateMap[date]['Tier 3']);
                const tier4Data = dates.map(date => dateMap[date]['Tier 4']);

                riskTierChart.data.labels = dates;
                riskTierChart.data.datasets[0].data = tier1Data;
                riskTierChart.data.datasets[1].data = tier2Data;
                riskTierChart.data.datasets[2].data = tier3Data;
                riskTierChart.data.datasets[3].data = tier4Data;

                riskTierChart.update();
            }

            function loadServerOptions() {
                axios.post('http://127.0.0.1:8772/query', {
                    query: 'SELECT id, name FROM McpServerRegistry'
                })
                .then(response => {
                    const serverSelect = document.getElementById('serverFilter');
                    response.data.forEach(server => {
                        const option = document.createElement('option');
                        option.value = server.id;
                        option.textContent = server.name;
                        serverSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching server data:', error);
                });
            }

            function exportToCSV() {
                const data = riskTierChart.data;
                const headers = ['Date', 'Tier 1', 'Tier 2', 'Tier 3', 'Tier 4'];
                const rows = data.labels.map((label, index) => [
                    label,
                    data.datasets[0].data[index],
                    data.datasets[1].data[index],
                    data.datasets[2].data[index],
                    data.datasets[3].data[index]
                ]);

                const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'risk_tier_trends.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });
    </script>
</body>
</html>

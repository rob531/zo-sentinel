<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Registry Source Distribution Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .chart-container {
            margin-top: 20px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Server Registry Source Distribution Analysis</h1>
    <p>This page displays the distribution of server registry sources, showing the top 5 most common sources and their counts.</p>

    <div id="chart-container" class="chart-container"></div>

    <table id="source-table">
        <thead>
            <tr>
                <th>Source</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data will be populated here -->
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/server-registry-source-distribution')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('table-body');
                    const ctx = document.getElementById('chart-container').getContext('2d');

                    // Populate table
                    Object.entries(data).forEach(([source, count]) => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${source}</td><td>${count}</td>`;
                        tableBody.appendChild(row);
                    });

                    // Create chart
                    const labels = Object.keys(data);
                    const counts = Object.values(data);

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Source Count',
                                data: counts,
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Definition History Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .dashboard-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 1200px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 16px;
            margin: 0 4px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button:hover {
            background-color: #45a049;
        }
        .pagination button.active {
            background-color: #45a049;
        }
        .pagination button.disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            margin: 20px 0;
        }
        .no-data {
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>MCP Definition History Dashboard</h1>
        <div id="loading" class="loading">Loading data...</div>
        <div id="noData" class="no-data" style="display: none;">No data available.</div>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Changed By</th>
                    <th>MCP ID</th>
                    <th>Changed Fields</th>
                    <th>Old Value</th>
                    <th>New Value</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- Data will be inserted here by JavaScript -->
            </tbody>
        </table>
        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tableBody = document.getElementById('historyTableBody');
            const loadingDiv = document.getElementById('loading');
            const noDataDiv = document.getElementById('noData');
            const paginationDiv = document.getElementById('pagination');

            let currentPage = 1;
            const itemsPerPage = 10;
            let historyData = [];

            // Function to fetch data from the API
            async function fetchHistoryData() {
                try {
                    // In a real implementation, this would be an API call
                    // For this example, we'll simulate the data
                    const response = await fetch('https://api.example.com/mcp_definition_history');
                    historyData = await response.json();

                    // Simulated data if API is not available
                    if (!historyData || historyData.length === 0) {
                        historyData = [
                            {
                                id: 1,
                                timestamp: '2023-01-01T10:00:00Z',
                                changed_by: 'admin',
                                mcp_id: 'MCP-001',
                                changed_fields: 'status, priority',
                                old_value: '{"status": "draft", "priority": "low"}',
                                new_value: '{"status": "published", "priority": "high"}'
                            },
                            {
                                id: 2,
                                timestamp: '2023-01-02T11:30:00Z',
                                changed_by: 'system',
                                mcp_id: 'MCP-002',
                                changed_fields: 'description',
                                old_value: '{"description": "Initial description"}',
                                new_value: '{"description": "Updated description"}'
                            },
                            {
                                id: 3,
                                timestamp: '2023-01-03T14:15:00Z',
                                changed_by: 'user1',
                                mcp_id: 'MCP-001',
                                changed_fields: 'assignee',
                                old_value: '{"assignee": "user1"}',
                                new_value: '{"assignee": "user2"}'
                            },
                            {
                                id: 4,
                                timestamp: '2023-01-04T09:45:00Z',
                                changed_by: 'admin',
                                mcp_id: 'MCP-003',
                                changed_fields: 'status, due_date',
                                old_value: '{"status": "in_progress", "due_date": "2023-01-10"}',
                                new_value: '{"status": "completed", "due_date": "2023-01-05"}'
                            },
                            {
                                id: 5,
                                timestamp: '2023-01-05T16:20:00Z',
                                changed_by: 'system',
                                mcp_id: 'MCP-004',
                                changed_fields: 'priority',
                                old_value: '{"priority": "medium"}',
                                new_value: '{"priority": "high"}'
                            },
                            {
                                id: 6,
                                timestamp: '2023-01-06T12:10:00Z',
                                changed_by: 'user2',
                                mcp_id: 'MCP-002',
                                changed_fields: 'status',
                                old_value: '{"status": "published"}',
                                new_value: '{"status": "archived"}'
                            },
                            {
                                id: 7,
                                timestamp: '2023-01-07T13:55:00Z',
                                changed_by: 'admin',
                                mcp_id: 'MCP-005',
                                changed_fields: 'description, assignee',
                                old_value: '{"description": "Initial", "assignee": "user1"}',
                                new_value: '{"description": "Updated", "assignee": "user3"}'
                            },
                            {
                                id: 8,
                                timestamp: '2023-01-08T08:30:00Z',
                                changed_by: 'system',
                                mcp_id: 'MCP-001',
                                changed_fields: 'priority',
                                old_value: '{"priority": "high"}',
                                new_value: '{"priority": "critical"}'
                            },
                            {
                                id: 9,
                                timestamp: '2023-01-09T15:45:00Z',
                                changed_by: 'user3',
                                mcp_id: 'MCP-003',
                                changed_fields: 'due_date',
                                old_value: '{"due_date": "2023-01-05"}',
                                new_value: '{"due_date": "2023-01-15"}'
                            },
                            {
                                id: 10,
                                timestamp: '2023-01-10T11:20:00Z',
                                changed_by: 'admin',
                                mcp_id: 'MCP-006',
                                changed_fields: 'status',
                                old_value: '{"status": "draft"}',
                                new_value: '{"status": "in_progress"}'
                            },
                            {
                                id: 11,
                                timestamp: '2023-01-11T14:05:00Z',
                                changed_by: 'system',
                                mcp_id: 'MCP-004',
                                changed_fields: 'assignee',
                                old_value: '{"assignee": "user2"}',
                                new_value: '{"assignee": "user1"}'
                            },
                            {
                                id: 12,
                                timestamp: '2023-01-12T09:50:00Z',
                                changed_by: 'user1',
                                mcp_id: 'MCP-005',
                                changed_fields: 'priority',
                                old_value: '{"priority": "medium"}',
                                new_value: '{"priority": "low"}'
                            }
                        ];
                    }

                    displayData();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    loadingDiv.style.display = 'none';
                    noDataDiv.style.display = 'block';
                    noDataDiv.textContent = 'Error loading data. Please try again later.';
                }
            }

            // Function to display data in the table
            function displayData() {
                if (historyData.length === 0) {
                    loadingDiv.style.display = 'none';
                    noDataDiv.style.display = 'block';
                    return;
                }

                loadingDiv.style.display = 'none';
                noDataDiv.style.display = 'none';

                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const paginatedData = historyData.slice(startIndex, endIndex);

                tableBody.innerHTML = '';

                paginatedData.forEach(item => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${new Date(item.timestamp).toLocaleString()}</td>
                        <td>${item.changed_by}</td>
                        <td>${item.mcp_id}</td>
                        <td>${item.changed_fields}</td>
                        <td>${item.old_value}</td>
                        <td>${item.new_value}</td>
                    `;

                    tableBody.appendChild(row);
                });

                renderPagination();
            }

            // Function to render pagination buttons
            function renderPagination() {
                paginationDiv.innerHTML = '';

                const totalPages = Math.ceil(historyData.length / itemsPerPage);

                if (totalPages <= 1) {
                    return;
                }

                // Previous button
                const prevButton = document.createElement('button');
                prevButton.textContent = 'Previous';
                prevButton.disabled = currentPage === 1;
                prevButton.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        displayData();
                    }
                });
                paginationDiv.appendChild(prevButton);

                // Page buttons
                for (let i = 1; i <= totalPages; i++) {
                    const pageButton = document.createElement('button');
                    pageButton.textContent = i;
                    pageButton.classList.toggle('active', i === currentPage);
                    pageButton.addEventListener('click', () => {
                        currentPage = i;
                        displayData();
                    });
                    paginationDiv.appendChild(pageButton);
                }

                // Next button
                const nextButton = document.createElement('button');
                nextButton.textContent = 'Next';
                nextButton.disabled = currentPage === totalPages;
                nextButton.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        displayData();
                    }
                });
                paginationDiv.appendChild(nextButton);
            }

            // Initial data fetch
            fetchHistoryData();
        });
    </script>
</body>
</html>

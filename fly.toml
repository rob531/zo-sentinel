# fly.toml app configuration file generated for zo-sentinel

app = "mcplookup" # Replace with your actual reserved Fly app name
primary_region = "ewr" # Or your preferred region

[deploy]
  # migrate-in-image on every release: alembic runs with the app's own
  # DATABASE_URL, so new tables are owned by the app role (no GRANT drift --
  # the score-disputes lesson).
  release_command = "alembic upgrade head"

[build]
  dockerfile = "Dockerfile"

[env]
  # Basic env vars go here. Database URLs and Secrets will be injected via flyctl secrets.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
